<title>Mossjar Terrarium</title>
<meta name="description" content="A pixel-art terrarium pet demo with procedurally animated frogs, lizards and salamanders.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0b110e;
  --panel:#121b16;
  --panel-2:#17231c;
  --line:#2a3b30;
  --line-hi:#3d5445;
  --text:#e1ead6;
  --muted:#8c9d88;
  --moss:#9cc563;
  --moss-dim:#5f7f3c;
  --amber:#f1b24e;
  --water:#63bac6;
  --rose:#ef8a8a;
  --display:"Silkscreen","Courier New",monospace;
  --body:"VT323","Courier New",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--body);font-size:20px;line-height:1.15;
  background-image:radial-gradient(ellipse at 30% 0%,#15231b 0%,transparent 60%);
}
.app{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:14px 24px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.04em;color:var(--moss)}
.brand small{font-weight:400;font-size:13px;color:var(--muted);letter-spacing:.12em;margin-left:8px;text-transform:uppercase}
.pet-id{margin-left:auto;display:flex;gap:10px;align-items:baseline}
.pet-id b{font-family:var(--display);font-size:18px;color:var(--text);cursor:pointer;border-bottom:2px dotted var(--line-hi)}
.pet-id span{color:var(--muted);font-size:18px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
.tank{background:#050806;border:2px solid var(--line);border-radius:3px;padding:6px;display:flex;justify-content:center;align-items:center;overflow:hidden;min-width:0}
#c{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:none;touch-action:none;max-width:100%}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:14px;display:flex;flex-direction:column;gap:14px}
.status{min-height:44px;font-size:22px;color:var(--text)}
.status em{font-style:normal;color:var(--amber)}
.label{font-family:var(--display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stats{display:flex;flex-direction:column;gap:8px}
.stat{display:grid;grid-template-columns:62px 1fr 30px;align-items:center;gap:8px}
.stat .label{font-size:10px}
.bar{height:12px;background:#0a0f0c;border:2px solid var(--line);position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--c,var(--moss));transition:width .25s linear}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,#0a0f0c 9px 11px)}
.num{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted);font-size:18px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px}
button{font-family:var(--display);font-size:12px;letter-spacing:.06em;color:var(--text);background:var(--panel-2);border:2px solid var(--line);border-bottom-width:4px;border-radius:2px;padding:8px 8px 6px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
button:hover{border-color:var(--line-hi)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
button[aria-pressed="true"]{background:#233524;border-color:var(--moss-dim);color:#f3ffe0}
button kbd{font-family:var(--display);font-size:10px;color:var(--muted);border:1px solid var(--line-hi);padding:0 4px;border-radius:2px}
button[aria-pressed="true"] kbd{color:var(--moss);border-color:var(--moss-dim)}
.foods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.foods button{justify-content:center;font-size:10px;letter-spacing:0;padding:6px 2px 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#muteBtn{grid-column:1/-1}
.row button{justify-content:center}
.hint{margin:0;color:var(--muted);font-size:18px;min-height:40px}
.picker{position:fixed;inset:0;background:rgba(6,10,8,.92);display:flex;align-items:center;justify-content:center;z-index:10;overflow:auto;padding-block:24px;padding-inline:16px}
.picker-inner{max-width:1180px;width:100%;display:flex;flex-direction:column;gap:18px}
.picker h1{font-family:var(--display);font-size:30px;margin:0;color:var(--moss);text-wrap:balance}
.picker p.lede{margin:0;color:var(--muted);font-size:21px;max-width:60ch}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:3px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card canvas{width:100%;aspect-ratio:112/72;image-rendering:pixelated;display:block;background:#000;border:2px solid #050806}
.card h2{font-family:var(--display);font-size:16px;margin:0}
.card .latin{color:var(--muted);font-size:17px;margin-top:-6px}
.card p{margin:0;font-size:19px;color:#c7d3bf;flex:1}
.card button{justify-content:center;font-size:13px;background:#233524;border-color:var(--moss-dim)}
@media (max-width:880px){
  .stage{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
  .card canvas{max-width:420px}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

<div class="app">
  <header class="top">
    <div class="brand">Mossjar<small>pixel terrarium</small></div>
    <div class="pet-id"><b id="petName" title="Click for a new name">—</b><span id="petKind"></span><span id="clock">day</span></div>
  </header>
  <div class="stage">
    <div class="tank" id="tank"><canvas id="c" width="320" height="180" aria-label="Terrarium"></canvas></div>
    <aside class="panel">
      <div class="status" id="status">…</div>
      <div class="stats">
        <div class="stat"><span class="label">Fed</span><div class="bar"><i id="barFed" style="--c:var(--amber)"></i></div><span class="num" id="numFed">0</span></div>
        <div class="stat"><span class="label">Water</span><div class="bar"><i id="barWater" style="--c:var(--water)"></i></div><span class="num" id="numWater">0</span></div>
        <div class="stat"><span class="label">Happy</span><div class="bar"><i id="barHappy" style="--c:var(--rose)"></i></div><span class="num" id="numHappy">0</span></div>
      </div>
      <div>
        <div class="label" style="margin-bottom:6px">Tools</div>
        <div class="tools" id="tools">
          <button id="tool-feed" data-tool="feed"><kbd>1</kbd>Feed</button>
          <button id="tool-pet" data-tool="pet"><kbd>2</kbd>Pet</button>
          <button id="tool-grab" data-tool="grab"><kbd>3</kbd>Grab</button>
          <button id="tool-mist" data-tool="mist"><kbd>4</kbd>Mist</button>
          <button id="tool-tap" data-tool="tap"><kbd>5</kbd>Tap glass</button>
          <button id="lightBtn"><kbd>L</kbd>Lights</button>
        </div>
      </div>
      <div>
        <div class="label" style="margin-bottom:6px">Food <span style="letter-spacing:0">(F to cycle)</span></div>
        <div class="foods" id="foods">
          <button id="food-cricket" data-food="cricket">Cricket</button>
          <button id="food-worm" data-food="worm">Mealworm</button>
          <button id="food-waxworm" data-food="waxworm">Waxworm</button>
          <button id="food-fly" data-food="fly">Fly</button>
          <button id="food-snail" data-food="snail">Snail</button>
          <button id="food-fruit" data-food="fruit">Berry</button>
          <button id="food-egg" data-food="egg">Egg</button>
        </div>
      </div>
      <p class="hint" id="hint"></p>
      <div class="row"><button id="swapBtn">Swap pet</button><button id="renameBtn">Rename</button><button id="muteBtn"><kbd>M</kbd>Sound on</button></div>
    </aside>
  </div>
</div>

<div class="picker" id="picker">
  <div class="picker-inner">
    <h1>Pick a pet for the jar</h1>
    <p class="lede">Every body, leg, claw and tongue is simulated live: spines, foot-planting IK, hop arcs, a swallow you can watch. Choose who moves in.</p>
    <div class="cards" id="cards"></div>
  </div>
</div>

<script>
'use strict';
// =====================================================================
//  Core utilities
// =====================================================================
const W=320,H=180,N=W*H,TAU=Math.PI*2;
const TANK={x0:8,y0:8,x1:312,y1:172};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rand=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const wrapA=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a;};
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function hash(x,y){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  return lerp(lerp(hash(xi,yi),hash(xi+1,yi),u),lerp(hash(xi,yi+1),hash(xi+1,yi+1),u),v);}
function fbm(x,y,o=4){let s=0,a=.5,f=1;for(let i=0;i<o;i++){s+=a*vnoise(x*f,y*f);a*=.5;f*=2.03;}return s;}
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
const bay=(x,y)=>BAYER[(y&3)*4+(x&3)];
const rgb=(r,g,b)=>(0xff000000|(clamp(b,0,255)&255)<<16|(clamp(g,0,255)&255)<<8|(clamp(r,0,255)&255))>>>0;
const hex=h=>{const n=parseInt(h.slice(1),16);return rgb(n>>16&255,n>>8&255,n&255);};
const ramp=(...a)=>a.map(hex);
const shade=(c,f)=>rgb((c&255)*f,(c>>8&255)*f,(c>>>16&255)*f);
const mixc=(a,b,t)=>rgb(lerp(a&255,b&255,t),lerp(a>>8&255,b>>8&255,t),lerp(a>>>16&255,b>>>16&255,t));

// =====================================================================
//  Sound: everything synthesized with Web Audio (no files)
// =====================================================================
const SFX=(()=>{
  let ac=null,master=null,nbuf=null,muted=false,mist=null,buzz=null;const last={};
  try{muted=localStorage.getItem('mossjar.mute')==='1';}catch(e){}
  function init(){
    if(ac){if(ac.state==='suspended')ac.resume();return;}
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    try{ac=new C();}catch(e){ac=null;return;}
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;
    master=ac.createGain();master.gain.value=muted?0:0.5;master.connect(comp);comp.connect(ac.destination);
    nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  const J=()=>1+(Math.random()-.5)*0.1;
  function tone(f,dur,o={}){
    const t=ac.currentTime+(o.delay||0),osc=ac.createOscillator(),g=ac.createGain(),j=o.nojit?1:J(),v=o.gain||0.3,a=o.attack||0.005;
    osc.type=o.type||'sine';osc.frequency.setValueAtTime(f*j,t);if(o.to)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.to*j),t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+dur+0.03);
  }
  function noise(dur,o={}){
    const t=ac.currentTime+(o.delay||0),src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain(),v=o.gain||0.3;
    src.buffer=nbuf;f.type=o.filter||'bandpass';f.frequency.setValueAtTime((o.freq||1000)*J(),t);if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+dur);f.Q.value=o.q||1;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.attack||0.004));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f);f.connect(g);g.connect(master);src.start(t,Math.random()*0.5);src.stop(t+dur+0.03);
  }
  const S={
    hop:len=>{len=len||8;tone(210,0.13,{type:'triangle',to:480+len*14,gain:0.2});tone(420,0.07,{type:'square',to:880,gain:0.025});},
    land:()=>{noise(0.09,{filter:'lowpass',freq:520,gain:0.28});tone(110,0.08,{to:60,gain:0.22});},
    thwip:()=>{tone(1500,0.09,{type:'sawtooth',to:280,gain:0.045});noise(0.06,{freq:3200,q:2,gain:0.08});},
    swish:()=>noise(0.12,{freq:1400,to:4200,q:1.5,gain:0.12}),
    catch:()=>{tone(900,0.035,{type:'square',to:280,gain:0.07});noise(0.03,{freq:2600,q:3,gain:0.14});},
    chew:()=>noise(0.045,{freq:rand(1800,3200),q:4,gain:0.13}),
    gulp:()=>{tone(320,0.18,{to:105,gain:0.3});tone(880,0.12,{delay:0.15,type:'triangle',gain:0.06});tone(1320,0.16,{delay:0.22,type:'triangle',gain:0.05});},
    step:()=>noise(0.018,{freq:3500,q:4,gain:0.035}),
    flick:()=>{tone(2400,0.02,{gain:0.03});tone(2650,0.02,{delay:0.05,gain:0.03});},
    plip:()=>tone(850,0.08,{to:1500,gain:0.1}),
    drip:()=>tone(rand(1700,2600),0.04,{to:3000,gain:0.025}),
    tap:()=>{tone(1500,0.04,{gain:0.05});noise(0.03,{filter:'lowpass',freq:900,gain:0.1});},
    buzz:()=>tone(200,0.22,{type:'sawtooth',to:250,gain:0.035}),
    chirp:()=>{for(let r=0;r<2;r++)for(let k=0;k<3;k++)tone(4300,0.035,{delay:r*0.28+k*0.06,gain:0.028,nojit:true});},
    tink:()=>{tone(3200,0.28,{gain:0.12,nojit:true});tone(4800,0.2,{gain:0.05,nojit:true});tone(140,0.12,{to:70,gain:0.32});noise(0.03,{freq:5000,gain:0.1});},
    heart:()=>{tone(880,0.12,{type:'triangle',gain:0.07});tone(1320,0.16,{type:'triangle',delay:0.08,gain:0.06});},
    squeak:()=>{tone(1150,0.1,{type:'triangle',to:1900,gain:0.07});tone(1750,0.09,{delay:0.08,type:'triangle',to:1250,gain:0.05});},
    scuttle:()=>{for(let i=0;i<6;i++)noise(0.02,{delay:i*0.035,freq:3000,q:3,gain:0.08});},
    lightsOff:()=>{noise(0.02,{freq:4000,gain:0.2});tone(220,0.9,{attack:0.25,gain:0.06});tone(330,1.0,{attack:0.35,gain:0.04});},
    lightsOn:()=>{noise(0.02,{freq:4000,gain:0.2});tone(660,0.15,{delay:0.05,type:'triangle',gain:0.06});tone(990,0.22,{delay:0.13,type:'triangle',gain:0.05});},
    croak:()=>{for(let k=0;k<2;k++){tone(125,0.13,{type:'sawtooth',delay:k*0.17,to:96,gain:0.05});noise(0.12,{delay:k*0.17,filter:'lowpass',freq:400,gain:0.08});}},
    hum:()=>tone(165,0.55,{attack:0.18,to:140,gain:0.02}),
    ui:()=>tone(1500,0.02,{type:'square',gain:0.02}),
    hiss:()=>noise(0.55,{freq:5200,q:0.7,gain:0.1,attack:0.06}),
    tick:()=>{tone(2600,0.02,{type:'square',gain:0.03});tone(3400,0.015,{delay:0.03,type:'square',gain:0.02});},
    snap:()=>{tone(1900,0.03,{type:'square',to:900,gain:0.05});noise(0.02,{freq:3600,q:3,gain:0.12});},
    tok:()=>{tone(360,0.09,{type:'triangle',to:250,gain:0.16});tone(720,0.05,{gain:0.04});},
    cstep:()=>noise(0.012,{freq:5200,q:5,gain:0.03}),
    squish:()=>{noise(0.08,{filter:'lowpass',freq:900,to:300,gain:0.18});tone(260,0.06,{to:180,gain:0.06});},
    swallow:()=>{tone(210,0.45,{to:95,gain:0.18,attack:0.05});tone(150,0.4,{delay:0.35,to:70,gain:0.13,attack:0.05});},
    squelch:()=>noise(0.1,{freq:700,q:3,gain:0.09}),
    sparkle:()=>{tone(1760,0.12,{type:'triangle',gain:0.05});tone(2217,0.12,{delay:0.06,type:'triangle',gain:0.045});tone(2637,0.2,{delay:0.12,type:'triangle',gain:0.04});},
  };
  const GAP={step:0.05,drip:0.03,chew:0.08,heart:0.1,catch:0.1,tap:0.05,cstep:0.06,tick:0.05,hiss:0.8,snap:0.08,squelch:0.4};
  let slit=null;
  function play(name,arg){
    if(!ac||muted||!S[name])return;const now=ac.currentTime;
    if(last[name]!==undefined&&now-last[name]<(GAP[name]??0.03))return;last[name]=now;
    try{S[name](arg);}catch(e){}
  }
  function mistOn(on){
    if(!ac)return;const now=ac.currentTime;
    if(on&&!mist&&!muted){const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
      src.buffer=nbuf;src.loop=true;f.type='bandpass';f.frequency.value=3200;f.Q.value=0.7;g.gain.setValueAtTime(0,now);g.gain.setTargetAtTime(0.13,now,0.04);
      src.connect(f);f.connect(g);g.connect(master);src.start();mist={src,g};}
    else if(!on&&mist){mist.g.gain.setTargetAtTime(0,now,0.06);mist.src.stop(now+0.4);mist=null;}
  }
  function buzzLevel(v){
    if(!ac)return;
    if(!buzz){if(v<=0)return;const o=ac.createOscillator(),lfo=ac.createOscillator(),ld=ac.createGain(),f=ac.createBiquadFilter(),g=ac.createGain();
      o.type='sawtooth';o.frequency.value=195;lfo.frequency.value=7;ld.gain.value=14;lfo.connect(ld);ld.connect(o.frequency);
      f.type='bandpass';f.frequency.value=650;f.Q.value=2;g.gain.value=0;o.connect(f);f.connect(g);g.connect(master);o.start();lfo.start();buzz={g,lfo};}
    buzz.lfo.frequency.setTargetAtTime(6+Math.sin(ac.currentTime*1.3)*2,ac.currentTime,0.2);
    buzz.g.gain.setTargetAtTime(muted?0:v,ac.currentTime,0.15);
  }
  function slither(v){
    if(!ac)return;
    if(!slit){if(v<=0)return;const src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();
      src.buffer=nbuf;src.loop=true;f.type='lowpass';f.frequency.value=1200;f.Q.value=0.5;g.gain.value=0;src.connect(f);f.connect(g);g.connect(master);src.start();slit={g,f};}
    slit.g.gain.setTargetAtTime(muted?0:v,ac.currentTime,0.1);slit.f.frequency.setTargetAtTime(700+v*9000,ac.currentTime,0.1);
  }
  function setMuted(m){muted=m;try{localStorage.setItem('mossjar.mute',m?'1':'0');}catch(e){}
    if(master)master.gain.setTargetAtTime(m?0:0.5,ac.currentTime,0.02);if(m)mistOn(false);}
  return{init,play,mistOn,buzzLevel,slither,setMuted,get muted(){return muted;}};
})();
window.addEventListener('pointerdown',()=>SFX.init(),true);
window.addEventListener('keydown',()=>SFX.init(),true);

// =====================================================================
//  Framebuffer + layered capsule rasterizer
//  Each pixel of the "layer" keeps a material, a class (draw priority),
//  a pseudo-3D surface normal and body-space coords (s along, lat across).
// =====================================================================
class FB{
  constructor(w,h){
    this.w=w;this.h=h;this.img=new ImageData(w,h);this.px=new Uint32Array(this.img.data.buffer);
    const n=w*h;
    this.mat=new Uint8Array(n);this.cls=new Uint8Array(n);this.key=new Float32Array(n);
    this.nx=new Float32Array(n);this.ny=new Float32Array(n);this.ss=new Float32Array(n);this.ll=new Float32Array(n);
    this.stamp=new Uint32Array(n);this.sid=1;
    this.bx0=w;this.by0=h;this.bx1=-1;this.by1=-1;
  }
  touch(x0,y0,x1,y1){if(x0<this.bx0)this.bx0=x0;if(y0<this.by0)this.by0=y0;if(x1>this.bx1)this.bx1=x1;if(y1>this.by1)this.by1=y1;}
  clearLayer(){
    if(this.bx1<0)return;
    for(let y=this.by0;y<=this.by1;y++){const o=y*this.w;this.mat.fill(0,o+this.bx0,o+this.bx1+1);}
    this.bx0=this.w;this.by0=this.h;this.bx1=-1;this.by1=-1;
  }
  cap(ax,ay,ar,bx,by,br,mat,cls,sa=0,sb=0,bias=0){
    const w=this.w,h=this.h;
    const x0=Math.max(0,Math.floor(Math.min(ax-ar,bx-br))),x1=Math.min(w-1,Math.ceil(Math.max(ax+ar,bx+br)));

const FOODS={cricket:{name:'a cricket',label:'cricket',value:18},worm:{name:'a mealworm',label:'mealworms',value:22},
  waxworm:{name:'a waxworm',label:'waxworms',value:26},fly:{name:'a fly',label:'flies',value:10},
  snail:{name:'a snail',label:'snails',value:20},fruit:{name:'a strawberry',label:'fruit',value:16},egg:{name:'a quail egg',label:'eggs',value:30}};
const FOOD_ORDER=['cricket','worm','waxworm','fly','snail','fruit','egg'];
const CRUMB={cricket:hex('#6a4a2a'),worm:hex('#c89a4a'),waxworm:hex('#f0e0c0'),snail:hex('#8a7a6a'),fruit:hex('#d83040'),egg:hex('#f0e8d0'),fly:hex('#303030')};
const PREY_NAME=Object.fromEntries(Object.entries(FOODS).map(([k,v])=>[k,v.name]));

// =====================================================================
//  Shared pet brain (state machine)
// =====================================================================
class Pet{
  initCommon(world,kind){
    this.world=world;this.kind=kind;this.state='idle';this.timer=1;this.scanT=rand(.5);
    this.held=null;this.tg=null;this.t=rand(10);this.blinkT=rand(2,5);this.blink=0;this.zzT=0;this.fxT=0;
    this.eyesClosed=false;this.preview=false;this.prey=null;this.tx=0;this.ty=0;this.pace='walk';
  }
  isActive(){if(this.preview)return true;const d=this.world.dayness;return(this.kind==='lizard'||this.kind==='snake')?d>0.5:d<0.5;}
  flick(){}
  randomSpot(m=18){const B=this.world.bounds;return[rand(B.x0+m,B.x1-m),rand(B.y0+m,B.y1-m)];}
  decide(){
    const w=this.world,S=w.stats,act=this.isActive();
    if(w.dish&&S.water<50&&Math.random()<0.75){
      const d=w.dish,hd=this.headPos(),a=Math.atan2(hd.y-d.y,hd.x-d.x);
      const r=this.kind==='frog'?0:d.rw-1.5;[this.tx,this.ty]=[d.x+Math.cos(a)*r,d.y+Math.sin(a)*r];
      this.state='drink';this.timer=15;return;}
    if(w.hide&&!act&&Math.random()<0.7){
      if(this.kind==='snake'){this.tx=w.hide.x+w.hide.len/2+16;this.ty=w.hide.y-8;}
      else{this.tx=w.hide.x+rand(-8,8);this.ty=w.hide.y+rand(-3,3);}
      this.state='sleep';this.timer=20;return;}
    if(w.lampRock&&(this.kind==='lizard'||this.kind==='snake')&&w.dayness>0.5&&Math.random()<0.35){
      this.tx=w.lampRock.x+rand(-6,6);this.ty=w.lampRock.y+rand(-3,3);this.state='bask';this.timer=15;return;}
    if(!act&&Math.random()<0.5){this.state='idle';this.timer=rand(3,6);return;}
    [this.tx,this.ty]=this.randomSpot();this.pace=act?(Math.random()<0.2?'slow':'walk'):'slow';
    this.state='wander';this.timer=14;
  }
  scanPrey(dt,rad){
    this.scanT-=dt;if(this.scanT>0)return false;this.scanT=0.3;
    const w=this.world,S=w.stats;if(!w.prey.length)return false;
    if(S.fed>94)return false;if(S.fed>78&&Math.random()<0.5)return false;
    rad=rad||(this.isActive()?130:70);
    const hd=this.headPos();let best=null,bd=rad;
    const diet=DIET[this.kind];
    for(const p of w.prey){if(p.dead||p.caught||!(diet[p.type]>0))continue;if(this.kind!=='frog'&&p.h>14)continue;
      const d=Math.hypot(p.x-hd.x,p.y-hd.y)*(p.inHand?0.5:1);if(d<bd){bd=d;best=p;}}
    if(!best)return false;
    this.prey=best;this.state='hunt';this.timer=14;return true;
  }
  brain(dt){
    const w=this.world,S=w.stats;this.timer-=dt;this.eyesClosed=false;
    switch(this.state){
      case 'idle':this.stop(dt);if(this.scanPrey(dt))break;if(this.timer<=0)this.decide();break;
      case 'wander':
        if(this.scanPrey(dt))break;
        if(this.goTo(this.tx,this.ty,dt,this.pace,4)||this.timer<=0){this.state='idle';this.timer=rand(0.8,3.5);}
        break;
      case 'hunt':{const p=this.prey;
        if(!p||p.dead||p.caught||this.timer<=0){this.state='idle';this.timer=rand(.3,1);this.prey=null;break;}
        if(this.canStrike(p)){this.startStrike(p);this.state='strike';break;}
        const hd=this.headPos(),d=Math.hypot(p.x-hd.x,p.y-hd.y);
        this.goTo(p.x,p.y,dt,d<40?'stalk':'walk',1);
        if(this.kind!=='frog'&&Math.random()<dt*1.2)this.flick();
        break;}
      case 'strike':{const r=this.updateStrike(dt);
        if(r==='caught'){this.state='chew';this.timer=this.kind==='frog'?0.7:this.kind==='snake'?1.8:this.kind==='crab'?2.6:1.3;this.fxT=0.3;
          if(this.kind==='snake'&&!this.preview)SFX.play('swallow');}
        else if(r==='miss'){this.state='idle';this.timer=rand(.4,1);}
        break;}
      case 'chew':
        this.stop(dt);if(this.kind==='frog')this.eyesClosed=true;
        this.fxT-=dt;if(this.fxT<=0&&this.kind!=='frog'&&this.kind!=='snake'){const crab=this.kind==='crab';this.fxT=crab?0.62:0.25;const m=this.mouthScreen();
          if(!this.preview)SFX.play(crab?'snap':'chew');if(crab&&this.held)this.held.bites=Math.min(3,(this.held.bites||0)+1);
          const cc=CRUMB[this.held?.type];for(let i=0;i<(crab?2:1);i++)spawn(w,'crumb',m.x,m.y+this.h,{h:this.h+1,vh:rand(10,30),vx:rand(-12,12),vy:rand(-8,8),life:1.5,c:cc});}
        if(this.timer<=0){this.finishEating();this.state='idle';this.timer=rand(1,2);}
        break;
      case 'drink':
        if(this.goTo(this.tx,this.ty,dt,'walk',2.5)){this.state='drinking';this.timer=rand(3,4.5);}
        else if(this.timer<=0){this.state='idle';this.timer=1;}
        break;
      case 'drinking':{this.stop(dt);if(this.faceToward)this.faceToward(w.dish.x,w.dish.y,dt);
        S.water=Math.min(100,S.water+14*dt);
        this.fxT-=dt;if(this.fxT<=0){this.fxT=0.55;const m=this.kind==='frog'?{x:this.x,y:this.y}:this.headPos();w.ripples.push({x:m.x,y:m.y,age:0});SFX.play('plip');}
        if(this.kind==='frog')S.happy=Math.min(100,S.happy+1.5*dt);
        if(this.timer<=0||S.water>=100){this.state='idle';this.timer=rand(1,2);}
        break;}
      case 'bask':
        if(this.goTo(this.tx,this.ty,dt,'walk',3)){if(this.kind==='snake')this.startCoil('basking');else{this.state='basking';this.timer=rand(7,13);}}
        else if(this.timer<=0){this.state='idle';this.timer=1;}
        break;
      case 'basking':
        this.stop(dt);S.happy=Math.min(100,S.happy+1.4*dt);this.eyesClosed=Math.sin(this.t*0.9)>0.4;
        this.fxT-=dt;if(this.fxT<=0){this.fxT=0.35;const p=this.pts[Math.floor(this.n*0.3)];spawn(w,'spark',p.x+rand(-4,4),p.y+rand(-3,3),{life:1.1});}
        if(this.scanPrey(dt,50))break;
        if(this.timer<=0){this.state='idle';this.timer=rand(1,2);}
        break;
      case 'sleep':
        if(this.goTo(this.tx,this.ty,dt,this.isActive()?'walk':'slow',3)){if(this.kind==='snake')this.startCoil('sleeping');else{this.state='sleeping';this.timer=rand(10,20);}}
        else if(this.timer<=0){this.state='sleeping';this.timer=rand(8,14);}
        break;
      case 'sleeping':{
        this.stop(dt);this.eyesClosed=true;
        this.zzT-=dt;if(this.zzT<=0){this.zzT=1.5;const hd=this.headPos();spawn(w,'zzz',hd.x+2,hd.y-6-this.h,{life:2.2});if(!this.preview)SFX.play('hum');}
        if(S.fed<45&&this.scanPrey(dt,45))break;
        if(this.timer<=0){if(this.isActive()||Math.random()<0.35){this.state='idle';this.timer=rand(1,2);}else this.timer=rand(8,15);}
        break;}
      case 'flee':
        if(this.goTo(this.tx,this.ty,dt,'run',4)||this.timer<=0){this.state='idle';this.timer=rand(1.5,3);}
        break;
      case 'coiling':{const C=this.coil;
        C.a+=dt*(this.sp.slow/Math.max(C.r,3));C.r=Math.max(3,C.r-dt*1.4);
        this.goTo(C.cx+Math.cos(C.a+0.7)*C.r,C.cy+Math.sin(C.a+0.7)*C.r,dt,'slow',0.2);
        if(C.r<=3.05){this.state=C.next;this.timer=C.next==='sleeping'?rand(12,22):rand(8,14);}
        break;}
      case 'petted':
        this.stop(dt);this.eyesClosed=true;if(this.kind==='snake'&&Math.random()<dt*2)this.flick();
        if(this.timer<=0){this.state='idle';this.timer=rand(1,2.5);}
        break;
    }
  }
  startCoil(next){
    const hd=this.pts[0],B=this.world.bounds,a=this.ang+Math.PI/2;
    const cx=clamp(hd.x+Math.cos(a)*10,B.x0+14,B.x1-14),cy=clamp(hd.y+Math.sin(a)*10,B.y0+14,B.y1-14);
    this.coil={cx,cy,a:Math.atan2(hd.y-cy,hd.x-cx),r:10,next};this.state='coiling';this.timer=12;
  }
  finishEating(){
    const p=this.held;if(!p)return;
    const w=this.world,S=w.stats;p.dead=true;
    S.fed=Math.min(100,S.fed+p.value);S.happy=Math.min(100,S.happy+(DIET[this.kind][p.type]||2));
    if(this.bulges&&this.kind==='snake')this.bulges.push({s:2.5,size:p.type==='egg'?1.6:0.9});
    const m=this.mouthScreen();
    for(let i=0;i<2;i++)spawn(w,'heart',m.x+rand(-3,3),m.y-4,{vy:-rand(12,18),life:1.3,ph:rand(TAU)});
    w.onEvent&&w.onEvent(`${this.kind==='snake'?'swallowed':this.kind==='crab'?'polished off':'gulped down'} ${PREY_NAME[p.type]}`);
    if(!this.preview&&this.kind!=='snake')SFX.play('gulp');
    this.held=null;
  }
  petMe(){
    if(['grabbed','fall','strike','chew'].includes(this.state))return false;
    if(this.state!=='petted'&&this.state!=='sleeping'){this.state='petted';}
    if(this.state==='petted')this.timer=0.8;
    this.world.stats.happy=Math.min(100,this.world.stats.happy+0.12);
    return true;
  }
  startle(x,y){
    if(this.state==='grabbed'||this.state==='fall')return;
    if(this.held)this.finishEating();
    this.tg=null;this.prey=null;
    const hd=this.headPos(),B=this.world.bounds;let dx=hd.x-x,dy=hd.y-y;const d=Math.hypot(dx,dy)||1;
    this.tx=clamp(hd.x+dx/d*60+rand(-10,10),B.x0+10,B.x1-10);this.ty=clamp(hd.y+dy/d*60+rand(-10,10),B.y0+10,B.y1-10);
    this.state='flee';this.timer=2.5;SFX.play(this.kind==='snake'?'hiss':'scuttle');
  }
  statusText(){
    const s=this.state,f=this.kind==='frog';
    switch(s){
      case 'idle':return this.isActive()?'is watching the tank':'is dozing';
      case 'wander':return this.pace==='slow'?'is pottering around':'is exploring';
      case 'hunt':return `is stalking ${PREY_NAME[this.prey?.type]||'something'}`;
      case 'strike':return 'strikes!';
      case 'chew':return `is munching ${PREY_NAME[this.held?.type]||''}`;
      case 'drink':return f?'is hopping to the water':'is heading for water';
      case 'drinking':return f?'is soaking in the dish':'is drinking';
      case 'bask':return 'is heading to the warm rock';
      case 'basking':return 'is basking under the lamp';
      case 'sleep':return 'is looking for the hide';
      case 'sleeping':return 'is asleep';
      case 'flee':return 'got startled!';
      case 'petted':return 'is enjoying the attention';
      case 'grabbed':return 'is being held (and has opinions)';
      case 'fall':return 'is landing';
      case 'coiling':return 'is coiling up';
      case 'hiding':return 'is hiding in its shell';
    }return '';
  }
}

// =====================================================================
//  Walker: lizard + salamander.  Spine chain + 4 IK legs with gait.
// =====================================================================
class Walker extends Pet{
  constructor(world,kind,x,y){
    super();this.initCommon(world,kind);
    const sp=this.sp=SPECIES[kind];
    this.n=sp.n;this.seg=sp.seg;this.len=(sp.n-1)*sp.seg;this.ang=rand(TAU);this.headAng=this.ang;
    this.pts=[];for(let i=0;i<this.n;i++){const px=x-Math.cos(this.ang)*i*this.seg,py=y-Math.sin(this.ang)*i*this.seg;this.pts.push({x:px,y:py,px,py});}
    this.speed=0;this.phase=0;this.h=0;this.vh=0;this.tongueT=0;this.tongueDur=0.26;
    this.outline=hex(sp.outline);
    this.legs=[];this.bulges=[];
    for(let k=0;k<(sp.legIdx.length?4:0);k++){const front=k<2;this.legs.push({idx:front?sp.legIdx[0]:sp.legIdx[1],side:k%2?1:-1,front,
      ax:0,ay:0,rx:0,ry:0,fx:0,fy:0,sx:0,sy:0,st:0,dur:.15,stepping:false,lift:0});}
    this.updateLegs(0,false);for(const L of this.legs){L.fx=L.rx;L.fy=L.ry;}
  }
  color(m,q,s,l,x,y){return this.sp.paint.call(this,m,q,s,l,x,y);}
  radiusAt(t){const P=this.sp.profile;for(let i=1;i<P.length;i++){if(t<=P[i][0]){const a=P[i-1],b=P[i],k=(t-a[0])/(b[0]-a[0]);return lerp(a[1],b[1],k*k*(3-2*k));}}return P[P.length-1][1];}
  rad(i){let r=this.radiusAt(i/(this.n-1));for(const b of this.bulges){const d=(i*this.seg-b.s)/2.4;r+=b.size*Math.exp(-d*d);}return r;}
  pointAt(s){const f=s/this.seg,i=clamp(Math.floor(f),0,this.n-2),t=clamp(f-i,0,1),a=this.pts[i],b=this.pts[i+1];
    let fx=a.x-b.x,fy=a.y-b.y;const l=Math.hypot(fx,fy)||1;return{x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),fx:fx/l,fy:fy/l,r:this.radiusAt(clamp(s/this.len,0,1))};}
  headPos(){return this.pts[0];}
  mouthScreen(){const h=this.pts[0];return{x:h.x+Math.cos(this.headAng)*0.6,y:h.y+Math.sin(this.headAng)*0.6-this.h};}
  noise(){return clamp(this.speed/this.sp.walk,0,1.5);}
  flick(){if(this.tongueT<=0){this.tongueT=this.tongueDur;if(!this.preview)SFX.play('flick');}}
  goTo(tx,ty,dt,mode,arrive=3){
    const sp=this.sp,hd=this.pts[0],d=Math.hypot(tx-hd.x,ty-hd.y);
    const max=mode==='run'?sp.run:mode==='stalk'?sp.stalk:mode==='slow'?sp.slow:mode==='lunge'?sp.run*1.5:sp.walk;
    const diff=wrapA(Math.atan2(ty-hd.y,tx-hd.x)-this.ang),tr=sp.turn*(mode==='lunge'?2.2:mode==='run'?1.4:1);
    this.ang+=clamp(diff,-tr*dt,tr*dt);
    let want=d>arrive?max:0;if(Math.abs(diff)>1.2&&mode!=='lunge')want*=0.35;
    if(d<arrive+8&&mode!=='lunge')want*=clamp((d-arrive)/8,0.25,1);
    this.speed+=(want-this.speed)*Math.min(1,dt*(mode==='lunge'?14:6));
    return d<=arrive;
  }
  stop(dt){this.speed+=(0-this.speed)*Math.min(1,dt*8);}
  faceToward(x,y,dt){const hd=this.pts[0];const diff=wrapA(Math.atan2(y-hd.y,x-hd.x)-this.ang);this.ang+=clamp(diff,-2*dt,2*dt);}
  canStrike(p){const hd=this.pts[0],d=Math.hypot(p.x-hd.x,p.y-hd.y);
    return p.h<(p.inHand?11:5)&&d<this.sp.strike&&Math.abs(wrapA(Math.atan2(p.y-hd.y,p.x-hd.x)-this.ang))<0.6;}
  startStrike(p){this.tg={t:0,p,lunged:false};}
  updateStrike(dt){
    const T=this.tg;if(!T)return 'miss';const p=T.p;T.t+=dt;
    if(p.dead||p.caught){this.tg=null;return 'miss';}
    const coil=this.sp.coil||0,hd=this.pts[0];
    if(T.t<coil){// snake: draw the head back into an S before striking
      this.ang+=clamp(wrapA(Math.atan2(p.y-hd.y,p.x-hd.x)-this.ang),-6*dt,6*dt);
      this.speed+=(0-this.speed)*Math.min(1,dt*14);return null;}
    if(!T.lunged){T.lunged=true;if(!this.preview)SFX.play('swish');}
    this.goTo(p.x,p.y,dt,'lunge',0);
    if(Math.hypot(p.x-hd.x,p.y-hd.y)<3.6&&p.h<(p.inHand?11:6)){p.caught=true;this.held=p;this.tg=null;this.speed*=0.2;catchFx(this,p);return 'caught';}
    if(T.t>coil+0.4){this.tg=null;return 'miss';}
    return null;
  }
  update(dt){
    this.t+=dt;
    this.blinkT-=dt;if(this.blinkT<0){this.blink=0.13;this.blinkT=rand(2.5,6);}if(this.blink>0)this.blink-=dt;
    if(this.tongueT>0)this.tongueT-=dt;
    if(this.bulges.length){for(const b of this.bulges)b.s+=13*dt;this.bulges=this.bulges.filter(b=>b.s<this.len+4);}
    if(this.state==='grabbed'){this.grabStep(dt);this.syncHeld();if(this.kind==='snake'&&Math.random()<dt*0.3)SFX.play('hiss');return;}
    if(this.state==='fall'){
      this.vh-=320*dt;this.h+=this.vh*dt;
      if(this.h<=0){this.h=0;this.vh=0;this.state='idle';this.timer=0.8;SFX.play('land');dust(this.world,this.pts[Math.floor(this.n*.3)].x,this.pts[Math.floor(this.n*.3)].y,6);}
      this.follow();this.updateLegs(dt,this.h>2);return;
    }
    this.brain(dt);
    const fl=this.state==='idle'||this.state==='wander'||this.state==='hunt'?1:0.25;if(Math.random()<dt*(this.sp.flickRate||0.2)*fl)this.flick();
    this.integrate(dt);this.syncHeld();
  }
  syncHeld(){if(this.held){const m=this.mouthScreen();this.held.sx=m.x;this.held.sy=m.y;}}
  integrate(dt){
    const sp=this.sp,hd=this.pts[0],B=this.world.bounds;
    const wob=Math.sin(this.phase)*sp.wave*clamp(this.speed/sp.walk,0,1.3)+(this.state==='chew'?Math.sin(this.t*24)*0.18:0);
    const a=this.ang+wob;this.headAng=a;
    hd.x+=Math.cos(a)*this.speed*dt;hd.y+=Math.sin(a)*this.speed*dt;
    let bump=false;
    if(hd.x<B.x0){hd.x=B.x0;bump=true;}if(hd.x>B.x1){hd.x=B.x1;bump=true;}
    if(hd.y<B.y0){hd.y=B.y0;bump=true;}if(hd.y>B.y1){hd.y=B.y1;bump=true;}
    if(bump&&this.state==='wander')[this.tx,this.ty]=this.randomSpot();
    this.phase+=this.speed*dt*sp.waveFreq;
    this.follow();this.updateLegs(dt,false);
  }
  follow(){
    const P=this.pts,seg=this.seg,mb=this.sp.maxBend;let prev=this.headAng+Math.PI;
    for(let i=1;i<this.n;i++){const q=P[i-1],p=P[i];
      let a=Math.atan2(p.y-q.y,p.x-q.x);a=prev+clamp(wrapA(a-prev),-mb,mb);
      p.x=q.x+Math.cos(a)*seg;p.y=q.y+Math.sin(a)*seg;p.px=p.x;p.py=p.y;prev=a;}
  }
  updateLegs(dt,flail){
    const sp=this.sp,vx=Math.cos(this.ang)*this.speed,vy=Math.sin(this.ang)*this.speed,moving=this.speed>1.5;
    for(let k=0;k<this.legs.length;k++){const L=this.legs[k];
      const p=this.pts[L.idx],q=this.pts[L.idx+1];let fx=p.x-q.x,fy=p.y-q.y;const fl=Math.hypot(fx,fy)||1;fx/=fl;fy/=fl;
      const px=-fy,py=fx,r=this.radiusAt(L.idx/(this.n-1));
      L.ax=p.x+px*L.side*r*0.55;L.ay=p.y+py*L.side*r*0.55;
      const rf=L.front?sp.rfF:sp.rfB,ro=L.front?sp.roF:sp.roB;
      L.rx=L.ax+fx*rf+px*L.side*ro;L.ry=L.ay+fy*rf+py*L.side*ro;
      if(flail){const a=this.t*15+k*1.9;L.fx=L.rx+Math.sin(a)*2-fx;L.fy=L.ry+Math.cos(a*1.3)*1.5+2;L.lift=0.7;L.stepping=false;continue;}
      if(L.stepping){
        L.st+=dt/L.dur;const tx=L.rx+vx*L.dur*0.5,ty=L.ry+vy*L.dur*0.5,e=ease(Math.min(1,L.st));
        L.fx=lerp(L.sx,tx,e);L.fy=lerp(L.sy,ty,e);L.lift=Math.sin(Math.PI*Math.min(1,L.st));
        if(L.st>=1){L.stepping=false;L.lift=0;if(!this.preview&&moving)SFX.play('step');}

  dragTo(x,y){this.grabX=x;this.grabY=y;}

// =====================================================================

  goTo(tx,ty,dt,mode,arrive=3){

  retreat(dur){this.state='hiding';this.hideT=dur||rand(3,6);this.tg=null;this.prey=null;this.speed=0;if(!this.preview)SFX.play('tok');}
  startle(x,y){if(this.state==='grabbed'||this.state==='fall')return;if(this.held)this.finishEating();this.retreat();}
  update(dt){
    this.t+=dt;this.antLag*=Math.pow(0.08,dt);

    if(this.state==='fall'){

      if(this.h<=0){this.h=0;this.vh=0;SFX.play('land');dust(this.world,this.x,this.y,5);this.retreat(rand(1.8,2.6));}

      if(this.hideT<=0&&this.tuck<0.06){this.state='idle';this.timer=rand(.5,1.5);}

    let bump=false;if(this.x<B.x0||this.x>B.x1||this.y<B.y0||this.y>B.y1)bump=true;

  }
  syncHeld(){if(this.held){const m=this.mouthScreen();this.held.sx=m.x;this.held.sy=m.y;}}
  updateLegs(dt,flail){

      [L.ax,L.ay]=this.Wg(alx,L.side*2.0);

      if(tk>0.1){L.fx=lerp(L.fx,L.rx,Math.min(1,dt*16));L.fy=lerp(L.fy,L.ry,Math.min(1,dt*16));L.stepping=false;L.lift=0;continue;}
      if(L.stepping){

    }
  }
  hitTest(x,y){const[sx,sy]=this.W(-6,0);return Math.hypot(x-sx,y-sy)<7*this.sc?0:-1;}
  tryGrab(x,y){if(this.hitTest(x,y)<0)return false;if(this.held)this.finishEating();this.tg=null;this.prey=null;

  dragTo(x,y){this.grabX=x;this.grabY=y;}
  release(){if(this.state!=='grabbed')return;this.state='fall';this.vh=0;}
  grabStep(dt){
    this.gt+=dt;this.h+=(12-this.h)*Math.min(1,dt*10);
    this.ang+=wrapA(Math.PI/2-this.ang)*Math.min(1,dt*5);
    this.x=this.grabX+Math.cos(this.ang)*6*this.sc;this.y=this.grabY+this.h+Math.sin(this.ang)*6*this.sc;
    const tt=this.gt<0.3?0:1;this.tuck+=(tt-this.tuck)*Math.min(1,dt*12);

  }
  draw(fb0){
    const sc=this.sc,fb={cap:(ax,ay,ar,bx,by,br,...r)=>fb0.cap(ax,ay,ar*sc,bx,by,br*sc,...r)};
    const tk=this.tuck,bx=-tk*3.2,W=(a,b)=>this.W(a,b),door=clamp((tk-0.3)/0.5,0,1);this.bx=bx;

      for(const sd of[-1,1]){const[e0x,e0y]=W(bx+3.2,sd*0.8),[e1x,e1y]=W(bx+3.2+1.7*el,sd*(0.8+0.8*el));
        fb.cap(e0x,e0y,.45,e1x,e1y,.45,M.BODY,4);fb.cap(e1x,e1y,.8,e1x,e1y,.8,M.PUPIL,4,0,0,1);}}
    // pincers held forward; big one on the left folds across the shell mouth as a door when hiding
    const m=this.mouthScreen();
    for(const sd of[-1,1]){const big=sd<0;
      if(!big&&tk>0.5)continue;

      fb.cap(shx,shy,.8,ex,ey,.8,M.CLAW,cls,0,0,0.6);fb.cap(ex,ey,.8,bx2,by2,.9,M.CLAW,cls,0,0,0.6);

  drawExtras(fb){// antennae as fine pixel lines

  }
}

function preyScare(p,w,rad){const pet=w.pet;if(!pet||p.caught||p.inHand)return null;const hd=pet.headPos();
  const d=Math.hypot(hd.x-p.x,hd.y-p.y);return d<rad?{d,hd,noise:pet.noise?pet.noise():0.5}:null;}
function ddisc(fb,x,y,r,f){const x0=Math.floor(x-r),x1=Math.ceil(x+r),y0=Math.floor(y-r*0.7),y1=Math.ceil(y+r*0.7);
  for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++){const dx=(xx+.5-x)/r,dy=(yy+.5-y)/(r*0.7);if(dx*dx+dy*dy<1)pdark(fb,xx,yy,f);}}
// Base for the shaded foods: falling, hand/mouth holding, screen position.
class Food{
  initFood(type,x,y,h){this.type=type;this.value=FOODS[type].value;this.x=x;this.y=y;this.h=h;this.vh=0;this.ang=rand(TAU);this.t=rand(10);
    this.dead=false;this.caught=false;this.inHand=false;this.bites=0;this.layered=true;}
  fall(dt){if(this.h>0||this.vh>0){this.vh-=170*dt;this.h+=this.vh*dt;
    if(this.h<=0){if(this.vh<-70)SFX.play(this.type==='fruit'||this.type==='egg'?'squish':'tap');this.h=0;this.vh=0;return true;}}return false;}
  scr(){return(this.caught||this.inHand)?{x:this.sx,y:this.sy}:{x:this.x,y:this.y-this.h};}
  grounded(){return!this.caught&&!this.inHand&&this.h<=0.5;}
  drawShadow(fb){if(this.caught)return;if(this.inHand||this.h>0.5)ddisc(fb,this.x+1,this.y+1,2.2,.62);}
  keepIn(w){const B=w.bounds;if(this.x<B.x0||this.x>B.x1||this.y<B.y0||this.y>B.y1){this.x=clamp(this.x,B.x0,B.x1);this.y=clamp(this.y,B.y0,B.y1);this.ang+=Math.PI*0.7;return true;}return false;}
}
class Cricket{
  constructor(x,y,h=0){this.type='cricket';this.value=FOODS.cricket.value;this.x=x;this.y=y;this.h=h;this.vh=0;this.vx=0;this.vy=0;this.ang=rand(TAU);
    this.timer=rand(.6,2);this.dead=false;this.caught=false;this.inHand=false;this.ph=rand(TAU);this.layered=false;}
  update(dt,w){
    if(this.caught||this.inHand)return;const B=w.bounds;
    if(this.h>0||this.vh>0){this.vh-=170*dt;this.h+=this.vh*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;
      if(this.h<=0){if(this.vh<-70)SFX.play('tap');this.h=0;this.vh=0;this.vx=this.vy=0;}}
    else{this.timer-=dt;const s=preyScare(this,w,17);let scared=false;
      if(s&&Math.random()<dt*(0.4+3*s.noise)){scared=true;this.ang=Math.atan2(this.y-s.hd.y,this.x-s.hd.x)+rand(-.7,.7);}
      if(this.timer<=0||scared){if(!scared)this.ang+=rand(-1.6,1.6);const sp=rand(28,46);
        this.vx=Math.cos(this.ang)*sp;this.vy=Math.sin(this.ang)*sp;this.vh=rand(38,58);this.h=0.01;this.timer=rand(1.4,4.5);}
      else if(Math.random()<dt*0.6)this.ang+=rand(-.7,.7);}
    if(this.x<B.x0){this.x=B.x0;this.vx=Math.abs(this.vx);}if(this.x>B.x1){this.x=B.x1;this.vx=-Math.abs(this.vx);}
    if(this.y<B.y0){this.y=B.y0;this.vy=Math.abs(this.vy);}if(this.y>B.y1){this.y=B.y1;this.vy=-Math.abs(this.vy);}
  }
  drawShadow(fb){if(this.caught)return;const c=Math.cos(this.ang),s=Math.sin(this.ang);pdark(fb,this.x+1,this.y+1,.55);pdark(fb,this.x-c*2+1,this.y-s*2+1,.55);}
  draw(fb,t){
    const held=this.caught||this.inHand,x=held?this.sx:this.x,y=held?this.sy:this.y-this.h,c=Math.cos(this.ang),s=Math.sin(this.ang),px=-s,py=c;
    const tw=Math.sin(t*9+this.ph)*0.35,kick=held?Math.sin(t*22+this.ph)*1.2:0;
    line(fb,x+c,y+s,x+Math.cos(this.ang-0.4+tw)*5,y+Math.sin(this.ang-0.4+tw)*5,hex('#a0845a'));
    line(fb,x+c,y+s,x+Math.cos(this.ang+0.4-tw)*5,y+Math.sin(this.ang+0.4-tw)*5,hex('#a0845a'));
    for(const sd of[-1,1]){line(fb,x-c*1.5+px*sd*0.8,y-s*1.5+py*sd*0.8,x-c*(3.8+kick*sd*0.5)+px*sd*(2+kick*0.4),y-s*(3.8+kick*sd*0.5)+py*sd*(2+kick*0.4),hex('#3a2616'));
      pset(fb,x-c*2+px*sd*1.8,y-s*2+py*sd*1.8,hex('#6a4a2a'));}
    for(const sd of[0,1])for(let k=0;k<4;k++)pset(fb,x-c*k+px*sd*0.9,y-s*k+py*sd*0.9,k===0?hex('#1a0f06'):k===3?hex('#c8904a'):hex('#a8743a'));
    pset(fb,x-c*2+px*.6,y-s*2+py*.6,hex('#b08850'));
  }
}
// Mealworms and waxworms: segmented larvae that crawl by peristalsis.
class Worm extends Food{
  constructor(x,y,h=0,type='worm'){super();this.initFood(type,x,y,h);this.wax=type==='waxworm';
    this.n=this.wax?6:8;this.seg=this.wax?1.4:1.3;this.curlT=-rand(2,5);
    this.pts=[];for(let i=0;i<this.n;i++)this.pts.push({x:x-Math.cos(this.ang)*i*this.seg,y:y-Math.sin(this.ang)*i*this.seg});}
  toScreen(){for(const p of this.pts)p.y-=this.h;}
  toWorld(h){for(const p of this.pts)p.y+=h;}
  update(dt,w){
    this.t+=dt;const P=this.pts,n=this.n,seg=this.seg;
    if(this.caught||this.inHand){// dangle from the tweezers or jaws, curling
      P[0].x=this.sx;P[0].y=this.sy;
      for(let i=1;i<n;i++){const q=P[i-1],p=P[i];p.y+=0.7;p.x+=Math.sin(this.t*(this.wax?5:9)+i*0.8)*0.35;
        const dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1;p.x=q.x+dx/d*seg;p.y=q.y+dy/d*seg;}
      return;}
    this.fall(dt);
    const s=preyScare(this,w,this.wax?10:14),freq=this.wax?3:5.5,pulse=0.5+0.5*Math.sin(this.t*freq);
    if(this.wax){this.curlT-=dt;if(this.curlT<-rand(3,6))this.curlT=rand(1.2,2.2);}
    const curling=this.wax&&this.curlT>0;
    this.ang+=(curling?2.8:Math.sin(this.t*1.3)*1.2+rand(-1,1)*1.5)*dt;
    if(s)this.ang+=wrapA(Math.atan2(this.y-s.hd.y,this.x-s.hd.x)-this.ang)*dt*2;
    const sp=(this.h>0?0:1)*(this.wax?(curling?3:1.6):4.5)*pulse;
    this.x+=Math.cos(this.ang)*sp*dt;this.y+=Math.sin(this.ang)*sp*dt;this.keepIn(w);P[0].x=this.x;P[0].y=this.y;
    for(let i=1;i<n;i++){const q=P[i-1],p=P[i],L=seg*(1+0.14*Math.sin(this.t*freq-i*0.9));
      const dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy)||1,wig=Math.sin(this.t*4-i*1.1)*0.12;
      p.x=q.x+dx/d*L-dy/d*wig;p.y=q.y+dy/d*L+dx/d*wig;}
  }
  drawShadow(fb){if(this.caught)return;if(this.inHand||this.h>0.5)ddisc(fb,this.x+1,this.y+1,2.4,.62);}
  drawL(fb){
    const held=this.caught||this.inHand,oy=held?0:-this.h,P=this.pts,n=this.n,k=1-this.bites*0.18;
    const R=i=>{const t=i/(n-1);return(this.wax?(t<0.15?1.2:1.75-0.6*t*t):(t<0.1?0.95:1.25-0.45*t*t))*k;};
    const mat=this.wax?M.F_WAX:M.F_MEAL;
    for(let i=0;i<n-1;i++)fb.cap(P[i].x,P[i].y+oy,R(i),P[i+1].x,P[i+1].y+oy,R(i+1),mat,1,i*this.seg,(i+1)*this.seg);
    fb.cap(P[0].x,P[0].y+oy,R(0)*0.8,P[0].x,P[0].y+oy,R(0)*0.8,M.F_HEAD,1,0,0,1.3);
  }
}
class Snail extends Food{
  constructor(x,y,h=0){super();this.initFood('snail',x,y,h);this.ext=0;this.hideT=1;this.trailT=0;}
  update(dt,w){
    this.t+=dt;
    if(this.caught||this.inHand){this.ext+=(0-this.ext)*Math.min(1,dt*8);return;}

    wet:new Float32Array(N),plants:[],onEvent:msg=>flash(`${game.name} ${msg}`)};
}
function flash(msg){game.flashMsg=msg;game.flashT=2.6;}
function startGame(kind,name){
  game.kind=kind;game.name=name||pick(SPECIES[kind].names);
  const w=game.world||(game.world=createWorld());
  if(!R.bg)bakeWorld(w);
  w.prey.length=0;w.parts.length=0;
  w.pet=makePet(w,kind,160,96);game.held=null;
  w.stats.fed=72;w.stats.happy=70;w.stats.water=68;
  const starter=Object.entries(DIET[kind]).sort((a,b)=>b[1]-a[1])[0][0];
  for(let i=0;i<2;i++)w.prey.push(makeFood(i?starter:'cricket',rand(60,280),rand(40,150),0));
  game.mode='play';$('picker').hidden=true;
  $('petName').textContent=game.name;$('petKind').textContent=SPECIES[kind].label;
  try{localStorage.setItem('mossjar.pet',JSON.stringify({kind,name:game.name}));}catch(e){}
  flash(`${game.name} moved in. Say hi!`);
}

// =====================================================================
//  Update
// =====================================================================
function updatePlay(dt){
  const w=game.world,S=w.stats,pet=w.pet,P=game.pointer;w.t+=dt;
  w.dayness+=(w.dayTarget-w.dayness)*Math.min(1,dt*0.9);
  // needs
  S.fed=Math.max(0,S.fed-0.26*dt);S.water=Math.max(0,S.water-0.2*dt);
  S.happy=Math.max(0,S.happy-(0.1+(S.fed<25?0.3:0)+(S.water<25?0.3:0))*dt);
  // continuous tools
  if(P.down&&P.inside){
    if(game.tool==='mist'){
      P.sprayT-=dt;
      while(P.sprayT<=0){P.sprayT+=0.018;const a=rand(TAU),r=Math.sqrt(Math.random())*14;
        spawn(w,'drop',P.x+Math.cos(a)*r*0.4,P.y+22+Math.sin(a)*r*0.4,{h:22,vh:-rand(0,20),vx:Math.cos(a)*r*1.6,vy:Math.sin(a)*r*1.2,life:3});
        if(Math.random()<0.5)spawn(w,'mist',P.x+rand(-3,3),P.y+rand(-3,3),{vx:rand(-20,20),vy:rand(-16,16),life:rand(.4,.8)});}
      if(Math.random()<dt*14)w.glassDrops.push({x:P.x+rand(-26,26),y:P.y+rand(-18,18),life:rand(7,14),r:Math.random()<0.25?2:1});
      S.water=Math.min(100,S.water+3.5*dt);
      const hd=pet.headPos();if(Math.hypot(hd.x-P.x,hd.y-P.y)<26)S.happy=Math.min(100,S.happy+(pet.kind==='lizard'||pet.kind==='snake'?0.6:3)*dt);
      for(const pl of w.plants)if(Math.hypot(pl.x-P.x,pl.y-P.y)<pl.reach+10)pl.dist=Math.max(pl.dist,0.8);
    }else if(game.tool==='pet'){
      if(pet.hitTest(P.x,P.y)>=0&&P.moved>0.5){if(pet.petMe()){P.rub=(P.rub||0)+P.moved;
        if(P.rub>7){P.rub=0;spawn(w,'heart',P.x+rand(-2,2),P.y-3,{vy:-rand(12,18),life:1.2,ph:rand(TAU)});SFX.play('heart');}}}
    }else if(game.tool==='grab'&&game.grabbing)pet.dragTo(P.x,P.y);
  }
  P.moved=0;
  const hq=game.held;
  if(hq){hq.sx=P.x;hq.sy=P.y;hq.x=P.x;hq.y=P.y+8;hq.h=8;}
  pet.update(dt);
  if(hq&&(hq.caught||hq.dead)){game.held=null;hq.inHand=false;
    if(hq.caught){S.happy=Math.min(100,S.happy+6);SFX.play('sparkle');
      for(let i=0;i<8;i++){const a=rand(TAU),v=rand(14,30);spawn(w,'spark2',P.x,P.y,{vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.35,.6)});}
      flash(`${game.name} took ${PREY_NAME[hq.type]} right from the tweezers!`);}}
  for(const p of w.prey)p.update(dt,w);
  for(let i=w.prey.length-1;i>=0;i--)if(w.prey[i].dead)w.prey.splice(i,1);
  updateParts(w,dt);
  for(let i=w.ripples.length-1;i>=0;i--){w.ripples[i].age+=dt;if(w.ripples[i].age>1.1)w.ripples.splice(i,1);}
  for(let i=w.glassRings.length-1;i>=0;i--){w.glassRings[i].age+=dt;if(w.glassRings[i].age>0.5)w.glassRings.splice(i,1);}
  for(let i=w.glassDrops.length-1;i>=0;i--){const g=w.glassDrops[i];g.life-=dt;if(g.life<=0)w.glassDrops.splice(i,1);}
  if(w.glassDrops.length>160)w.glassDrops.splice(0,w.glassDrops.length-160);
  // plants rustle when the pet brushes past
  const hd=pet.headPos(),mv=pet.noise?pet.noise():0;
  for(const pl of w.plants){if(mv>0.3&&Math.hypot(hd.x-pl.x,hd.y-pl.y)<pl.reach)pl.dist=Math.max(pl.dist,0.5);pl.dist*=Math.pow(0.25,dt);}
  // wet substrate evaporates
  const wet=w.wet,f=Math.pow(0.95,dt);for(let i=0;i<N;i++){const v=wet[i];if(v>0.004)wet[i]=v*f;else if(v)wet[i]=0;}
  // fireflies (night) & motes (day)
  const night=1-w.dayness;
  if(night>0.5&&w.fireflies.length<7&&Math.random()<dt*2)w.fireflies.push({x:rand(30,290),y:rand(30,150),a:rand(TAU),ph:rand(TAU),s:rand(100),life:rand(10,20)});
  for(let i=w.fireflies.length-1;i>=0;i--){const q=w.fireflies[i];q.life-=dt;if(night<0.4)q.life-=dt*3;
    q.a+=(vnoise(w.t*0.7,q.s)-.5)*5*dt;q.x+=Math.cos(q.a)*7*dt;q.y+=Math.sin(q.a)*7*dt;
    if(q.x<20||q.x>300||q.y<20||q.y>160)q.a+=wrapA(Math.atan2(90-q.y,160-q.x)-q.a)*dt*3;
    if(q.life<=0)w.fireflies.splice(i,1);}
  if(w.dayness>0.5&&w.motes.length<16&&Math.random()<dt*4)w.motes.push({x:w.lamp.x+rand(-40,40),y:w.lamp.y+rand(-30,30),vx:rand(-2,2),vy:rand(-2,2),life:rand(3,6),ph:rand(TAU)});
  for(let i=w.motes.length-1;i>=0;i--){const m=w.motes[i];m.life-=dt;m.x+=m.vx*dt;m.y+=m.vy*dt+Math.sin(w.t+m.ph)*0.05;if(m.life<=0)w.motes.splice(i,1);}
  // ambient sound: fly buzz, cricket chirps, night croaks
  let nf=0,nc=0;for(const q of w.prey){if(q.caught)continue;if(q.type==='fly'&&(q.landT<=0||q.inHand))nf++;if(q.type==='cricket')nc++;}
  SFX.buzzLevel(Math.min(0.05,nf*0.018));
  SFX.slither(pet.kind==='snake'&&pet.state!=='grabbed'?Math.min(0.07,Math.abs(pet.speed||0)/46*0.08):0);
  game.chirpT-=dt;if(game.chirpT<=0){game.chirpT=rand(3,7);if(nc)SFX.play('chirp');}
  game.croakT-=dt;if(game.croakT<=0){game.croakT=rand(8,15);if(w.dayness<0.4)SFX.play('croak');}
  // shake
  if(game.shake>0){game.shake-=dt;const k=Math.ceil(game.shake*12);canvas.style.transform=game.shake>0?`translate(${(Math.random()-.5)*k}px,${(Math.random()-.5)*k}px)`:'';}
  if(game.flashT>0)game.flashT-=dt;
  game.uiT-=dt;if(game.uiT<=0){game.uiT=0.2;updateUI();}
}

function drawWater(w){
  const px=fb.px,T=w.t,d=w.dish,rw=d.rw,rips=w.ripples;
  for(let k=0;k<R.wIdx.length;k++){const x=R.wx[k],y=R.wy[k],dx=x-d.x,dy=y-d.y,dd=R.wd[k];
    let v=1.2+(dd/rw)*1.3+(Math.sin(dx*0.9+T*1.8)+Math.sin(dy*1.1-T*1.5)+Math.sin((dx-dy)*0.6+T*2.3))*0.22;
    for(const r of rips){const q=Math.abs(Math.hypot(x+.5-r.x,y+.5-r.y)-r.age*15);if(q<1.2)v+=(1-r.age/1.1)*1.7*(1-q/1.2);}
    if(dx<-2&&dy<-2&&dd>rw-4&&dd<rw-1.8)v+=1.4;
    px[R.wIdx[k]]=WATER[clamp(Math.floor(v+R.BAY[R.wIdx[k]]),0,5)];}
}
function drawWet(w){const px=fb.px,wet=w.wet,G=hex('#cfe6ee');
  for(let i=0;i<N;i++){const v=wet[i];if(v<0.03)continue;px[i]=shade(px[i],1-0.5*v);if(v>0.45&&R.glint[i])px[i]=mixc(px[i],G,0.7);}}
function applyLight(d){
  const px=fb.px,LD=R.LD,LN=R.LN,BAY=R.BAY;
  for(let i=0,j=0;i<N;i++,j+=3){const c=px[i],b=BAY[i];
    const lr=Math.floor((LN[j]+(LD[j]-LN[j])*d)*10+b)/10,lg=Math.floor((LN[j+1]+(LD[j+1]-LN[j+1])*d)*10+b)/10,lb=Math.floor((LN[j+2]+(LD[j+2]-LN[j+2])*d)*10+b)/10;
    let r=(c&255)*lr,g=(c>>8&255)*lg,bl=(c>>>16&255)*lb;if(r>255)r=255;if(g>255)g=255;if(bl>255)bl=255;
    px[i]=(0xff000000|(bl<<16)|(g<<8)|r)>>>0;}
}
const CUR_PAL={k:hex('#0d110d'),w:hex('#f2f1e2'),p:hex('#f3c2a6'),g:hex('#9ccf6a')};
const CUR={
  pet:['.k.k.k.','kwkwkwk','kwkwkwk','kwwwwwk','kwwwwk.','.kwwwk.','..kkk..'],
  grab:['kkk.kkk','kw...wk','k.....k','.......','k.....k','kw...wk','kkk.kkk'],
  grabbing:['.k.k.k.','kwkwkwk','kwwwwwk','kwwwwwk','.kwwwk.','..kkk..'],
  tap:['..kk....','.kwwk...','.kwwk...','.kwwkkk.','kkwwwwwk','kwwwwwwk','.kwwwwk.','..kkkk..'],
};
function drawCursor(w){
  const P=game.pointer;if(!P.inside||P.touch)return;const x=Math.round(P.x),y=Math.round(P.y),t=game.tool;
  if(t==='feed'){drawTweezers(x,y,!!game.held||P.down);if(!game.held)foodIcon(game.food,x+7,y+7,w.t);}
  else if(t==='mist'){const r=12;for(let i=0;i<24;i++){const a=i/24*TAU+w.t*0.8;if(i%2)pset(fb,x+Math.cos(a)*r,y+Math.sin(a)*r*0.8,CUR_PAL.w);}pset(fb,x,y,CUR_PAL.w);pset(fb,x+1,y+1,CUR_PAL.k);}
  else if(t==='pet')sprite(fb,CUR.pet,x-3,y-3,CUR_PAL);
  else if(t==='grab')sprite(fb,game.grabbing?CUR.grabbing:CUR.grab,x-3,game.grabbing?y-7:y-3,CUR_PAL);
  else if(t==='tap')sprite(fb,CUR.tap,x-3,y,CUR_PAL);
}
function drawTweezers(x,y,closed){
  const dk=hex('#23282e'),md=hex('#8e969e'),lt=hex('#e2e6ea'),o=closed?0:2;
  for(const[ax,ay,bx,by]of[[x-o*0.3,y+o*0.2,x+13,y-17],[x+o,y-o*0.4,x+15,y-16]]){line(fb,ax+1,ay+1,bx+1,by+1,dk);line(fb,ax,ay,bx,by,md);}
  line(fb,x+6,y-8,x+12,y-15,lt);pset(fb,x+14,y-17,lt);
}
const ICONS={};
function foodIcon(type,x,y,t){
  const q=ICONS[type]||(ICONS[type]=makeFood(type,0,0,0));q.caught=false;q.inHand=false;q.h=0;q.x=x;q.y=y;q.ang=-0.6;q.bites=0;
  if(q.pts)q.pts.forEach((p,i)=>{p.x=x-3+i*q.seg;p.y=y+Math.sin(t*6+i*0.9)*0.4;});
  if(q.type==='snail')q.ext=1;
  if(q.layered){fb.clearLayer();q.drawL(fb);composite(fb,FOOD_PAINTER);}else q.draw(fb,t);
}
function renderPlay(){
  const w=game.world,px=fb.px,pet=w.pet,P=game.pointer;FOOD_PAINTER.shells.length=0;
  px.set(R.bg);
  drawWater(w);drawWet(w);
  const drop=hex('#bfe4f2'),mistc=hex('#e8f4f6');
  for(const p of w.parts){
    if(p.type==='crumb')pset(fb,p.x,p.y-p.h,p.c||hex('#7a5a30'));
    else if(p.type==='dust')pmix(fb,p.x,p.y,hex('#8a7058'),clamp(p.life/.4,0,1)*0.8);
    else if(p.type==='splash'){pmix(fb,p.x-1,p.y,drop,.6);pmix(fb,p.x+1,p.y,drop,.6);pmix(fb,p.x,p.y-1,drop,.6);}
    else if(p.type==='drop')pdark(fb,p.x+1,p.y+1,.8);}
  for(const q of w.prey)q.drawShadow(fb);
  for(const q of w.prey)if(!q.layered&&!q.caught&&!q.inHand&&(q.type!=='fly'||q.landT>0))q.draw(fb,w.t);
  fb.clearLayer();for(const q of w.prey)if(q.layered&&q.grounded())q.drawL(fb);composite(fb,FOOD_PAINTER,{sAmt:.6,sdx:1,sdy:1});
  fb.clearLayer();for(const q of w.prey)if(q.layered&&!q.caught&&!q.inHand&&q.h>0.5)q.drawL(fb);composite(fb,FOOD_PAINTER);
  const hover=(game.tool==='pet'||game.tool==='grab')&&P.inside&&pet.hitTest(P.x,P.y)>=0;
  const drawPet=()=>{fb.clearLayer();pet.draw(fb);
    composite(fb,pet,{sAmt:.6,sdx:1+pet.h*0.35,sdy:1+pet.h,outline:hover||game.grabbing?hex('#e9f3c4'):undefined});
    if(pet.drawExtras)pet.drawExtras(fb);
    for(const q of w.prey)if(q.caught&&!q.layered)q.draw(fb,w.t);
    fb.clearLayer();for(const q of w.prey)if(q.caught&&q.layered)q.drawL(fb);composite(fb,FOOD_PAINTER);};
  if(pet.h<=3)drawPet();
  for(let k=0;k<R.ovIdx.length;k++){const i=R.ovIdx[k];px[i]=R.ov[i];}
  for(const q of w.prey)if(!q.caught&&q.type==='fly'&&q.landT<=0)q.draw(fb,w.t);
  fb.clearLayer();for(const pl of w.plants)drawPlant(fb,pl,w.t);composite(fb,PLANT_PAINTER,{sAmt:.7,sdx:5,sdy:7});
  if(pet.h>3)drawPet();
  if(game.held){const q=game.held;if(q.layered){fb.clearLayer();q.drawL(fb);composite(fb,FOOD_PAINTER);}else q.draw(fb,w.t);}
  for(const p of w.parts){if(p.type==='drop')pset(fb,p.x,p.y-p.h,drop);else if(p.type==='mist')pmix(fb,p.x,p.y,mistc,clamp(p.life,0,1)*0.6);}
  for(let k=0;k<R.frameIdx.length;k++){const i=R.frameIdx[k];px[i]=R.frame[i];}
  const GE=hex('#bfe6d6');for(let k=0;k<R.glassIdx.length;k++){const i=R.glassIdx[k];px[i]=mixc(px[i],GE,R.glassT[k]);}
  applyLight(w.dayness);
  // emissive / glass layer
  const night=1-w.dayness;
  for(const q of w.fireflies){const b=(0.5+0.5*Math.sin(w.t*3+q.ph))*night*Math.min(1,q.life);
    padd(fb,q.x,q.y,200*b,255*b,110*b);for(const[dx,dy]of[[-1,0],[1,0],[0,-1],[0,1]])padd(fb,q.x+dx,q.y+dy,60*b,90*b,30*b);}
  for(const m of w.motes){const b=Math.min(1,m.life)*(0.5+0.5*Math.sin(w.t*2+m.ph))*w.dayness;padd(fb,m.x,m.y,50*b,40*b,14*b);}
  for(const p of w.parts){
    if(p.type==='heart'){const f=clamp(p.life/0.4,0,1);sprite(fb,HEART,Math.round(p.x-2),Math.round(p.y-2),{r:mixc(hex('#3a1a1a'),hex('#ff7a92'),f)});pset(fb,Math.round(p.x-1),Math.round(p.y-1),hex('#ffd6de'));}
    else if(p.type==='zzz'){const f=clamp(p.life/0.6,0,1);sprite(fb,ZZZ,Math.round(p.x),Math.round(p.y),{z:mixc(hex('#202838'),hex('#cfe0ff'),f)});}
    else if(p.type==='spark')padd(fb,p.x,p.y,70,40,8);
    else if(p.type==='spark2'){const f=clamp(p.life/0.5,0,1);padd(fb,p.x,p.y,150*f,140*f,80*f);}
    else if(p.type==='star'){const f=clamp(p.life/0.18,0,1);padd(fb,p.x,p.y,230*f,230*f,210*f);
      for(const[dx,dy]of[[-1,0],[1,0],[0,-1],[0,1]])padd(fb,p.x+dx,p.y+dy,150*f,150*f,130*f);
      for(const[dx,dy]of[[-2,0],[2,0],[0,-2],[0,2]])padd(fb,p.x+dx,p.y+dy,60*f,60*f,50*f);}}
  for(const g of w.glassRings){const r=g.age*70,b=(1-g.age/0.5)*50,n=Math.ceil(r*TAU/1.5);for(let i=0;i<n;i++){const a=i/n*TAU;padd(fb,g.x+Math.cos(a)*r,g.y+Math.sin(a)*r,b,b*1.1,b*1.1);}}
  for(const g of w.glassDrops){const b=Math.min(1,g.life/2);padd(fb,g.x,g.y,70*b,80*b,90*b);pdark(fb,g.x+1,g.y+1,1-0.25*b);if(g.r>1){padd(fb,g.x+1,g.y,40*b,45*b,50*b);pdark(fb,g.x+1,g.y+2,1-0.2*b);}}
  for(let k=0;k<R.refl.length;k++)padd(fb,R.refl[k]%W,(R.refl[k]/W)|0,7,8,8);
  drawCursor(w);
  ctx.putImageData(fb.img,0,0);
}

const previews=[];
function buildPicker(){
  const cards=$('cards');cards.innerHTML='';previews.length=0;
  for(const kind of['frog','lizard','salamander','snake','crab']){
    const sp=SPECIES[kind],card=document.createElement('div');card.className='card';
    card.innerHTML=`<canvas width="112" height="72"></canvas><h2>${sp.label}</h2><div class="latin">${sp.latin}</div><p>${sp.blurb}</p><button id="adopt-${kind}">Adopt</button>`;
    cards.appendChild(card);
    const cv=card.querySelector('canvas'),pfb=new FB(112,72),bg=new Uint32Array(112*72);
    bakeSoil(bg,112,72,0,0,112,72,kind.length*40);
    const pw={stats:{fed:60,happy:80,water:80},prey:[],parts:[],ripples:[],bounds:{x0:14,y0:12,x1:98,y1:60},dayness:1,t:0,dish:null,hide:null,lampRock:null};
    const pet=makePet(pw,kind,56,36);pet.preview=true;pw.pet=pet;
    previews.push({cv,ctx:cv.getContext('2d'),fb:pfb,bg,pet,pw});
    card.querySelector('button').addEventListener('click',()=>startGame(kind));
  }
}
function updatePreviews(dt){
  for(const p of previews){p.pw.t+=dt;p.pet.update(dt);p.pw.parts.length=0;p.pw.ripples.length=0;
    p.fb.px.set(p.bg);p.fb.clearLayer();p.pet.draw(p.fb);composite(p.fb,p.pet,{sAmt:.6,sdx:1,sdy:1});if(p.pet.drawExtras)p.pet.drawExtras(p.fb);p.ctx.putImageData(p.fb.img,0,0);}
}

const HINTS={feed:'Click to drop food, or hold to offer it with tweezers. Click food in the tank to pick it up.',pet:'Hold the button and rub over your pet.',
  grab:'Drag your pet to pick it up. Watch it dangle.',mist:'Hold to mist the tank. Amphibians love it.',tap:'Tap the glass. Your pet will not thank you.'};
function setTool(t){game.tool=t;for(const b of document.querySelectorAll('[data-tool]'))b.setAttribute('aria-pressed',b.dataset.tool===t?'true':'false');$('hint').textContent=HINTS[t];}
function setFood(f){game.food=f;for(const b of document.querySelectorAll('[data-food]'))b.setAttribute('aria-pressed',b.dataset.food===f?'true':'false');}
function updateUI(){
  const w=game.world;if(!w)return;const S=w.stats;
  for(const[k,id]of[['fed','Fed'],['water','Water'],['happy','Happy']]){$('bar'+id).style.width=S[k].toFixed(1)+'%';$('num'+id).textContent=Math.round(S[k]);}
  const st=$('status');
  if(game.flashT>0)st.innerHTML=`<em>${game.flashMsg}</em>`;
  else if(game.held&&!(DIET[game.kind][game.held.type]>0))st.textContent=`${game.name} isn't interested in ${FOODS[game.held.type].label}.`;
  else{let extra='';if(S.fed<25)extra=' It looks hungry.';else if(S.water<25)extra=' The tank feels dry.';st.textContent=`${game.name} ${w.pet.statusText()}.${extra}`;}
  $('clock').textContent=w.dayTarget>0.5?'· day':'· night';
  $('lightBtn').innerHTML=`<kbd>L</kbd>${w.dayTarget>0.5?'Lights off':'Lights on'}`;
}
function toPix(e){const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H];}
canvas.addEventListener('pointerdown',e=>{
  if(game.mode!=='play')return;canvas.setPointerCapture(e.pointerId);
  const P=game.pointer,[x,y]=toPix(e);P.x=x;P.y=y;P.down=true;P.inside=true;P.touch=e.pointerType==='touch';P.sprayT=0;
  const w=game.world,pet=w.pet;
  if(game.tool==='feed'){
    let q=null,bd=6;
    for(const p of w.prey){if(p.caught||p.dead)continue;const d=Math.hypot(p.x-x,p.y-p.h-y);if(d<bd){bd=d;q=p;}}
    if(!q){if(w.prey.length>=12){flash('That is plenty of food for now.');return;}
      q=makeFood(game.food,x,y+8,8);if(q.pts)q.toScreen();w.prey.push(q);if(q.type==='fly')SFX.play('buzz');}
    else if(q.pts)q.toScreen();
    q.inHand=true;q.vh=0;q.sx=x;q.sy=y;q.x=x;q.y=y+8;q.h=8;if(q.type==='snail')q.hideT=0;game.held=q;SFX.play('tick');
  }else if(game.tool==='grab'){if(pet.tryGrab(x,y)){game.grabbing=true;w.stats.happy=Math.max(0,w.stats.happy-1);SFX.play('squeak');}}
  else if(game.tool==='mist')SFX.mistOn(true);
  else if(game.tool==='tap'){
    w.glassRings.push({x,y,age:0});game.shake=0.22;SFX.play('tink');
    const hd=pet.headPos();pet.startle(x,y);if(pet.state==='flee'&&Math.hypot(hd.x-x,hd.y-y)<120)w.stats.happy=Math.max(0,w.stats.happy-3);
    for(const q of w.prey){if(q.type==='cricket'&&q.h===0&&!q.caught){q.timer=0;}if(q.type==='fly'){q.landT=0;q.ang=Math.atan2(q.y-y,q.x-x);}}
    for(const pl of w.plants)pl.dist=1;
  }
});
canvas.addEventListener('pointermove',e=>{const P=game.pointer,[x,y]=toPix(e);P.moved+=Math.hypot(x-P.x,y-P.y);P.x=x;P.y=y;P.inside=true;P.touch=e.pointerType==='touch';});
const dropHeld=()=>{const q=game.held;if(!q)return;game.held=null;q.inHand=false;q.h=8;q.vh=0;
  if(q.pts){q.toWorld(8);q.x=q.pts[0].x;q.y=q.pts[0].y;}if(q.type==='fly')q.targetH=rand(10,20);};
const up=()=>{const P=game.pointer;P.down=false;SFX.mistOn(false);dropHeld();if(game.grabbing){game.world.pet.release();game.grabbing=false;}};
canvas.addEventListener('pointerup',up);canvas.addEventListener('pointercancel',up);
canvas.addEventListener('pointerleave',()=>{if(!game.pointer.down)game.pointer.inside=false;});
for(const b of document.querySelectorAll('button'))b.addEventListener('click',()=>SFX.play('ui'));
for(const b of document.querySelectorAll('[data-tool]'))b.addEventListener('click',()=>setTool(b.dataset.tool));
for(const b of document.querySelectorAll('[data-food]'))b.addEventListener('click',()=>{setFood(b.dataset.food);setTool('feed');});
$('lightBtn').addEventListener('click',()=>toggleLight());
function toggleLight(){const w=game.world;if(!w)return;w.dayTarget=w.dayTarget>0.5?0:1;SFX.play(w.dayTarget?'lightsOn':'lightsOff');flash(w.dayTarget?'Lights on. Good morning, jar.':'Lights off. The night shift wakes up.');updateUI();}
$('swapBtn').addEventListener('click',()=>{game.mode='pick';$('picker').hidden=false;up();SFX.mistOn(false);SFX.buzzLevel(0);SFX.slither(0);});
const muteLabel=()=>{$('muteBtn').innerHTML=`<kbd>M</kbd>${SFX.muted?'Sound off':'Sound on'}`;$('muteBtn').setAttribute('aria-pressed',SFX.muted?'false':'true');};
const toggleMute=()=>{SFX.setMuted(!SFX.muted);muteLabel();};
$('muteBtn').addEventListener('click',toggleMute);muteLabel();
const rename=()=>{if(!game.kind)return;const ns=SPECIES[game.kind].names.filter(n=>n!==game.name);game.name=pick(ns);$('petName').textContent=game.name;
  try{localStorage.setItem('mossjar.pet',JSON.stringify({kind:game.kind,name:game.name}));}catch(e){}updateUI();};
$('renameBtn').addEventListener('click',rename);$('petName').addEventListener('click',rename);
window.addEventListener('keydown',e=>{
  if(game.mode!=='play'||e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase(),map={'1':'feed','2':'pet','3':'grab','4':'mist','5':'tap'};
  if(map[k])setTool(map[k]);else if(k==='l')toggleLight();else if(k==='m')toggleMute();
  else if(k==='f'){const fs=FOOD_ORDER;setFood(fs[(fs.indexOf(game.food)+1)%fs.length]);setTool('feed');}
});
function fit(){
  const wrap=$('tank'),aw=wrap.clientWidth-16,ah=Math.max(200,window.innerHeight-120);
  let s=Math.min(aw/W,ah/H);if(s>=3)s=Math.floor(s);s=Math.max(1,s);
  canvas.style.width=Math.floor(W*s)+'px';canvas.style.height=Math.floor(H*s)+'px';
}
window.addEventListener('resize',fit);

// =====================================================================
//  Boot
// =====================================================================
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(game.mode==='play'){updatePlay(dt);renderPlay();}else updatePreviews(dt);
  requestAnimationFrame(frame);
}
buildPicker();setTool('feed');setFood('cricket');fit();
(function(){let saved=null;try{saved=JSON.parse(localStorage.getItem('mossjar.pet')||'null');}catch(e){}
  if(saved&&SPECIES[saved.kind])startGame(saved.kind,saved.name);
  else{game.world=createWorld();bakeWorld(game.world);}})();
fit();
requestAnimationFrame(frame);
</script>

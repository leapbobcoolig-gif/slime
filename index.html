<title>Mossjar Terrarium</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A pixel-art terrarium pet game with procedurally animated critters, gachapon toys and hats.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0f0c;--panel:#16201a;--panel-2:#1e2b23;--panel-3:#243429;--line:#2f4236;--line-2:#4a6452;
  --ink:#eaf2df;--mute:#95a891;--moss:#9cd35e;--moss-d:#4f7a2c;--amber:#ffc24a;--amber-d:#a8751a;
  --pink:#ff7eb3;--teal:#45d1c1;--red:#ff6b6b;--blue:#5cb4ff;--purple:#b884ff;
  --display:"Silkscreen","Courier New",monospace;--body:"VT323","Courier New",monospace;
  --top:62px;--bot:92px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:20px;line-height:1.15;
  background-image:radial-gradient(ellipse at 50% 40%,#16241b 0%,#0a0f0c 70%);user-select:none;-webkit-user-select:none}
button{font-family:var(--display);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:#0a0f0c}
#c{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:none;touch-action:none;transform-origin:0 0}
#zoomChip{position:fixed;z-index:25;display:flex;align-items:center;gap:4px;padding:4px;transition:opacity .2s,box-shadow .15s;touch-action:none;cursor:grab}
#zoomChip.drag{cursor:grabbing;box-shadow:inset 0 0 0 2px var(--moss),0 10px 24px rgba(0,0,0,.5)}
#zGrip{width:12px;align-self:stretch;min-height:26px;border-radius:4px;background:radial-gradient(circle,#7c8c74 1.3px,transparent 1.8px) 1px 1px/5px 5px}
#zoomChip .ibtn{width:34px;height:34px}#zoomChip .ibtn img{width:22px;height:22px}
#zoomChip .ibtn.on{background:#2c4a24;box-shadow:inset 0 0 0 2px var(--moss),0 4px 0 #040604}
#zLvl{font-family:var(--display);font-size:11px;min-width:42px;text-align:center}
@media (max-width:760px){#zIn,#zOut{display:none}#zoomChip{gap:3px;padding:3px}#zoomChip .ibtn{width:30px;height:30px}#zoomChip .ibtn img{width:18px;height:18px}#zLvl{min-width:34px;font-size:10px}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}

/* ---------- shared chunky panel look ---------- */
.chunk{background:var(--panel);border:3px solid #060a07;border-radius:8px;box-shadow:inset 0 0 0 2px var(--line),0 4px 0 #040604}
.ibtn{width:44px;height:44px;display:grid;place-items:center;padding:0;background:var(--panel-2);border:3px solid #060a07;border-radius:8px;
  box-shadow:inset 0 0 0 2px var(--line),0 4px 0 #040604;transition:transform .12s}
.ibtn:hover{transform:translateY(-2px) rotate(-3deg)}
.ibtn:active{transform:translateY(2px)}
.ibtn img{width:30px;height:30px}

/* ---------- top HUD ---------- */
#top{position:fixed;left:0;right:0;top:0;height:var(--top);display:flex;align-items:center;gap:12px;padding-inline:14px;pointer-events:none;z-index:10}
#top>*{pointer-events:auto}
#petCard{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 6px;min-width:0}
#lvl{position:relative;width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--pink) calc(var(--p,0)*1turn),#2a1f28 0);box-shadow:0 0 0 3px #060a07}
#lvl::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel-2)}
#lvl b{position:relative;font-family:var(--display);font-size:15px;color:var(--ink)}
#lvl small{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:8px;letter-spacing:.08em;
  background:var(--pink);color:#2a0f1c;padding:0 4px;border-radius:3px}
#petText{display:flex;flex-direction:column;min-width:0}
#petName{background:none;border:0;padding:0;font-size:15px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
#petName:hover{color:var(--amber)}
#petKind{font-size:17px;color:var(--mute);white-space:nowrap}
#meters{display:flex;gap:8px;margin-left:6px}
.meter{display:flex;align-items:center;gap:4px}
.meter img{width:18px;height:18px}
.meter .bar{width:52px;height:10px;background:#0a0f0c;border-radius:3px;box-shadow:0 0 0 2px #060a07;overflow:hidden}
.meter .bar i{display:block;height:100%;width:50%;background:var(--c);transition:width .3s}
.meter.low{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
#toast{position:fixed;left:50%;top:calc(var(--top) + 4px);opacity:.93;transform:translateX(-50%);z-index:9;pointer-events:none;max-width:min(560px,calc(100vw - 32px));
  padding:7px 14px 6px;font-size:21px;text-align:center;transition:transform .2s,background .2s}
#toast.event{background:#3a2e10;box-shadow:inset 0 0 0 2px var(--amber-d),0 4px 0 #040604;color:#ffe7a6;animation:toastpop .35s}
@keyframes toastpop{0%{transform:translateX(-50%) scale(.7)}60%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
#topR{margin-left:auto;display:flex;align-items:center;gap:8px}
#coins{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;font-family:var(--display);font-size:18px;color:var(--amber);cursor:pointer}
#coins img{width:24px;height:24px}
#coins.bump{animation:bump .35s}
#coins.poor{animation:shake .4s}
@keyframes bump{40%{transform:scale(1.18)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* ---------- dock ---------- */
#dock{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:10;display:flex;align-items:flex-end;gap:10px;padding:7px;max-width:calc(100vw - 16px)}
.dgroup{display:flex;gap:6px}
.dsep{width:3px;align-self:stretch;background:var(--line);border-radius:2px;margin:6px 0}
.db{position:relative;width:62px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0 3px;
  background:var(--panel-2);border:3px solid #060a07;border-radius:9px;box-shadow:inset 0 0 0 2px var(--line),0 4px 0 #040604;transition:transform .12s,background .15s}
.db img{width:36px;height:36px;transition:transform .15s}
.db span{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.db kbd{position:absolute;top:2px;right:4px;font-family:var(--display);font-size:8px;color:var(--mute);opacity:.8}
.db:hover{transform:translateY(-3px)}
.db:hover img{transform:rotate(-8deg) scale(1.08)}
.db:active{transform:translateY(2px)}
.db.on{background:#2c4a24;box-shadow:inset 0 0 0 2px var(--moss),0 4px 0 #040604,0 0 18px rgba(156,211,94,.35);transform:translateY(-6px)}
.db.on span{color:var(--ink)}
.db.menu{background:#2a2433}
.db.menu.gacha,#d-gacha{background:#3a1f30}
.db .dot{position:absolute;top:-5px;left:-5px;width:14px;height:14px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px #060a07;animation:bump 1.2s infinite}
#tray{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);display:flex;gap:6px;padding:7px;max-width:calc(100vw - 24px);overflow-x:auto;animation:trayin .2s}
@keyframes trayin{from{opacity:0;transform:translate(-50%,10px)}}
.ti{position:relative;flex:none;width:56px;height:56px;display:grid;place-items:center;padding:0;background:var(--panel-2);border:3px solid #060a07;border-radius:8px;
  box-shadow:inset 0 0 0 2px var(--line);transition:transform .1s}
.ti canvas{width:44px;height:32px}
.ti:hover{transform:translateY(-3px)}
.ti.on{box-shadow:inset 0 0 0 2px var(--amber),0 0 12px rgba(255,194,74,.35);background:#33301c}
.tsep{flex:none;width:3px;align-self:stretch;margin:4px 2px;border-radius:2px;background:#060a07}
.ti.trash img{width:30px;height:30px}
.ti.trash.hot{background:#5a1e20;box-shadow:inset 0 0 0 2px var(--red,#e5484d),0 0 14px rgba(229,72,77,.6);transform:translateY(-4px) scale(1.08)}
.tcats{flex:none;display:flex;flex-direction:column;gap:3px;justify-content:center;margin-right:2px}
.tcat{font:inherit;font-size:10px;text-transform:uppercase;padding:2px 7px;min-width:62px;text-align:left;background:#1c2418;color:var(--mute);border:2px solid #060a07;border-radius:5px;cursor:pointer;position:relative}
.tcat.on{background:#3a3418;color:#ffe9a8;box-shadow:inset 0 0 0 1px var(--amber)}
.tcat i{font-style:normal;color:#ff7a9a;margin-left:4px}
.ti.meh{opacity:.45}
.ti .tfav{position:absolute;top:1px;right:3px;font-style:normal;font-size:11px;color:#ff7a9a;text-shadow:0 1px 0 #000}
.ti .tl{position:absolute;bottom:-2px;left:0;right:0;font-size:8px;text-transform:uppercase;color:var(--mute);text-align:center}
.tray-note{font-size:19px;color:var(--mute);padding:6px 10px;white-space:nowrap;display:flex;align-items:center;gap:10px}
.tray-note button{font-size:11px;padding:6px 10px;background:#3a1f30;border:2px solid #060a07;border-radius:6px}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(4,7,5,.62);backdrop-filter:blur(3px)}
.sheet{position:relative;width:min(960px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px 20px 20px;animation:sheetin .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes sheetin{from{opacity:0;transform:translateY(24px) scale(.94)}}
.sheet-h{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sheet-h h2{margin:0;font-family:var(--display);font-size:24px;letter-spacing:.02em;text-wrap:balance}
.sheet-h p{margin:0;color:var(--mute);font-size:19px}
.sheet-h .x{margin-left:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{font-size:12px;padding:8px 12px 7px;background:var(--panel-2);border:3px solid #060a07;border-radius:8px;box-shadow:inset 0 0 0 2px var(--line)}
.tab.on{background:#2c4a24;box-shadow:inset 0 0 0 2px var(--moss)}
.tab .n{color:var(--mute);margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px 8px;background:var(--panel-2);border:3px solid #060a07;border-radius:10px;
  box-shadow:inset 0 0 0 2px var(--rc,var(--line))}
.card canvas.icon{width:84px;height:84px}
.card h3{margin:0;font-family:var(--display);font-size:11px;text-align:center;line-height:1.25;min-height:28px;display:grid;place-items:center}
.card .rar{font-family:var(--display);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--rc)}
.card .cnt{position:absolute;top:6px;right:8px;font-family:var(--display);font-size:11px;color:var(--mute)}
.card .worn{position:absolute;top:6px;left:8px;font-family:var(--display);font-size:8px;background:var(--moss);color:#14200c;padding:2px 4px;border-radius:3px}
.card .acts{display:flex;gap:4px;width:100%}
.btn{flex:1;font-size:11px;padding:7px 6px 6px;background:#2c4a24;border:2px solid #060a07;border-radius:6px;box-shadow:0 3px 0 #040604}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #040604}
.btn.alt{background:var(--panel-3)}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.empty{padding:26px;text-align:center;color:var(--mute);font-size:21px;display:grid;gap:12px;justify-items:center}
.empty .btn{flex:none;padding:9px 14px}

/* gacha */
.gwrap{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.machine{position:relative}
#gcv{width:384px;height:528px;display:block;cursor:pointer}
.ginfo{display:flex;flex-direction:column;gap:12px;min-width:0}
.gtitle{font-family:var(--display);font-size:20px}
.gdesc{color:var(--mute);font-size:20px;margin:0}
.pull{font-size:15px;padding:14px 16px 12px;border:3px solid #060a07;border-radius:10px;box-shadow:0 5px 0 #040604;display:flex;align-items:center;justify-content:center;gap:10px;color:#1a0d14}
.pull img{width:24px;height:24px}
.pull:hover{filter:brightness(1.1)}
.pull:active{transform:translateY(3px);box-shadow:0 2px 0 #040604}
.pull[disabled]{opacity:.5;cursor:default}
.odds{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--display);font-size:9px;letter-spacing:.06em}
.odds span{color:var(--c)}
.odds .boost{flex-basis:100%}
.coll h4{margin:4px 0 8px;font-family:var(--display);font-size:11px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.cg{position:relative;aspect-ratio:1;background:#0d130f;border-radius:7px;box-shadow:inset 0 0 0 2px var(--rc,#26352b);display:grid;place-items:center}
.cg canvas{width:44px;height:44px}
.cg.unk canvas{filter:brightness(0) opacity(.45)}
.cg.unk::after{content:"?";position:absolute;font-family:var(--display);font-size:14px;color:#4a5e50}
.reveal{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(4,7,5,.8);border-radius:8px;overflow:hidden;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.rays{position:absolute;width:900px;height:900px;left:50%;top:50%;margin:-450px 0 0 -450px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,var(--rc) 0 10deg,transparent 10deg 24deg);opacity:.28;animation:spin 9s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 0,#000 30%,transparent 62%);mask:radial-gradient(circle,#000 0,#000 30%,transparent 62%)}
@keyframes spin{to{transform:rotate(1turn)}}
.rcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 26px 18px;max-width:340px;text-align:center;animation:rcard .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes rcard{from{transform:scale(.3) rotate(-12deg);opacity:0}}
.rcard canvas{width:168px;height:168px;filter:drop-shadow(0 0 18px var(--rc))}
.rcard .rar{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--rc)}
.rcard h3{margin:0;font-family:var(--display);font-size:22px}
.rcard p{margin:0;color:var(--mute);font-size:20px}
.rcard .tag{font-family:var(--display);font-size:11px;padding:3px 8px;border-radius:4px;background:var(--pink);color:#2a0f1c}
.rcard .tag.dup{background:var(--amber);color:#2a1c04}
.rcard .acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.rcard .btn{flex:none;padding:9px 14px}

/* roster */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--panel-2);border:3px solid #060a07;border-radius:10px;box-shadow:inset 0 0 0 2px var(--line)}
.pcard.here{box-shadow:inset 0 0 0 2px var(--moss)}
.pcard.locked canvas{filter:grayscale(.55) brightness(.75)}
.pcard h3 .rn{font:inherit;font-size:13px;margin-left:6px;padding:0 5px;background:#2a2f22;color:#d8e6b8;border:2px solid #060a07;border-radius:5px;cursor:pointer;vertical-align:middle}
.pcard .rnin{font:inherit;font-size:18px;padding:3px 6px;background:#10160e;color:#fff;border:2px solid var(--amber);border-radius:6px;width:100%}
.pcard .temper{color:#ffd88a;font-weight:normal}
.pcard .hab{font:inherit;font-size:12px;padding:4px 6px;border-radius:6px;background:#2a2f22;color:#d8e6b8;border:2px solid #060a07;cursor:pointer;text-align:center}
.pcard .hab.on{background:#173a44;color:#bdeef0}
.pcard div.hab{cursor:default}
.pcard .btn.buy{background:linear-gradient(#f4c64a,#c8901e);color:#2a1a04}
.pcard canvas{width:100%;aspect-ratio:112/72;border-radius:6px;box-shadow:0 0 0 2px #060a07}
.pcard h3{margin:0;font-family:var(--display);font-size:13px}
.pcard .sub{color:var(--mute);font-size:18px;margin-top:-4px}
.pcard p{margin:0;font-size:18px;color:#c9d6c1;flex:1}
.pcard .btn{flex:none;padding:9px 6px 8px}
.pcard .meta{display:flex;justify-content:space-between;font-family:var(--display);font-size:9px;color:var(--pink)}

/* settings */
.srow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:2px dashed var(--line)}
.srow label{flex:1;font-size:22px}
.srow small{display:block;color:var(--mute);font-size:17px}
.sw{width:58px;height:30px;border-radius:16px;background:#2a332c;border:3px solid #060a07;position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--mute);transition:left .15s,background .15s}
.sw.on{background:var(--moss-d)}
.sw.on::after{left:31px;background:var(--moss)}
input[type=range]{accent-color:var(--moss);width:180px}
.danger{background:#5a1f22!important}

/* fx */
.coinfly{position:fixed;width:22px;height:22px;z-index:31;transition:transform .7s cubic-bezier(.5,-0.35,.7,1),opacity .7s}
.floaty{position:fixed;font-family:var(--display);font-size:14px;color:var(--amber);text-shadow:0 2px 0 #1a1204;transform:translate(-50%,-50%);animation:floaty 1.2s forwards;white-space:nowrap}
@keyframes floaty{to{transform:translate(-50%,-240%);opacity:0}}
.lvlup{position:fixed;left:50%;top:38%;z-index:32;transform:translate(-50%,-50%);font-family:var(--display);font-size:34px;color:var(--pink);text-shadow:0 4px 0 #3a0f24;animation:lvlup 1.8s forwards;pointer-events:none;white-space:nowrap}
@keyframes lvlup{0%{transform:translate(-50%,-50%) scale(.2)}20%{transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}

@media (max-width:760px){
  :root{--top:150px;--bot:140px}
  #top{flex-wrap:wrap;height:auto;padding-top:8px;row-gap:8px}
  #toast{font-size:18px;max-width:calc(100vw - 40px)}
  .db{width:52px;height:52px}.db img{width:36px;height:36px}.db span{display:none}.db kbd{display:none}.db.on{transform:translateY(-3px)}
  #dock{gap:6px;padding:5px;flex-wrap:wrap;justify-content:center;width:max-content}.dgroup{gap:4px}.dsep{display:none}
  #petCard{flex-wrap:wrap;row-gap:4px;width:100%}#meters{width:100%;margin-left:0;justify-content:space-between}#meters .bar{width:64px}
  #topR{margin-left:auto}
  .gwrap{grid-template-columns:1fr}.machine{justify-self:center}
  #gcv{width:256px;height:352px}
  #meters .bar{width:38px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div id="stage"><canvas id="c" width="320" height="180" aria-label="Terrarium"></canvas></div>
<div id="fx"></div>

<div id="top">
  <div id="petCard" class="chunk">
    <div id="lvl" title="Bond level"><b id="lvlNum">1</b><small>LV</small></div>
    <div id="petText"><button id="petName" title="Click for a new name">…</button><span id="petKind">…</span></div>
    <div id="meters">
      <div class="meter" id="mFed" title="Fed"><img class="px" id="icFed" alt=""><div class="bar"><i style="--c:var(--amber)"></i></div></div>
      <div class="meter" id="mWater" title="Water"><img class="px" id="icWater" alt=""><div class="bar"><i style="--c:var(--teal)"></i></div></div>
      <div class="meter" id="mHappy" title="Happy"><img class="px" id="icHappy" alt=""><div class="bar"><i style="--c:var(--pink)"></i></div></div>
    </div>
  </div>
  <div id="topR">
    <div id="coins" class="chunk" title="Coins"><img class="px" id="icCoin" alt=""><span id="coinNum">0</span></div>
    <button class="ibtn" id="btnLight" title="Lights (L)"><img class="px" alt="Toggle lights"></button>
    <button class="ibtn" id="btnSettings" title="Settings"><img class="px" alt="Settings"></button>
  </div>
</div>
<div id="toast" class="chunk">…</div>
<div id="zoomChip" class="chunk" aria-label="Zoom">
  <span id="zGrip" title="Drag to move (double-click to put back)"></span>
  <button class="ibtn" id="zOut" title="Zoom out (-)"><img class="px" alt="Zoom out"></button>
  <span id="zLvl">1.0×</span>
  <button class="ibtn" id="zIn" title="Zoom in (+)"><img class="px" alt="Zoom in"></button>
  <button class="ibtn" id="zFollow" title="Follow your critter"><img class="px" alt="Follow"></button>

// logarithmic-looking spiral stripe for shells, from the shell's centre
function spiralStripe(x,y,c){const dx=x+.5-c.x,dy=y+.5-c.y,d=Math.hypot(dx,dy)/c.r;if(d<0.16)return false;
  const th=Math.atan2(dy,dx)-c.ang,v=d*1.7+th/TAU;return v-Math.floor(v)<0.4;}
function nearestShell(list,x,y){let b=null,bd=1e9;for(const c of list){const d=Math.hypot(x-c.x,y-c.y);if(d<bd){bd=d;b=c;}}return b;}
const FOOD_PAINTER={outline:hex('#140c06'),seam:1.0,shells:[],color(m,q,s,l,x,y){const F=PAL.food;
  switch(m){
    case M.F_MEAL:return((s%1.2)<0.28?F.mealDark:F.meal)[q];
    case M.F_WAX:return((s%1.3)<0.2?F.waxDark:F.wax)[q];
    case M.F_HEAD:return F.head[q];

    case M.SHELLA:{const c=nearestShell(this.shells,x,y);return(c&&spiralStripe(x,y,c)?PAL.crab.shB:PAL.crab.shA)[q];}
    case M.F_BERRY:if(q>=1&&hash(x*7+3,y*5)>0.84)return F.seed;return F.berry[q];
    case M.F_LEAF:return F.leaf[q];
    case M.F_FISH:{const G=PAL.food2;if(s>=4.5)return G.fishB[q];if(l<-0.3&&s<3.5)return G.fishB[Math.min(3,q+1)];if(Math.abs(l)<0.2&&s>0.4&&s<3.6)return G.fish[Math.min(3,q+1)];return G.fish[q];}
    case M.F_BLOOD:return PAL.food2.blood[q];
    case M.F_SHRIMP:{const G=PAL.food2.shrimp;if(s>=4.5)return G[Math.max(0,q-1)];if((s%1)<0.2)return G[Math.max(0,q-1)];return G[q];}
    case M.F_MOON:{const G=PAL.food2.moon;if(hash(x*7+1,y*5)>0.86)return G[3];return G[q];}
    case M.F_GEM:return PAL.food2.gem[Math.min(3,q+(hash(x*3,y*7)>0.7?1:0))];
    case M.ROCK:return PAL.rock[q];
    case M.F_ROACH:return((s%1.1)<0.25?F.roach[Math.max(0,q-1)]:F.roach[q]);
    case M.F_GREEN:if(Math.abs(l)<0.12&&s>0.5)return F.green[Math.min(3,q+1)];if(Math.abs(l)>0.78&&hash(x*3,y*7)>0.5)return F.green[Math.min(3,q+1)];return F.green[q];
    case M.F_EGG:if(vnoise(x*.9,y*.9)>0.68||hash(x*3,y*11)>0.9)return F.speck[Math.max(0,q-1)];return F.egg[q];
  }return INK;}};
const PLANT_PAINTER={outline:hex('#08140a'),seam:0.7,color(m,q,s,l,x,y){
  if(m===M.STEM)return PAL.stem[q];
  if(m===M.CATTAIL)return PAL.bark[Math.min(3,q+(hash(x*3,y*5)>0.8?1:0))];
  let r=PAL.leaf;
  if(m===M.LEAF1){if(vnoise(x*.33+3,y*.33)>0.68)r=PAL.leafVar;}
  else if(m===M.LEAF2)r=PAL.fern;
  else if(m===M.LEAF3)r=s<4.5?PAL.brom:PAL.leafDark;
  if(Math.abs(l)<0.16&&s>0.8)q=Math.min(3,q+1);
  return r[q];}};

//  Shared pet brain (state machine)
// =====================================================================
class Pet{
  initCommon(world,kind){
    this.world=world;this.kind=kind;this.state='idle';this.timer=1;this.scanT=rand(.5);
    this.held=null;this.tg=null;this.t=rand(10);this.blinkT=rand(2,5);this.blink=0;this.zzT=0;this.fxT=0;
    this.eyesClosed=false;this.preview=false;this.prey=null;this.tx=0;this.ty=0;this.pace='walk';
    this.mind=mindFor(kind,'');this.ignored=new Map();this.glance=null;this.glanceT=rand(2,5);
  }
  facing(){return this.headAng!==undefined?this.headAng:(this.ang||0);}
  // can this critter perceive the thing right now, and how?
  sense(t,food){const M=this.mind,hd=this.headPos(),d=Math.hypot(t.x-hd.x,t.y-hd.y),mv=t._mv||0,moving=mv>3||t.inHand||t.kind==='laser';
    const[R,F,Bst]=M.sight;
    if(R>0){const off=Math.abs(wrapA(Math.atan2(t.y-hd.y,t.x-hd.x)-this.facing()));
      if(off<F/2){const range=moving?R*Bst*(t.inHand?1.3:1):(M.motionOnly?0:R*0.7);if(d<range)return 'sight';}}
    if(food&&M.smell&&d<M.smell*(t.inHand?1.6:1)*(this.world.stats.fed<45?1.6:1))return 'smell';
    if(M.vib&&moving&&!(t.h>2)&&d<M.vib)return 'vib';
    if(d<12)return 'touch';return null;}
  ignoreIt(t,sec){this.ignored.set(t,this.world.t+sec);}
  isIgnored(t){const u=this.ignored.get(t);return u!==undefined&&u>this.world.t;}
  notice(t,kind,how){if(this.preview){this.commit(t,kind);return;}const M=this.mind;
    this.att={t,kind,how,time:0,dur:M.think*rand(0.7,1.3)*(t.inHand?0.45:1)*(how==='sight'?1:1.25)*(t.kind==='laser'?0.5:1)};
    this.state='notice';this.timer=this.att.dur+3;this.hp=null;think(this,this.mind.smart<0.2&&Math.random()<0.5?'...':'?');}
  wantIt(t,kind){const S=this.world.stats,M=this.mind;if(t.inHand)return Math.random()<0.95;
    if(kind==='prey'){const pref=(DIET[this.kind][t.type]||0)/10;return Math.random()<clamp(0.35+pref*0.4+(70-S.fed)/80,0.15,1);}
    const fun=(t.kind==='laser'||t.kind==='feather'?0.35:0)+(t.lively?0.2:0)-(t.bore||0)*0.6;return Math.random()<clamp(M.energy*0.55+M.cur*0.3+fun+(80-S.happy)/100,0.08,0.97);}
  commit(t,kind){this.prey=t;this.state='hunt';this.hp=null;this.timer=kind==='prey'?14:(t.kind==='laser'||t.kind==='feather'?20:9);if(!this.preview)think(this,kind==='play'&&Math.random()<0.4?'<3':'!',true);}
  // body language while sizing something up
  cue(dt,A){const k=this.kind;
    if(!A.cued){A.cued=true;if(this.flick&&(k==='lizard'||k==='dragon'||k==='snake'||k==='salamander'))this.flick();if(k==='golem')this.blink=0.35;}
    if(k==='gecko')this.wag=1;else if(k==='tarantula')this.threat=Math.max(this.threat||0,0.3);else if(k==='turtle')this.reach=Math.max(this.reach||0,0.55);
    else if(k==='slime')this.sq=Math.sin(this.t*11)*0.18;else if(k==='kraken')this.flush=Math.max(this.flush||0,0.3+0.25*Math.sin(this.t*10));
    else if(k==='axolotl')this.ex=Math.max(this.ex||0,0.8);else if(k==='crab'&&this.antLag!==undefined)this.antLag+=Math.sin(this.t*12)*dt*3;}
  // idle glances: look at nearby things, or at your cursor if it's curious
  idleLook(dt){const w=this.world,M=this.mind;this.glanceT-=dt;
    if(this.glanceT<=0){this.glanceT=rand(1.5,4)*(1.4-M.cur);const P=game.pointer,hd=this.headPos(),opts=[];
      if(!this.preview&&P.inside&&Math.hypot(P.x-hd.x,P.y-hd.y)<70&&M.cur>0.35)opts.push({x:P.x,y:P.y,ptr:true});
      for(const o of[...(w.toys||[]),...(w.decor||[])])if(Math.hypot(o.x-hd.x,o.y-hd.y)<80)opts.push(o);
      if(Math.random()<0.4)opts.push({x:hd.x+rand(-40,40),y:hd.y+rand(-30,30)});
      this.glance=opts.length?pick(opts):null;this.glanceUntil=w.t+rand(0.8,2);}
    if(this.glance&&w.t<this.glanceUntil){const g=this.glance.ptr?game.pointer:this.glance;if(this.faceToward&&this.kind!=='frog')this.faceToward(g.x,g.y,dt*0.6);}
    // shy critters edge away from a cursor hovering right over them
    const P=game.pointer;if(!this.preview&&P.inside&&M.bold<0.35&&(game.tool==='pet'||game.tool==='grab')){const hd=this.headPos(),d=Math.hypot(P.x-hd.x,P.y-hd.y);
      if(d<16&&Math.random()<dt*0.6){const a=Math.atan2(hd.y-P.y,hd.x-P.x),B=w.bounds;this.tx=clamp(hd.x+Math.cos(a)*30,B.x0,B.x1);this.ty=clamp(hd.y+Math.sin(a)*30,B.y0,B.y1);this.state='wander';this.pace='walk';this.timer=3;think(this,'!');}}}
  isActive(){if(this.preview||this.kind==='slime')return true;const d=this.world.dayness;return(this.kind==='lizard'||this.kind==='snake'||this.kind==='turtle'||this.kind==='chameleon'||this.kind==='dragon')?d>0.5:d<0.5;}
  flick(){}
  randomSpot(m=18){const B=this.world.bounds;return[rand(B.x0+m,B.x1-m),rand(B.y0+m,B.y1-m)];}
  wanderSpot(){const w=this.world;if(w.tank==='aqua'){const wet=Math.random()<(WATERPREF[this.kind]??0);
    if(wet&&this.kind==='crab'&&R.shallowList&&R.shallowList.length){const i=pick(R.shallowList);return[i%W,(i/W)|0];}
    const t=wet?randomWaterSpot(w,0.2):randomLandSpot(w);if(t)return t;}return this.randomSpot();}
  decide(){
    const w=this.world,S=w.stats,act=this.isActive();
    if(w.dish&&S.water<50&&Math.random()<0.75){
      const d=w.dish,hd=this.headPos(),a=Math.atan2(hd.y-d.y,hd.x-d.x);
      const r=this.kind==='frog'?0:d.rw-1.5;[this.tx,this.ty]=[d.x+Math.cos(a)*r,d.y+Math.sin(a)*r];
      this.state='drink';this.timer=15;return;}
    if(this.visitDecor&&this.visitDecor())return;
    if(w.hide&&!act&&(this.sleepCD||0)<=0&&Math.random()<0.25){
      if(this.kind==='snake'){this.tx=w.hide.x+w.hide.len/2+16;this.ty=w.hide.y-8;}
      else{this.tx=w.hide.x+rand(-8,8);this.ty=w.hide.y+rand(-3,3);}
      this.state='sleep';this.timer=20;return;}
    if(w.lampRock&&(this.kind==='lizard'||this.kind==='snake'||this.kind==='turtle'||this.kind==='chameleon'||this.kind==='dragon')&&w.dayness>0.5&&Math.random()<(this.kind==='dragon'?0.5:0.35)){
      this.tx=w.lampRock.x+rand(-6,6);this.ty=w.lampRock.y+rand(-3,3);this.state='bask';this.timer=15;return;}
    const M=this.mind,mem=w.foodMem;
    if(!this.preview&&mem&&mem.length&&S.fed<55&&Math.random()<M.smart*0.35){const m=mem[mem.length-1];this.tx=m.x+rand(-6,6);this.ty=m.y+rand(-6,6);this.pace='walk';this.state='wander';this.timer=12;think(this,'?');return;}
    if(!act&&Math.random()<0.3*(1.3-M.energy)){this.state='idle';this.timer=rand(2,4);return;}
    [this.tx,this.ty]=this.wanderSpot();this.pace=act?(Math.random()<0.5-M.energy*0.4?'slow':'walk'):'slow';
    this.state='wander';this.timer=14;
  }
  // Wander over to a piece of decor and do something with it
  visitDecor(){const w=this.world;if(this.preview||!w.decor||!w.decor.length||Math.random()>0.22)return false;
    const L=w.decor.filter(d=>!d.dragged);if(!L.length)return false;const d=pick(L),side=Math.random()<0.5?-1:1,r=d.r;
    this.vd=d;this.tx=clamp(d.x+side*(r+5),w.bounds.x0,w.bounds.x1);this.ty=clamp(d.y+r*0.4+3,w.bounds.y0,w.bounds.y1);this.state='visit';this.timer=14;return true;}
  visitTick(dt){const w=this.world,S=w.stats,d=this.vd,id=d.id;this.fxT=(this.fxT||0)-dt;const tick=this.fxT<=0;if(tick)this.fxT=0.8;
    if(id==='fountain'){S.water=Math.min(100,S.water+9*dt);if(tick){w.ripples.push({x:d.x+rand(-3,3),y:d.y+rand(-1,2),age:0});if(!this.preview)SFX.play('plip');}}
    else if(id==='volcano'||id==='lantern'||id==='tent'||id==='crystal'||id==='pumpkin'){S.happy=Math.min(100,S.happy+1.6*dt);if(tick){const hd=this.headPos();spawn(w,'spark',hd.x+rand(-4,4),hd.y-4,{life:1});}}
    else if(id==='bench'||id==='castle'||id==='torii'||id==='windmill'){S.happy=Math.min(100,S.happy+1.2*dt);if(tick&&Math.random()<0.4){const hd=this.headPos();spawn(w,'heart',hd.x,hd.y-6-(this.h||0),{vy:-rand(10,16),life:1.2,ph:rand(TAU)});}}
    else if(id==='chest'){if(tick&&d.openT>12){d.openT=Math.min(d.openT,0.2);}}
    else{if(tick){if(this.flick&&this.kind!=='frog')this.flick();S.happy=Math.min(100,S.happy+0.6);}}}
  scanPrey(dt,rad){
    this.scanT-=dt;if(this.scanT>0)return false;this.scanT=0.3;
    const w=this.world,S=w.stats;if(!w.prey.length)return false;
    if(S.fed>94)return false;if(S.fed>78&&Math.random()<0.5)return false;
    rad=rad||(this.isActive()?130:85);
    const hd=this.headPos();let best=null,bd=rad;
    const diet=DIET[this.kind];
    let how=null;
    for(const p of w.prey){if(p.dead||p.caught||p.hidden||!(diet[p.type]>0))continue;if(this.kind!=='frog'&&p.h>14)continue;if(this.isIgnored(p))continue;
      const sn=this.sense(p,true);if(!sn)continue;
      const d=Math.hypot(p.x-hd.x,p.y-hd.y)*(p.inHand?0.5:1)/(0.6+diet[p.type]/20);if(d<bd){bd=d;best=p;how=sn;}}
    if(!best)return false;
    this.notice(best,'prey',how);return true;
  }
  scanPlay(dt,close){
    if(this.preview)return false;
    this.playScan=(this.playScan||0)-dt;if(this.playScan>0)return false;this.playScan=0.35;
    const w=this.world,S=w.stats;if(S.fed<15)return false;
    const hd=this.headPos(),slow=this.kind==='gsnail';let best=null,bd=1e9;
    if(w.laser&&w.laser.on&&!slow){const d=Math.hypot(w.laser.x-hd.x,w.laser.y-hd.y);if(d<(close?90:230)){best=w.laser;bd=d;}}
    if(!best&&!slow&&w.bubbles)for(const b of w.bubbles){if(b.dead||b.caught)continue;const d=Math.hypot(b.x-hd.x,b.y-hd.y);if(d<(close?60:110)&&d<bd){bd=d;best=b;}}
    if(!best&&!close&&w.feather&&w.feather.on&&!w.feather.dead&&!slow){const d=Math.hypot(w.feather.x-hd.x,w.feather.y-hd.y);if(d<200){best=w.feather;bd=d;}}
    if(!best&&!close&&w.toys&&w.toys.length&&S.happy<97)
      for(const t of w.toys){if(t.cool>0||t.dragged||!t.playable||this.isIgnored(t)||Math.random()>(t.lively?0.45:0.1)*(1-(t.bore||0)*0.7))continue;const d=Math.hypot(t.x-hd.x,t.y-hd.y);if(d<150&&d<bd){bd=d;best=t;}}
    if(!best||this.isIgnored(best))return false;
    const how=this.sense(best,false);if(!how&&best.kind!=='laser')return false;
    this.notice(best,'play',how||'sight');return true;
  }
  brain(dt){
    const w=this.world,S=w.stats;this.timer-=dt;if(this.sleepCD>0)this.sleepCD-=dt;this.eyesClosed=false;
    switch(this.state){
      case 'notice':{const A=this.att,t=A&&A.t;
        if(!t||t.dead||t.caught||t.carriedBy||(t.kind==='laser'&&!t.on)){this.state='idle';this.timer=rand(.3,.8);break;}
        this.stop(dt);if(this.faceToward)this.faceToward(t.x,t.y,dt);this.cue(dt,A);A.time+=dt;
        if(!A.checked&&A.time>A.dur*0.5){A.checked=true;// a scatterbrained moment
          if(!t.inHand&&Math.random()<(1-this.mind.focus)*0.3){think(this,'...');this.ignoreIt(t,rand(2,5));this.state='idle';this.timer=rand(1,2.5);break;}}
        if(A.time>=A.dur){if(this.wantIt(t,A.kind))this.commit(t,A.kind);else{this.ignoreIt(t,rand(3,8));if(Math.random()<0.5)think(this,'...');this.state='idle';this.timer=rand(0.8,2);}}
        break;}
      case 'idle':this.stop(dt);this.idleLook(dt);if(this.danceNext){this.state='dance';this.timer=this.danceNext;this.danceNext=0;this.musicDance=true;break;}if(this.scanPrey(dt))break;if(this.scanPlay(dt))break;
        if(w.disco&&w.dayness<0.5&&!this.preview&&Math.random()<dt*0.35){this.state='dance';this.timer=rand(3,5);break;}
        if(this.timer<=0)this.decide();break;
      case 'dance':
        this.stop(dt);this.ang+=Math.sin(this.t*9)*dt*2.4;S.happy=Math.min(100,S.happy+0.8*dt);
        if(this.kind==='frog'&&this.mode==='sit'&&this.mt<=0)this.startHop(this.x+Math.cos(this.ang+1.5)*5,this.y+Math.sin(this.ang+1.5)*5,'turn',0,0);
        if(this.antLag!==undefined)this.antLag+=Math.sin(this.t*11)*dt*3;
        this.fxT-=dt;if(this.fxT<=0){this.fxT=0.5;const hd=this.headPos();spawn(w,'note',hd.x+rand(-4,4),hd.y-6-this.h,{life:1.4,c:Math.floor(rand(4))});}
        if(this.timer<=0||(!this.musicDance&&(!w.disco||w.dayness>0.5))){this.state='idle';this.timer=rand(1,2);this.musicDance=false;}
        break;
      case 'wander':
        if(this.scanPrey(dt))break;if(this.scanPlay(dt))break;
        if(this.goTo(this.tx,this.ty,dt,this.pace,4)||this.timer<=0){this.state='idle';this.timer=rand(0.8,3.5);}
        break;
      case 'hunt':{const p=this.prey;
        if(!p||p.dead||p.caught||this.timer<=0){this.state='idle';this.timer=rand(.3,1);this.prey=null;break;}
        if(!p.inHand&&!this.preview&&this.mind.focus<0.5&&Math.random()<dt*(0.5-this.mind.focus)*0.12){think(this,'?');this.ignoreIt(p,rand(1.5,3));this.state='idle';this.timer=rand(0.8,1.6);this.prey=null;break;}
        if(this.canStrike(p)){this.startStrike(p);this.state='strike';break;}
        const hd=this.headPos(),d=Math.hypot(p.x-hd.x,p.y-hd.y);
        if(p.play||p.inHand){this.goTo(p.x,p.y,dt,p.play?(d>22?'run':'walk'):'walk',1);}
        else{
          // stalk for a species-flavoured while (or until close), then commit to a rush aimed where the prey is heading
          const H=HUNT[this.kind]||HUNT.lizard;
          if(!this.hp||this.hp.p!==p)this.hp={p,t:0,stalkT:rand(H.st[0],H.st[1]),rush:false,rt:0,lx:p.x,ly:p.y,vx:0,vy:0};
          const hp=this.hp,k=Math.min(1,dt*6);hp.t+=dt;
          hp.vx=lerp(hp.vx,(p.x-hp.lx)/Math.max(dt,1e-3),k);hp.vy=lerp(hp.vy,(p.y-hp.ly)/Math.max(dt,1e-3),k);hp.lx=p.x;hp.ly=p.y;
          if(!hp.rush&&(hp.t>hp.stalkT||d<H.near)){hp.rush=true;hp.rt=0;if(this.onRush)this.onRush();}
          if(hp.rush){hp.rt+=dt;const lead=Math.min(0.45,d/90);
            this.goTo(p.x+hp.vx*lead,p.y+hp.vy*lead,dt,H.rush,1);
            if(d>100||hp.rt>4){hp.rush=false;hp.t=0;hp.stalkT=rand(0.3,1.2);}}
          else if(H.ambush&&d<70){this.stop(dt);if(this.faceToward)this.faceToward(p.x,p.y,dt);}
          else this.goTo(p.x,p.y,dt,d<50?'stalk':'walk',1);
        }
        if(this.kind!=='frog'&&this.kind!=='tarantula'&&this.kind!=='scorpion'&&Math.random()<dt*1.2)this.flick();
        break;}
      case 'strike':{const r=this.updateStrike(dt);
        if(r==='caught'&&this.held&&this.held.play){const t=this.held;this.held=null;t.caught=false;this.tg=null;this.prey=null;
          if(t.onCatch)t.onCatch(this);if(w.onPlay)w.onPlay(this,t);this.state='idle';this.timer=rand(.3,.9);if(this.onToyCatch)this.onToyCatch(t);break;}
        if(r==='caught'){this.state='chew';this.timer=this.kind==='frog'?0.7:this.kind==='snake'?1.8:BITER[this.kind]?BITER[this.kind].t:1.3;this.fxT=0.3;
          if(this.kind==='snake'&&!this.preview)SFX.play('swallow');}
        else if(r==='miss'){this.state='idle';this.timer=rand(.4,1);}
        break;}
      case 'chew':
        this.stop(dt);if(this.kind==='frog')this.eyesClosed=true;
        this.fxT-=dt;if(this.fxT<=0&&this.kind!=='frog'&&this.kind!=='snake'){const bt=BITER[this.kind];this.fxT=bt?bt.iv:0.25;const m=this.mouthScreen();
          if(!this.preview)SFX.play(bt?bt.snd:'chew');if(bt&&this.held)this.held.bites=Math.min(3,(this.held.bites||0)+1);

        if(this.scanPrey(dt))break;

        else if(this.timer<=0){this.state='idle';this.timer=1;}
        break;

        break;

        break;

        if(this.timer<=0){if(this.isActive()||Math.random()<0.7){this.state='idle';this.timer=rand(1,2);this.sleepCD=rand(60,90);}else this.timer=rand(5,9);}

  startCoil(next){

  }
  petMe(){

  startle(x,y){

  statusText(){

      case 'hunt':return this.prey&&this.prey.play?`is chasing ${this.prey.label||'a toy'}`:`is stalking ${PREY_NAME[this.prey?.type]||'something'}`;
      case 'dance':return 'is dancing!';
      case 'threat':return 'is doing a big threat pose!';
      case 'strike':return 'strikes!';
      case 'chew':return `is munching ${PREY_NAME[this.held?.type]||''}`;
      case 'drink':return f?'is hopping to the water':'is heading for water';
      case 'drinking':return f?'is soaking in the dish':'is drinking';
      case 'bask':return 'is heading to the warm rock';
      case 'basking':return 'is basking under the lamp';
      case 'sleep':return 'is looking for the hide';
      case 'sleeping':return 'is asleep';
      case 'visit':return this.vd?`is heading over to the ${ITEMS[this.vd.id].name.toLowerCase()}`:'is exploring';
      case 'visiting':{const id=this.vd&&this.vd.id,n=id?ITEMS[id].name.toLowerCase():'decor';
        return id==='fountain'?'is drinking from the fountain':id==='volcano'?'is warming up by the volcano':(id==='tent'||id==='lantern'||id==='pumpkin'||id==='crystal')?`is cosying up by the ${n}`:
          (id==='bench'||id==='castle'||id==='torii'||id==='windmill')?`is hanging out by the ${n}`:id==='chest'?'is nosing the treasure chest':`is sniffing the ${n}`;}
      case 'flee':return 'got startled!';
      case 'petted':return 'is enjoying the attention';
      case 'grabbed':return 'is being held (and has opinions)';
      case 'fall':return 'is landing';
      case 'coiling':return 'is coiling up';
      case 'hiding':return 'is hiding in its shell';
    }return '';
  }
}

const TRAITS=['cur','bold','smart','focus','energy','patience'];
const TEMPER={cur:['Curious','Aloof'],bold:['Brave','Shy'],smart:['Clever','Goofy'],focus:['Focused','Scatterbrained'],energy:['Hyper','Lazy'],patience:['Patient','Impatient']};
// the same name always gives the same personality, so friends who pick the same name get the "same" critter
function nameSeed(s){let h=2166136261;for(const c of String(s).toLowerCase().trim())h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0;}
function mindFor(kind,name){const B=MIND[kind]||MIND.default,seed=nameSeed(kind+':'+(name||''));let k=0;const j=()=>{k++;return hash((seed%1000003)+k*7919,(seed>>>11)+k*31)-0.5;};
  const m=Object.assign({},B);for(const t of TRAITS)m[t]=clamp(B[t]+j()*0.4,0.03,1);m.think=B.think*(1+j()*0.5);
  let best='cur',bd=-1;for(const t of TRAITS){const d=Math.abs(m[t]-B[t]);if(d>bd){bd=d;best=t;}}m.temper=TEMPER[best][m[best]>=B[best]?0:1];return m;}
// little pixel thought marks above a critter's head
const THINK_G={'?':['.qq.','q..q','..q.','.q..','....','.q..'],'!':['q','q','q','q','.','q'],'...':['q.q.q'],'<3':['.q.q.','qqqqq','.qqq.','..q..']};
function think(pet,g,force){if(!save.set.thoughts||pet.preview)return;const w=pet.world;if(!force&&(pet._thinkT||0)>w.t)return;pet._thinkT=w.t+0.5;
  for(const p of w.parts)if(p.type==='think'&&p.owner===pet)p.life=0;
  const hd=pet.headPos();spawn(w,'think',hd.x,hd.y-10-(pet.h||0),{g,owner:pet,life:1.2});}

// =====================================================================
//  Walker: lizard + salamander.  Spine chain + 4 IK legs with gait.
// =====================================================================
class Walker extends Pet{
  constructor(world,kind,x,y){
    super();this.initCommon(world,kind);
    const sp=this.sp=SPECIES[kind];
    this.n=sp.n;this.seg=sp.seg;this.len=(sp.n-1)*sp.seg;this.ang=rand(TAU);this.headAng=this.ang;
    this.pts=[];for(let i=0;i<this.n;i++){const px=x-Math.cos(this.ang)*i*this.seg,py=y-Math.sin(this.ang)*i*this.seg;this.pts.push({x:px,y:py,px,py});}
    this.speed=0;this.phase=0;this.h=0;this.vh=0;this.tongueT=0;this.tongueDur=0.26;
    this.outline=hex(sp.outline);

      ax:0,ay:0,rx:0,ry:0,fx:0,fy:0,sx:0,sy:0,st:0,dur:.15,stepping:false,lift:0});}
    this.updateLegs(0,false);for(const L of this.legs){L.fx=L.rx;L.fy=L.ry;}

  }
  color(m,q,s,l,x,y){return this.sp.paint.call(this,m,q,s,l,x,y);}
  radiusAt(t){const P=this.sp.profile;for(let i=1;i<P.length;i++){if(t<=P[i][0]){const a=P[i-1],b=P[i],k=(t-a[0])/(b[0]-a[0]);return lerp(a[1],b[1],k*k*(3-2*k));}}return P[P.length-1][1];}

  pointAt(s){const f=s/this.seg,i=clamp(Math.floor(f),0,this.n-2),t=clamp(f-i,0,1),a=this.pts[i],b=this.pts[i+1];
    let fx=a.x-b.x,fy=a.y-b.y;const l=Math.hypot(fx,fy)||1;return{x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),fx:fx/l,fy:fy/l,r:this.radiusAt(clamp(s/this.len,0,1))};}

  mouthScreen(){const h=this.pts[0];return{x:h.x+Math.cos(this.headAng)*0.6,y:h.y+Math.sin(this.headAng)*0.6-this.h};}
  noise(){return clamp(this.speed/this.sp.walk,0,1.5);}
  flick(){if(this.tongueT<=0){this.tongueT=this.tongueDur;if(!this.preview)SFX.play(this.kind==='snake'?'sss':'flick');}}
  goTo(tx,ty,dt,mode,arrive=3){
    const sp=this.sp,hd=this.pts[0],d=Math.hypot(tx-hd.x,ty-hd.y);
    const max=mode==='run'?sp.run:mode==='stalk'?sp.stalk:mode==='slow'?sp.slow:mode==='lunge'?sp.run*1.5:sp.walk;
    const diff=wrapA(Math.atan2(ty-hd.y,tx-hd.x)-this.ang),tr=sp.turn*(mode==='lunge'?2.2:mode==='run'?1.4:1);

  }
  stop(dt){this.speed+=(0-this.speed)*Math.min(1,dt*8);}
  faceToward(x,y,dt){const hd=this.pts[0];const diff=wrapA(Math.atan2(y-hd.y,x-hd.x)-this.ang);this.ang+=clamp(diff,-2*dt,2*dt);}
  hatAnchor(){const e=this.pointAt(this.sp.eyeS+0.4);return{x:e.x,y:e.y-this.h,a:this.headAng,s:clamp(e.r/2.6,0.65,1.3)};}
  canStrike(p){const hd=this.pts[0],d=Math.hypot(p.x-hd.x,p.y-hd.y);
    return p.h<(p.inHand?11:p.play?9:5)&&d<this.sp.strike&&Math.abs(wrapA(Math.atan2(p.y-hd.y,p.x-hd.x)-this.ang))<0.6;}

// =====================================================================

    switch(m){
      case M.BODY:{

        if(s<4.6)return(hash(x*3,y*5)>0.78?C.band:C.body)[q];

}

// =====================================================================
//  Bearded dragon: a broad, flat Walker with a spiky beard collar, flank fringes,

  constructor(world,x,y){

  update(dt){
    super.update(dt);const st=this.state,pv=this.preview;

  }
}

// =====================================================================

  constructor(world,x,y){super(world,'gecko',x,y);this.lickT=0;this.lickSide=1;this.wag=0;}

    const stalking=st==='hunt'&&this.prey&&!this.prey.play&&this.hp&&!this.hp.rush,want=stalking?1:st==='petted'?0.7:0;

// =====================================================================
//  Axolotl: feathery breathing gills, swims in the water dish, suck-pop feeding
// =====================================================================
class Axolotl extends Walker{
  constructor(world,x,y){super(world,'axolotl',x,y);this.sp=Object.assign({},SPECIES.axolotl);this.swim=0;this.breath=rand(TAU);this.ex=0;this.swT=0;}
  color(m,q,s,l,x,y){const P=PAL.axo,al=Math.abs(l),t=s/this.len;
    switch(m){
      case M.BODY:{if(t>0.5&&al>0.62)return P.fin[q];if(al>0.84)return P.belly[q];if(hash(x*3,y*5)>0.94)return P.belly[Math.min(3,q+1)];return P.skin[q];}
      case M.LIMB:return P.skin[q];case M.TOE:return P.belly[q];
      case M.EYE:return ramp('#050506','#0e0e12','#1a1a20','#2e2e38')[q];case M.PUPIL:return INK;case M.LID:return P.skin[q];
      case M.TONGUE:return P.gill[q];
    }return INK;}
  inWater(){const h=this.pts[0];return waterAt(this.world,h.x,h.y)>0.04;}
  decide(){const w=this.world;
    if(Math.random()<(w.tank==='aqua'?0.75:0.4)){const t=randomWaterSpot(w);if(t){[this.tx,this.ty]=t;const r=Math.random();this.pace=r<0.35?'slow':r<0.8?'walk':'run';this.state='wander';this.timer=12;return;}}
    super.decide();}
  update(dt){const w=this.world,S=w.stats;this.breath+=dt*(this.swim>0.5?1.6:2.4);
    const wet=this.inWater();this.swim+=((wet?1:0)-this.swim)*Math.min(1,dt*3);
    const A=SPECIES.axolotl;this.sp.wave=0.45+this.swim*0.5;this.sp.walk=A.walk+this.swim*15;this.sp.run=A.run+this.swim*26;this.sp.slow=A.slow+this.swim*2;this.sp.waveFreq=A.waveFreq*(1-this.swim*0.15);
    super.update(dt);const st=this.state;
    this.ex+=((st==='hunt'||st==='strike'||st==='chew'||st==='dance'||st==='petted'?1:0)-this.ex)*Math.min(1,dt*3);
    if(this.swim>0.5&&!this.preview){this.swT-=dt;if(this.swT<=0){this.swT=rand(0.5,1.2);const h=this.pts[0];w.ripples.push({x:h.x+rand(-2,2),y:h.y+rand(-2,2),age:0});
        if(Math.random()<0.4)SFX.play('plip');}
      if(st==='idle'&&this.timer>0.5){const t=randomWaterSpot(w);if(t){[this.tx,this.ty]=t;this.pace=Math.random()<0.5?'slow':'walk';this.state='wander';this.timer=6;}}
      S.water=Math.min(100,S.water+2*dt);}
    if(!this.preview&&game.tool==='mist'&&game.pointer.down&&game.pointer.inside){S.happy=Math.min(100,S.happy+3*dt);this.ex=Math.max(this.ex,0.8);}}
  startStrike(p){super.startStrike(p);if(!this.preview){SFX.play('bpop');const h=this.pts[0];this.world.ripples.push({x:h.x,y:h.y,age:0});}}
  statusText(){if(this.swim>0.5&&(this.state==='wander'||this.state==='idle'))return 'is swimming loops in the water';if(this.state==='strike')return 'gulps with a suck-pop!';return super.statusText();}
  updateLegs(dt,flail){super.updateLegs(dt,flail);
    if(this.swim>0.05&&!flail)for(const L of this.legs){const p=this.pts[L.idx],q=this.pts[L.idx+1],fx=(p.x-q.x)/this.seg,fy=(p.y-q.y)/this.seg,px=-fy,py=fx;
      const tx=L.ax-fx*2.2+px*L.side*1.1,ty=L.ay-fy*2.2+py*L.side*1.1;L.fx=lerp(L.fx,tx,this.swim);L.fy=lerp(L.fy,ty,this.swim);L.stepping=false;L.lift=0;}}
  drawExtras(fb){// feathery gills + smile, crisp pixels outside the body mask
    const oy=-this.h,W=fb.w,mat=fb.mat,P=PAL.axo,ol=hex(P.outline),own=new Set();
    const put=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=W||y>=fb.h||mat[y*W+x])return;fb.px[y*W+x]=c;own.add(y*W+x);};
    const e=this.pointAt(4.6),ha=Math.atan2(e.fy,e.fx),fl=1+this.ex*0.4;
    for(const sd of[-1,1])for(let g=0;g<3;g++){const a=ha+sd*(1.3+g*0.45)+Math.sin(this.breath+g*0.9)*0.14*sd,len=(3.8+(g===1?0.8:0))*fl,bx=e.x+Math.cos(a)*(e.r-0.8),by=e.y+Math.sin(a)*(e.r-0.8)+oy;
      for(let t=0;t<=len;t+=0.5){const x=bx+Math.cos(a)*t,y=by+Math.sin(a)*t;put(x,y,P.gill[2]);
        if(t>0.9&&(Math.round(t*2)&1)){for(const sg of[-1,1]){const pa=a+sg*Math.PI*0.62,fx2=Math.cos(pa),fy2=Math.sin(pa);put(x+fx2,y+fy2,sg>0?P.gill[3]:P.gill[1]);put(x+fx2*1.8,y+fy2*1.8,P.gill[2]);}}}}
    for(const i of own){const x=i%W,y=(i/W)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const j=(y+dy)*W+x+dx;if(!own.has(j)&&x+dx>=0&&x+dx<W&&y+dy>=0&&y+dy<fb.h&&!mat[j])fb.px[j]=ol;}}
    const h=this.pts[0],c=Math.cos(this.headAng),sn=Math.sin(this.headAng),mx=h.x+c*1.1,my=h.y+sn*1.1+oy,px=-sn,py=c,k=hex('#7a2a3a');
    for(let o=-1.4;o<=1.4;o+=0.7)pset(fb,mx+px*o-c*Math.abs(o)*0.35,my+py*o-sn*Math.abs(o)*0.35,k);}
}

// =====================================================================
//  Giant millipede: dozens of legs rippling in a metachronal wave, curls into a spiral
// =====================================================================
class Millipede extends Walker{
  constructor(world,x,y){super(world,'millipede',x,y);this.legPh=0;this.curl=0;this.curlT=0;}
  color(m,q,s,l,x,y){const P=PAL.milli,al=Math.abs(l),seg=this.seg;
    switch(m){
      case M.BODY:{if(s<1.3)return P.band[Math.max(0,q-1)];const f=(s%seg)/seg;if(f<0.24)return P.band[Math.max(0,q-1)];
        if(al<0.34&&q>=2)return P.body[3];return P.body[q];}
      case M.EYE:return P.body[0];case M.PUPIL:return INK;case M.LID:return P.body[q];
    }return INK;}
  startle(x,y){if(this.state==='grabbed'||this.state==='fall')return;if(this.held)this.finishEating();this.tg=null;this.prey=null;this.curlT=rand(3,4.5);this.state='curled';this.timer=this.curlT;if(!this.preview)SFX.play('clatter');}
  update(dt){
    if(this.state==='curled'){this.t+=dt;this.curlT-=dt;this.speed=0;if(this.curlT<=0){this.state='idle';this.timer=1;}}
    else super.update(dt);
    const want=(this.state==='curled'||this.state==='grabbed')?1:0;this.curl+=(want-this.curl)*Math.min(1,dt*(want?4:1.2));
    this.legPh+=dt*(1.5+this.speed*1.3);this.walkPh=(this.walkPh||0)+dt*this.speed*0.9;
    if(this.curl>0.01)this.applyCurl();
    if(this.state==='grabbed'){const P=this.pts,g=P[this.grabI],dx=this.grabX-g.x,dy=this.grabY+this.h-g.y;
      for(const p of P){p.x+=dx;p.y+=dy;p.px=p.x;p.py=p.y;}this.headAng=this.curlA??this.headAng;this.ang=this.headAng;}}
  applyCurl(){// blend every segment toward a tight spiral with the head in the middle
    if(this.state==='grabbed'){if(this.curlA==null)this.curlA=this.headAng;}else this.curlA=null;
    const P=this.pts,hd=P[0],a0=(this.curlA??this.headAng)+Math.PI,A=1.2,B=4.3/TAU;
    for(let i=1;i<this.n;i++){const s=i*this.seg,th=(-A+Math.sqrt(A*A+2*B*s))/B,r=A+B*th,tx=hd.x+Math.cos(a0+th)*r,ty=hd.y+Math.sin(a0+th)*r;
      P[i].x=lerp(P[i].x,tx,this.curl);P[i].y=lerp(P[i].y,ty,this.curl);}}
  statusText(){if(this.state==='curled')return 'curled up into a tight spiral';return super.statusText();}
  drawExtras(fb){// legs + antennae as pixels outside the body
    const oy=-this.h,W=fb.w,mat=fb.mat,P=PAL.milli,moving=this.speed>0.8,uc=1-this.curl;
    const put=(x,y,c)=>{x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=W||y>=fb.h||mat[y*W+x])return;fb.px[y*W+x]=c;};
    // one calm pair per segment, steady colours; the ripple is a gentle swing that only runs while walking
    if(uc>0.1)for(let i=2;i<this.n-2;i++){const s=i*this.seg,p=this.pointAt(s),px=-p.fy,py=p.fx,ph=this.walkPh-i*0.7,sw=Math.sin(ph)*0.7,reach=(2.0+Math.cos(ph)*0.25)*uc;
      for(const sd of[-1,1]){const r=p.r+0.2,bx=p.x+px*sd*r,by=p.y+py*sd*r+oy,tx=bx+px*sd*reach+p.fx*sw,ty=by+py*sd*reach+p.fy*sw;
        put(lerp(bx,tx,0.45),lerp(by,ty,0.45),P.leg[1]);put(tx,ty,P.leg[2]);}}
    const h=this.pts[0];for(const sd of[-1,1]){const a=this.headAng+sd*(0.45+Math.sin(this.t*5+sd)*0.22);let x=h.x+Math.cos(this.headAng)*1.2,y=h.y+Math.sin(this.headAng)*1.2+oy;
      for(let k=0;k<5;k++){const aa=a+sd*k*0.08;x+=Math.cos(aa);y+=Math.sin(aa);put(x,y,k===4?P.leg[3]:P.band[2]);}}}
}

// =====================================================================
//  Jelly slime: a soft-body ring of springy points that squish-hops, jiggles, splats,
//  shows its food digesting inside, changes colour with its dinner and buds off a mini-slime.
// =====================================================================
const SLIME_COL={base:'#5fe08a',cricket:'#f0b04a',roach:'#d0783c',worm:'#f4d45a',waxworm:'#f4ecc4',fly:'#56d4e0',snail:'#b894f0',fruit:'#ff6a9a',egg:'#fff0a0',greens:'#66d858',bloodworm:'#e04040',shrimp:'#ffa890',minnow:'#b8d0e0',moonberry:'#5aa0ff',geode:'#c080ff'};
function slimeRamp(hexc){const c=hex(hexc);return[mixc(c,hex('#06140c'),0.62),mixc(c,hex('#06140c'),0.32),c,mixc(c,hex('#ffffff'),0.45)];}
class Slime extends Pet{
  constructor(world,x,y){super();this.initCommon(world,'slime');
    this.x=x;this.y=y;this.h=0;this.vh=0;this.ang=rand(TAU);this.speed=0;this.vx=0;this.vy=0;this.R=8.5;this.N=22;this.outline=hex('#0c1a10');this.seam=1;
    this.pts=[{x,y}];this.n=1;this.ring=[];for(let i=0;i<this.N;i++){const a=i/this.N*TAU;this.ring.push({x:x+Math.cos(a)*this.R,y:y+Math.sin(a)*this.R*0.82,px:0,py:0});}
    for(const p of this.ring){p.px=p.x;p.py=p.y;}
    this.hopT=0;this.phase='rest';this.pt=0;this.sq=0;this.col=SLIME_COL.base;this.colT=SLIME_COL.base;this.cr=slimeRamp(this.col);this.gx=0;this.gy=0;
    this.mini=null;this.miniCD=rand(25,45);this.inside=null;this.gt=0;this.mood=0;}
  // ---- body helpers
  headPos(){return this.pts[0];}
  mouthScreen(){return{x:this.x+Math.cos(this.ang)*1.5,y:this.y-this.h-2};}
  hatAnchor(){return{x:this.x,y:this.y-this.h-this.R*0.55*(1+this.sq*0.4),a:this.ang,s:1.05};}
  noise(){return clamp(this.speed/40,0,1.2);}
  color(m,q,s,l,x,y){const C=this.cr;if(m===M.BODY){if(s>0.86)return C[Math.min(3,q+1)];if(s<0.55&&((x+y)&1)&&q>0)return C[q-1];return C[q];}return C[q];}
  // ---- movement: squish-hops toward a target
  goTo(tx,ty,dt,mode,arrive=3){const d=Math.hypot(tx-this.x,ty-this.y);this.ang+=wrapA(Math.atan2(ty-this.y,tx-this.x)-this.ang)*Math.min(1,dt*6);
    if(d>arrive&&this.phase==='rest'&&this.hopT<=0&&this.h<=0){this.phase='gather';this.pt=0;this.hopMode=mode;this.hopTo={x:tx,y:ty};}
    return d<=arrive;}
  stop(dt){}
  faceToward(x,y,dt){this.ang+=wrapA(Math.atan2(y-this.y,x-this.x)-this.ang)*Math.min(1,dt*3);}
  canStrike(p){const d=Math.hypot(p.x-this.x,p.y-this.y);return d<this.R+4&&(p.h<6||(p.inHand&&p.h<12)||(p.play&&p.h<10));}
  startStrike(p){this.tg={t:0,p};this.phase='gather';this.pt=0.1;this.hopMode='lunge';this.hopTo={x:p.x,y:p.y};}
  updateStrike(dt){const T=this.tg;if(!T)return 'miss';const p=T.p;T.t+=dt;if(p.dead||p.caught){this.tg=null;return 'miss';}
    this.hopTo={x:p.x,y:p.y};if(Math.hypot(p.x-this.x,p.y-this.y)<this.R*0.9&&this.h<8){p.caught=true;this.held=p;this.tg=null;catchFx(this,p);if(!this.preview)SFX.play('gulp');this.splat(0.6);return 'caught';}
    if(T.t>1.2){this.tg=null;return 'miss';}return null;}
  startle(x,y){if(this.state==='grabbed'||this.state==='fall')return;if(this.held)this.finishEating();this.tg=null;this.prey=null;
    for(const p of this.ring){p.px-=rand(-1.6,1.6);p.py-=rand(-1.6,1.6);}this.vh=28;this.h=Math.max(this.h,0.1);this.state='idle';this.timer=1.2;if(!this.preview)SFX.play('squelch');}
  splat(k){for(let i=0;i<this.N;i++){const p=this.ring[i],a=Math.atan2(p.y-this.y,p.x-this.x);p.px-=Math.cos(a)*1.6*k;p.py-=Math.sin(a)*1.1*k;}this.sq=Math.max(this.sq,-0.55*k);}
  syncHeld(){if(this.held){this.held.sx=-999;this.held.sy=-999;}}
  finishEating(){const p=this.held;if(p){this.colT=SLIME_COL[p.type]||SLIME_COL.base;this.inside={type:p.type,t:0};}super.finishEating();}
  hitTest(x,y){return Math.hypot(x-this.x,y-(this.y-this.h))<this.R+2?0:-1;}
  tryGrab(x,y){if(this.hitTest(x,y)<0)return false;if(this.held)this.finishEating();this.tg=null;this.prey=null;this.state='grabbed';this.grabX=x;this.grabY=y;this.gt=0;this.phase='rest';return true;}
  dragTo(x,y){this.grabX=x;this.grabY=y;}
  release(){if(this.state!=='grabbed')return;this.state='fall';this.vh=0;}
  update(dt){
    this.t+=dt;const w=this.world,B=w.bounds,st0=this.state;
    this.blinkT-=dt;if(this.blinkT<0){this.blink=0.14;this.blinkT=rand(2,5);}if(this.blink>0)this.blink-=dt;
    if(this.state==='grabbed'){this.gt+=dt;this.h+=(12-this.h)*Math.min(1,dt*10);this.x=lerp(this.x,this.grabX,Math.min(1,dt*12));this.y=lerp(this.y,this.grabY+this.h,Math.min(1,dt*12));this.sq=lerp(this.sq,-0.8+Math.sin(this.gt*9)*0.08,Math.min(1,dt*6));}
    else if(this.state==='fall'){this.vh-=260*dt;this.h+=this.vh*dt;if(this.h<=0){this.h=0;this.vh=0;this.splat(1.6);SFX.play('squelch');dust(w,this.x,this.y,6);this.state='idle';this.timer=0.8;}}
    else{this.brain(dt);
      // hop state machine
      this.hopT-=dt;
      if(this.phase==='gather'){this.pt+=dt;this.sq=lerp(this.sq,-0.45,Math.min(1,dt*14));
        if(this.pt>0.16){const T=this.hopTo||{x:this.x,y:this.y},d=Math.hypot(T.x-this.x,T.y-this.y)||1,m=this.hopMode,sp=m==='run'||m==='lunge'?58:m==='stalk'?16:m==='slow'?20:32;
          const dist=Math.min(d,m==='lunge'?d:sp*0.55),tt=0.42;this.vx=(T.x-this.x)/d*dist/tt;this.vy=(T.y-this.y)/d*dist/tt;this.vh=m==='lunge'?42:48;this.h=0.1;this.phase='air';this.sq=0.5;
          if(!this.preview)SFX.play('boing');}}
      else if(this.phase==='air'){this.vh-=230*dt;this.h+=this.vh*dt;this.x+=this.vx*dt;this.y+=this.vy*dt;this.sq=lerp(this.sq,0.28,Math.min(1,dt*6));
        if(this.h<=0){this.h=0;this.vh=0;this.vx=this.vy=0;this.phase='rest';this.hopT=this.hopMode==='run'||this.hopMode==='lunge'?0.05:rand(0.15,0.4);this.splat(0.9);if(!this.preview)SFX.play('squelch');}}
      else{this.sq=lerp(this.sq,0,Math.min(1,dt*5));if(this.h>0||this.vh>0){this.vh-=230*dt;this.h+=this.vh*dt;if(this.h<=0){this.h=0;this.vh=0;this.splat(0.7);}}}
      this.speed=Math.hypot(this.vx,this.vy);}
    this.x=clamp(this.x,B.x0+3,B.x1-3);this.y=clamp(this.y,B.y0+3,B.y1-3);this.pts[0].x=this.x;this.pts[0].y=this.y;
    // soft body: every rim point springs toward its place on a squashed ellipse, with Verlet momentum
    const sx=1+this.sq*0.35,sy=(1-this.sq*0.3)*0.82,idle=Math.sin(this.t*3)*0.04;
    for(let i=0;i<this.N;i++){const p=this.ring[i],a=i/this.N*TAU,tx=this.x+Math.cos(a)*this.R*(sx+idle),ty=this.y+Math.sin(a)*this.R*(sy-idle);
      const vx=(p.x-p.px)*0.9,vy=(p.y-p.py)*0.9;p.px=p.x;p.py=p.y;p.x+=vx+(tx-p.x)*Math.min(1,dt*26);p.y+=vy+(ty-p.y)*Math.min(1,dt*26);}
    for(let k=0;k<2;k++)for(let i=0;i<this.N;i++){const a=this.ring[i],b=this.ring[(i+1)%this.N];const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;a.x=lerp(a.x,mx,0.08);a.y=lerp(a.y,my,0.08);}
    // colour drifts toward the last meal
    if(this.col!==this.colT){this.colK=(this.colK||0)+dt*0.6;const A=slimeRamp(this.col),Bc=slimeRamp(this.colT),k=Math.min(1,this.colK);this.cr=A.map((c,i)=>mixc(c,Bc[i],k*k*(3-2*k)));if(this.colK>=1){this.col=this.colT;this.colK=0;this.cr=Bc;}}
    if(this.inside){this.inside.t+=dt;if(this.inside.t>5)this.inside=null;}
    // mini-slime buds off when very happy, bounces after its parent, then merges back
    this.miniCD-=dt;if(!this.mini&&!this.preview&&this.miniCD<=0&&w.stats.happy>85&&this.state!=='grabbed'){this.mini={x:this.x+8,y:this.y+2,h:0,vh:30,t:0,life:rand(18,24),vx:0,vy:0};this.miniCD=rand(50,80);SFX.play('squelch');w.onEvent&&w.onEvent('budded off a tiny friend!');this.splat(1);}
    if(this.mini){const m=this.mini;m.t+=dt;m.vh-=230*dt;m.h+=m.vh*dt;m.x+=m.vx*dt;m.y+=m.vy*dt;
      if(m.h<=0){m.h=0;const merging=m.t>m.life,tx=merging?this.x:this.x+Math.cos(this.t*0.7)*14,ty=merging?this.y:this.y+Math.sin(this.t*0.9)*9,dx=tx-m.x,dy=ty-m.y,d=Math.hypot(dx,dy)||1;
        if(merging&&d<5){this.mini=null;this.splat(1.2);SFX.play('squelch');}else{m.vh=rand(26,34);const sp=Math.min(d,14)/0.3;m.vx=dx/d*sp;m.vy=dy/d*sp;}}
      if(m){m.x=clamp(m.x,B.x0,B.x1);m.y=clamp(m.y,B.y0,B.y1);}}

  }
  statusText(){if(this.state==='chew'||this.inside)return 'is digesting (you can see it inside!)';if(this.mini)return 'is playing with its tiny slime friend';if(this.state==='grabbed')return 'is being stretched like taffy';
    return super.statusText();}
  // ---- rendering: rasterise the rim polygon into the lit layer as a gel dome
  rasterBlob(fb,cx,cy,pts,mat){const W=fb.w,H=fb.h;let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const p of pts){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1]);}
    x0=Math.max(0,Math.floor(x0));x1=Math.min(W-1,Math.ceil(x1));y0=Math.max(0,Math.floor(y0));y1=Math.min(H-1,Math.ceil(y1));const n=pts.length;
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const px=x+.5,py=y+.5;let inside=false;

function preyScare(p,w,rad){const pet=w.pet;if(!pet||p.caught||p.inHand)return null;const hd=pet.headPos();
  const d=Math.hypot(hd.x-p.x,hd.y-p.y);return d<rad?{d,hd,noise:pet.noise?pet.noise():0.5}:null;}
function ddisc(fb,x,y,r,f){const x0=Math.floor(x-r),x1=Math.ceil(x+r),y0=Math.floor(y-r*0.7),y1=Math.ceil(y+r*0.7);

// Base for the shaded foods: falling, hand/mouth holding, screen position.
class Food{
  initFood(type,x,y,h){this.type=type;this.value=FOODS[type].value;this.x=x;this.y=y;this.h=h;this.vh=0;this.ang=rand(TAU);this.t=rand(10);
    this.dead=false;this.caught=false;this.inHand=false;this.bites=0;this.layered=true;}
  fall(dt){if(this.h>0||this.vh>0){this.vh-=170*dt;this.h+=this.vh*dt;
    if(this.h<=0){if(this.vh<-70)SFX.play(this.type==='fruit'||this.type==='egg'?'squish':'tap');this.h=0;this.vh=0;return true;}}return false;}
  scr(){return(this.caught||this.inHand)?{x:this.sx,y:this.sy}:{x:this.x,y:this.y-this.h};}
  grounded(){return!this.caught&&!this.inHand&&this.h<=0.5;}
  drawShadow(fb){if(this.caught)return;if(this.inHand||this.h>0.5)ddisc(fb,this.x+1,this.y+1,2.2,.62);}
  keepIn(w){const B=w.bounds;if(this.x<B.x0||this.x>B.x1||this.y<B.y0||this.y>B.y1){this.x=clamp(this.x,B.x0,B.x1);this.y=clamp(this.y,B.y0,B.y1);this.ang+=Math.PI*0.7;return true;}return false;}
}
class Cricket{

        this.vx=Math.cos(this.ang)*sp;this.vy=Math.sin(this.ang)*sp;this.vh=rand(38,58);this.h=0.01;this.timer=rand(1.4,4.5);}

// Mealworms and waxworms: segmented larvae that crawl by peristalsis.

    this.turnV=(this.turnV||0)+(rand(-1,1)*9-(this.turnV||0)*2.2)*dt;
    this.ang+=(curling?2.4:this.turnV)*dt;
    if(s)this.ang+=wrapA(Math.atan2(this.y-s.hd.y,this.x-s.hd.x)-this.ang)*dt*2;

class Snail extends Food{

      case 'fdrop':p.vh-=120*dt;p.h+=p.vh*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.h<=1.8)p.life=0;break;

<title>Mossjar Terrarium</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A pixel-art terrarium pet game with procedurally animated critters, gachapon toys and hats.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0f0c;--panel:#16201a;--panel-2:#1e2b23;--panel-3:#243429;--line:#2f4236;--line-2:#4a6452;
  --ink:#eaf2df;--mute:#95a891;--moss:#9cd35e;--moss-d:#4f7a2c;--amber:#ffc24a;--amber-d:#a8751a;
  --pink:#ff7eb3;--teal:#45d1c1;--red:#ff6b6b;--blue:#5cb4ff;--purple:#b884ff;
  --display:"Silkscreen","Courier New",monospace;--body:"VT323","Courier New",monospace;
  --top:62px;--bot:92px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:20px;line-height:1.15;
  background-image:radial-gradient(ellipse at 50% 40%,#16241b 0%,#0a0f0c 70%);user-select:none;-webkit-user-select:none}
button{font-family:var(--display);color:var(--ink);cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
img.px,canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}

/* ---------- stage ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:#0a0f0c}
#c{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:none;touch-action:none;transform-origin:0 0}
#zoomChip{position:fixed;z-index:25;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px;transition:opacity .2s,box-shadow .15s;touch-action:none;cursor:grab}
#zoomChip.drag{cursor:grabbing;box-shadow:inset 0 0 0 2px var(--moss),0 10px 24px rgba(0,0,0,.5)}
#zGrip{height:22px;align-self:stretch;min-width:30px;margin:-2px -2px 0;border-radius:6px 6px 3px 3px;background:radial-gradient(circle,#9aac90 1.6px,transparent 2.1px) 2px 2px/6px 6px,#1a2218;box-shadow:inset 0 0 0 2px #060a07;cursor:grab}
#zGrip:hover,#zoomChip.drag #zGrip{background-color:#2a3a24}
#zoomChip .ibtn{width:34px;height:34px}#zoomChip .ibtn img{width:22px;height:22px}
#zoomChip .ibtn.on{background:#2c4a24;box-shadow:inset 0 0 0 2px var(--moss),0 4px 0 #040604}
#zLvl{font-family:var(--display);font-size:9px;min-width:0;text-align:center}
@media (max-width:760px),(pointer:coarse){#zIn,#zOut,#zLvl{display:none}#zoomChip{gap:3px;padding:3px}#zoomChip .ibtn{width:32px;height:32px}#zoomChip .ibtn img{width:20px;height:20px}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}

/* ---------- shared chunky panel look ---------- */
.chunk{background:var(--panel);border:3px solid #060a07;border-radius:8px;box-shadow:inset 0 0 0 2px var(--line),0 4px 0 #040604}
.ibtn{width:44px;height:44px;display:grid;place-items:center;padding:0;background:var(--panel-2);border:3px solid #060a07;border-radius:8px;
  box-shadow:inset 0 0 0 2px var(--line),0 4px 0 #040604;transition:transform .12s}
.ibtn:hover{transform:translateY(-2px) rotate(-3deg)}
.ibtn:active{transform:translateY(2px)}
.ibtn img{width:30px;height:30px}

/* ---------- top HUD ---------- */
#top{position:fixed;left:0;right:0;top:0;height:var(--top);display:flex;align-items:center;gap:12px;padding-inline:14px;pointer-events:none;z-index:10}
#top>*{pointer-events:auto}
#petCard{position:relative;display:flex;align-items:center;gap:10px;padding:5px 12px 5px 6px;min-width:0}
#petStats{position:absolute;left:0;top:calc(100% + 6px);width:260px;padding:10px 12px;z-index:12;font-size:15px}
#petStats .ps-t{font-size:17px;margin-bottom:6px;color:var(--mute)}#petStats .ps-t b{color:#ffd88a;font-weight:normal}
#petStats .ps-r{display:flex;align-items:center;gap:8px;margin:4px 0}#petStats .ps-r span{width:78px;color:var(--ink)}
#petStats .ps-r i{position:relative;flex:1;height:9px;background:#0a0f0c;border-radius:3px;box-shadow:0 0 0 2px #060a07}
#petStats .ps-r em{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6ab04c,#ffd88a);border-radius:3px}
#petStats .ps-r u{position:absolute;top:-3px;bottom:-3px;width:2px;background:#f4f0e0;opacity:.7}
#petStats .ps-m{margin-top:8px;color:var(--mute)}#petStats .ps-m b{color:var(--ink);font-weight:normal}#petStats .ps-n{margin-top:6px;font-size:12px;color:var(--mute);line-height:1.3}
#lvl{position:relative;width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--pink) calc(var(--p,0)*1turn),#2a1f28 0);box-shadow:0 0 0 3px #060a07}
#lvl::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel-2)}
#lvl b{position:relative;font-family:var(--display);font-size:15px;color:var(--ink)}
#lvl small{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-family:var(--display);font-size:8px;letter-spacing:.08em;
  background:var(--pink);color:#2a0f1c;padding:0 4px;border-radius:3px}
#petText{display:flex;flex-direction:column;min-width:0}
#petName{background:none;border:0;padding:0;font-size:15px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
#petName:hover{color:var(--amber)}
#petKind{font-size:17px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnrow{display:flex;align-items:center;gap:6px;min-width:0}
#petMood{font-family:var(--display);font-size:9px;white-space:nowrap;padding:2px 6px 1px;border-radius:9px;background:#26302a;box-shadow:0 0 0 2px #060a07;letter-spacing:.04em;flex:none}
#petMood.thriving{color:#2a1c04;background:#ffd86a}#petMood.content{color:var(--mute)}#petMood.grumpy{color:#dce8f6;background:#4a5a70}
#meters{display:flex;gap:8px;margin-left:6px}
.meter{display:flex;align-items:center;gap:4px}
.meter img{width:18px;height:18px}
.meter .bar{width:52px;height:10px;background:#0a0f0c;border-radius:3px;box-shadow:0 0 0 2px #060a07;overflow:hidden}
.meter .bar i{display:block;height:100%;width:50%;background:var(--c);transition:width .3s}
.meter.low{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.45}}
#toast{position:fixed;left:50%;top:calc(var(--top) + 4px);transform:translateX(-50%);z-index:9;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:max-content;max-width:min(560px,calc(100vw - 32px))}
/* newest message on top; the previous one slides under it, smaller and faded */
.tmsg{padding:7px 14px 6px;font-size:21px;text-align:center;opacity:.93;transform-origin:50% 0;transition:transform .65s cubic-bezier(.25,.8,.3,1),opacity .65s ease,filter .65s;animation:tmsgin .6s cubic-bezier(.25,.8,.3,1)}
.tmsg.old{transform:scale(.82);opacity:.5;filter:saturate(.6)}
.tmsg.gone{opacity:0;transform:scale(.75) translateY(-4px)}
.tmsg.event{background:#3a2e10;box-shadow:inset 0 0 0 2px var(--amber-d),0 4px 0 #040604;color:#ffe7a6}
.tmsg.event:not(.old){animation:toastpop .55s cubic-bezier(.25,.8,.3,1)}
@keyframes tmsgin{from{opacity:0;transform:translateY(-6px) scale(.98)}}
@keyframes toastpop{0%{transform:scale(.88);opacity:0}60%{transform:scale(1.03);opacity:1}100%{transform:scale(1)}}
#topR{margin-left:auto;display:flex;align-items:center;gap:8px}
#menusTop{display:flex;gap:6px}.mbtn{position:relative}.mbtn.goals{background:#2e2a1a}.mbtn.bag{background:#2e2418}.mbtn.gacha{background:#3a1f30}.mbtn.pets{background:#2a2433}
#coins{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;font-family:var(--display);font-size:18px;color:var(--amber);cursor:pointer}
#coins img{width:24px;height:24px}
#coins.bump{animation:bump .35s}
#coins.poor{animation:shake .4s}
@keyframes bump{40%{transform:scale(1.18)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}

/* ---------- dock ---------- */
#dock{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:10;display:flex;align-items:flex-end;gap:10px;padding:7px;max-width:calc(100vw - 16px)}
.dgroup{display:flex;gap:6px}
.dsep{width:3px;align-self:stretch;background:var(--line);border-radius:2px;margin:6px 0}
.db{position:relative;width:62px;height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0 3px;
  background:var(--panel-2);border:3px solid #060a07;border-radius:9px;box-shadow:inset 0 0 0 2px var(--line),0 4px 0 #040604;transition:transform .12s,background .15s}
.db img{width:36px;height:36px;transition:transform .15s}
.db span{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.db kbd{position:absolute;top:2px;right:4px;font-family:var(--display);font-size:8px;color:var(--mute);opacity:.8}
.db:hover{transform:translateY(-3px)}
.db:hover img{transform:rotate(-8deg) scale(1.08)}
.db:active{transform:translateY(2px)}
.db.on{background:#2c4a24;box-shadow:inset 0 0 0 2px var(--moss),0 4px 0 #040604,0 0 18px rgba(156,211,94,.35);transform:translateY(-6px)}
.db.on span{color:var(--ink)}
.db.menu{background:#2a2433}
/* Fun UI: a real pegboard canvas replaces the tool buttons */
#gauges,#jar{display:none}
/* Fun food drawer: a stack of wooden trays, each holding a row of little glass tanks */
#tray.drawer{display:flex;gap:6px;padding:0;overflow:visible;width:min(800px,calc(100vw - 16px));align-items:stretch;background:none;border:0;box-shadow:none;
  --tw:160px;--th:112px;--rows:2;--rh:calc(var(--th) + 36px)}
.dr-rows{flex:1;min-width:0;height:calc(var(--rows)*var(--rh));overflow:hidden;touch-action:none}
.dr-row{height:var(--rh);position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:8px;box-sizing:border-box}
.dr-strip{position:relative;z-index:1;display:flex;gap:14px;overflow:hidden;padding:10px 40px 0 14px;cursor:grab}
.dr-strip.drag{cursor:grabbing}
.dr-plank{position:relative;height:16px;margin-top:-9px;border-radius:3px;background:linear-gradient(#b07a44 0,#c88c52 3px,#8a5a30 4px,#6a4222 11px,#4a2c14 16px);box-shadow:0 0 0 2px #1a0f06,0 5px 8px rgba(0,0,0,.45)}
.dr-plank::after{content:"";position:absolute;inset:4px 6px auto;height:1px;background:repeating-linear-gradient(90deg,rgba(255,220,160,.18) 0 18px,transparent 18px 31px)}
.dr-sign{position:absolute;left:10px;bottom:-1px;z-index:2;font-family:var(--display);font-size:9px;letter-spacing:.1em;color:#3a2410;background:#e8d0a0;padding:2px 6px 1px;border-radius:2px;box-shadow:0 0 0 1.5px #3a2410}
.dr-sign i{font-style:normal;color:#d0305a;margin-left:3px}
.dr-tank{position:relative;flex:none}
.dr-tank canvas{display:block;width:var(--tw);height:var(--th);image-rendering:pixelated;touch-action:none;filter:drop-shadow(3px 4px 0 rgba(0,0,0,.35))}
.dr-tank.meh canvas{filter:grayscale(.7) brightness(.72) drop-shadow(3px 4px 0 rgba(0,0,0,.35))}
.dr-tank.on::after{content:"";position:absolute;inset:-4px;border-radius:6px;box-shadow:0 0 0 2px #ffc24a,0 0 14px rgba(255,194,74,.55);pointer-events:none}
.dr-tag{position:absolute;top:-9px;right:-6px;display:flex;align-items:center;gap:2px;padding:3px 6px 2px 5px;font-family:var(--display);font-size:11px;color:#3a2410;background:#ecd6a8;border-radius:2px 6px 6px 2px;box-shadow:0 0 0 1.5px #3a2410,1px 2px 0 1px rgba(0,0,0,.35);transform:rotate(9deg);pointer-events:none;z-index:2}
.dr-tag::before{content:"";position:absolute;left:3px;top:50%;width:3px;height:3px;margin-top:-1.5px;border-radius:50%;background:#3a2410}
.dr-tag img{width:10px;height:10px;margin-left:4px}.dr-tag i{font-style:normal;color:#e0406a;margin-left:1px}
.dr-side{flex:none;width:40px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 4px}
.dr-track{flex:1;width:12px;border-radius:6px;background:rgba(10,6,2,.55);box-shadow:inset 0 0 0 2px #3a2410;position:relative;min-height:40px;cursor:pointer;touch-action:none}
.dr-thumb{position:absolute;left:2px;right:2px;border-radius:4px;background:linear-gradient(90deg,#e8b878,#b07a44);box-shadow:0 0 0 1px #1a0f06;cursor:grab}
.dr-side .ti.trash{width:40px;height:40px;background:#2a1c10;flex:none}
#mWelcome .wb-top{display:flex;gap:14px;align-items:center;margin:2px 0 12px}
#wbPet{width:168px;height:108px;flex:none;border-radius:6px;box-shadow:0 0 0 3px #10140e,0 0 0 5px #3e5230,0 6px 0 5px rgba(0,0,0,.35)}
#wbSay{position:relative;flex:1;background:#f4ecd8;color:#2a1a0e;padding:10px 12px;border-radius:10px;font-size:18px;line-height:1.3;box-shadow:0 0 0 2px #10140e,0 4px 0 2px rgba(0,0,0,.3);animation:wbpop .45s cubic-bezier(.3,1.6,.5,1) .15s both}
#wbSay::before{content:"";position:absolute;left:-12px;top:calc(50% - 8px);border:8px solid transparent;border-right:12px solid #10140e}
#wbSay::after{content:"";position:absolute;left:-8px;top:calc(50% - 6px);border:6px solid transparent;border-right:9px solid #f4ecd8}
@keyframes wbpop{from{transform:scale(.6) rotate(-3deg);opacity:0}to{transform:none;opacity:1}}
.wb-stats{display:flex;gap:12px;margin:0 0 8px}
.wb-st{flex:1;display:flex;align-items:center;gap:6px;font-size:13px;min-width:0}.wb-st img{width:22px;height:22px;flex:none}
.wb-st .bar{flex:1;height:9px;border-radius:5px;background:rgba(0,0,0,.45);overflow:hidden;box-shadow:inset 0 0 0 1px #0a0d08}
.wb-st .bar i{display:block;height:100%;background:var(--c);width:var(--w);transition:width 1.1s cubic-bezier(.5,0,.3,1) .5s}
#wbBody{font-size:17px;line-height:1.35;padding:2px 2px 10px}#wbBody p{margin:6px 0}#wbBody img{width:16px;height:16px;vertical-align:-2px}#wbBody .tip{font-size:14px;opacity:.75}
@media (max-width:420px){#mWelcome .wb-top{flex-direction:column;align-items:stretch}#wbPet{align-self:center}#wbSay::before,#wbSay::after{display:none}}
#dragCur{position:fixed;left:0;top:0;z-index:80;pointer-events:none;image-rendering:pixelated;display:none}
@media (max-width:760px){#tray.drawer{--tw:130px;--th:91px}.dr-strip{gap:12px;padding:10px 30px 0 10px}}
@media (max-height:500px) and (min-width:600px){#tray.drawer{--tw:104px;--th:73px;--rows:1}.dr-side .ti.trash{width:34px;height:34px}}
body.fun-needs #meters{display:none}body.fun-needs #gauges{display:flex;align-items:center;gap:8px;margin-left:8px}
#gauges canvas{height:44px;width:auto;image-rendering:pixelated;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45))}
body.fun-coins #coins img{display:none}body.fun-coins #jar{display:block;height:40px;width:auto;image-rendering:pixelated;margin:-6px 0 -6px -2px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
body.fun-coins #coinNum{background:#f0e2c0;color:#3a2410;padding:2px 6px 1px;border-radius:2px;box-shadow:0 0 0 2px #1a0f06;font-size:15px}
#peg{display:none;height:88px;width:auto;image-rendering:pixelated;touch-action:none;cursor:pointer;border-radius:6px}
body.fun-tools #tools{display:none}body.fun-tools #peg{display:block}
body.fun-tools #dock{padding:4px;background:#1a0f06;border-color:#060a07;box-shadow:inset 0 0 0 2px #3a2410,0 5px 0 #040604,0 10px 18px rgba(0,0,0,.45)}
.db.menu.gacha,#d-gacha{background:#3a1f30}
.mbtn .dot,.db .dot{position:absolute;top:-5px;left:-5px;width:14px;height:14px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px #060a07;animation:bump 1.2s infinite}
#tray{position:absolute;left:50%;bottom:calc(100% + 10px);transform:translateX(-50%);display:flex;gap:6px;padding:7px;max-width:calc(100vw - 24px);overflow-x:auto;animation:trayin .2s;transition:opacity .22s,transform .22s}
#tray.tuck{opacity:0;transform:translateX(-50%) translateY(28px) scale(.92);pointer-events:none}
#trayTab{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:3px 10px 3px 6px;border-radius:8px 8px 3px 3px;background:#2a1c10;color:#f0dcb0;font-family:var(--display);font-size:11px;box-shadow:0 0 0 2px #0a0704,inset 0 2px 0 #5a3a20;cursor:pointer;animation:trayin .2s}
#trayTab canvas{width:30px;height:22px;image-rendering:pixelated}#trayTab[hidden]{display:none}
@keyframes trayin{from{opacity:0;transform:translate(-50%,10px)}}
.ti{position:relative;flex:none;width:56px;height:56px;display:grid;place-items:center;padding:0;background:var(--panel-2);border:3px solid #060a07;border-radius:8px;
  box-shadow:inset 0 0 0 2px var(--line);transition:transform .1s}
.ti canvas{width:44px;height:32px;margin-top:-7px}
.ti:hover{transform:translateY(-3px)}
.ti.on{box-shadow:inset 0 0 0 2px var(--amber),0 0 12px rgba(255,194,74,.35);background:#33301c}
.tsep{flex:none;width:3px;align-self:stretch;margin:4px 2px;border-radius:2px;background:#060a07}
.ti.trash img{width:30px;height:30px}
.ti.trash.hot{background:#5a1e20;box-shadow:inset 0 0 0 2px var(--red,#e5484d),0 0 14px rgba(229,72,77,.6);transform:translateY(-4px) scale(1.08)}
.tcats{flex:none;display:flex;flex-direction:column;gap:3px;justify-content:center;margin-right:2px}
.tcat{font:inherit;font-size:10px;text-transform:uppercase;padding:2px 7px;min-width:62px;text-align:left;background:#1c2418;color:var(--mute);border:2px solid #060a07;border-radius:5px;cursor:pointer;position:relative}
.tcat.on{background:#3a3418;color:#ffe9a8;box-shadow:inset 0 0 0 1px var(--amber)}
.tcat i{font-style:normal;color:#ff7a9a;margin-left:4px}
.ti.meh{opacity:.45}
.seg{display:flex;gap:6px}
#setPieces{margin:-4px 0 6px 12px;border-left:2px solid var(--line);padding-left:10px}
#setPieces .srow{padding:6px 0;border:0}#setPieces label{font-size:15px}#setPieces small{font-size:12px}#setPieces .seg .btn{padding:4px 10px;font-size:13px}.seg .btn{flex:none;padding-inline:14px}.seg .btn.on{background:#3a3418;color:#ffe9a8;box-shadow:inset 0 0 0 2px var(--amber)}
/* Fun UI: supply tanks you pluck food from */
.ti.filler{visibility:hidden;pointer-events:none}
.ti{touch-action:none}
.ps-c{font-size:15px;margin:2px 0 6px;color:var(--mute)}.ps-c i{display:block;height:5px;background:#10140e;border-radius:3px;margin-top:3px;overflow:hidden}.ps-c em{display:block;height:100%;background:#ff7a9a}
.ti .tpr{position:absolute;top:1px;left:3px;font-style:normal;font-size:9px;color:#ffe9a8;text-shadow:0 1px 0 #000;display:flex;align-items:center;gap:1px;line-height:1}
.ti .tpr img{width:9px;height:9px}
.ti.poor canvas{filter:grayscale(.8) brightness(.6)}.ti.poor .tpr{color:#ff8a7a}
.ti .tfav{position:absolute;top:1px;right:3px;font-style:normal;font-size:11px;color:#ff7a9a;text-shadow:0 1px 0 #000}
.ti .tl{position:absolute;bottom:3px;left:0;right:0;font-size:8px;text-transform:uppercase;color:var(--mute);text-align:center}
.tray-note{font-size:19px;color:var(--mute);padding:6px 10px;white-space:nowrap;display:flex;align-items:center;gap:10px}
.tray-note button{font-size:11px;padding:6px 10px;background:#3a1f30;border:2px solid #060a07;border-radius:6px}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:16px;background:rgba(4,7,5,.62);backdrop-filter:blur(3px)}
.sheet{position:relative;width:min(960px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:18px 20px 20px;animation:sheetin .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes sheetin{from{opacity:0;transform:translateY(24px) scale(.94)}}
.sheet-h{display:flex;align-items:center;gap:12px;margin:-18px -20px 14px;padding:14px 20px 8px;position:sticky;top:-18px;z-index:3;background:var(--panel);border-radius:8px 8px 0 0}
.sheet-h h2{margin:0;font-family:var(--display);font-size:24px;letter-spacing:.02em;text-wrap:balance}
.sheet-h p{margin:0;color:var(--mute);font-size:19px}
.sheet-h .x{margin-left:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.gsub{color:var(--mute);font-size:15px;margin:0 0 10px}.gcat{font-size:13px;color:var(--amber);text-transform:uppercase;margin:14px 0 6px;letter-spacing:1px}
.gcard{display:flex;align-items:center;gap:10px;background:var(--panel-2);border:3px solid #060a07;border-radius:8px;padding:8px 10px;margin-bottom:6px;box-shadow:inset 0 0 0 2px var(--line)}
.gcard.done{box-shadow:inset 0 0 0 2px #6a8a3a;background:#223018}.gcard.locked{opacity:.85}.gcard.locked .gico{filter:grayscale(1);opacity:.6}.gcard.bonus{border-style:dashed}

.gico{font-size:20px;width:26px;text-align:center}.grw{font-size:16px;color:#ffe9a8;display:flex;align-items:center;gap:3px;white-space:nowrap}.grw img{width:14px;height:14px}.gcard.done .grw{color:#9cf07a}
.gbar{display:block;height:6px;background:#10140e;border-radius:3px;overflow:hidden}.gbar em{display:block;height:100%;background:linear-gradient(90deg,#8fcf5a,#f2c14e)}
.gtoast{position:fixed;left:50%;top:26%;transform:translateX(-50%);background:#2a2410;border:3px solid #060a07;box-shadow:inset 0 0 0 2px #c89a30,0 4px 0 #040604;border-radius:10px;padding:8px 16px;display:flex;flex-direction:column;align-items:center;gap:2px;z-index:60;animation:gtin .45s cubic-bezier(.2,1.4,.4,1);pointer-events:none;transition:opacity .6s,transform .6s}
.gtoast b{color:#ffe07a;font-size:18px}.gtoast span{color:#f0e6c8;font-size:14px}.gtoast.out{opacity:0;transform:translateX(-50%) translateY(-10px)}
@keyframes gtin{from{transform:translateX(-50%) scale(.6);opacity:0}}
.tab{font-size:12px;padding:8px 12px 7px;background:var(--panel-2);border:3px solid #060a07;border-radius:8px;box-shadow:inset 0 0 0 2px var(--line)}
.tab.on{background:#2c4a24;box-shadow:inset 0 0 0 2px var(--moss)}
.tab .n{color:var(--mute);margin-left:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 8px 8px;background:var(--panel-2);border:3px solid #060a07;border-radius:10px;
  box-shadow:inset 0 0 0 2px var(--rc,var(--line))}
.card canvas.icon{width:84px;height:84px}
.card h3{margin:0;font-family:var(--display);font-size:11px;text-align:center;line-height:1.25;min-height:28px;display:grid;place-items:center}
.card .rar{font-family:var(--display);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--rc)}
.card .cnt{position:absolute;top:6px;right:8px;font-family:var(--display);font-size:11px;color:var(--mute)}
.card .worn{position:absolute;top:6px;left:8px;font-family:var(--display);font-size:8px;background:var(--moss);color:#14200c;padding:2px 4px;border-radius:3px}
.card .acts{display:flex;gap:4px;width:100%}
.btn{flex:1;font-size:11px;padding:7px 6px 6px;background:#2c4a24;border:2px solid #060a07;border-radius:6px;box-shadow:0 3px 0 #040604}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #040604}
.btn.alt{background:var(--panel-3)}
.btn[disabled]{opacity:.4;cursor:default;filter:none}
.empty{padding:26px;text-align:center;color:var(--mute);font-size:21px;display:grid;gap:12px;justify-items:center}
.empty .btn{flex:none;padding:9px 14px}

/* gacha */
.gwrap{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start}
.machine{position:relative}
#gcv{width:384px;height:528px;display:block;cursor:pointer}
.ginfo{display:flex;flex-direction:column;gap:12px;min-width:0}
.gtitle{font-family:var(--display);font-size:20px}
.gdesc{color:var(--mute);font-size:20px;margin:0}
.pull{font-size:15px;padding:14px 16px 12px;border:3px solid #060a07;border-radius:10px;box-shadow:0 5px 0 #040604;display:flex;align-items:center;justify-content:center;gap:10px;color:#1a0d14}
.pull img{width:24px;height:24px}
.pull:hover{filter:brightness(1.1)}

.pull[disabled]{opacity:.5;cursor:default}
.odds{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--display);font-size:9px;letter-spacing:.06em}
.odds span{color:var(--c)}

.coll h4{margin:4px 0 8px;font-family:var(--display);font-size:11px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.cg{position:relative;aspect-ratio:1;background:#0d130f;border-radius:7px;box-shadow:inset 0 0 0 2px var(--rc,#26352b);display:grid;place-items:center}
.cg canvas{width:44px;height:44px}
.cg.unk canvas{filter:brightness(0) opacity(.45)}
.cg.unk::after{content:"?";position:absolute;font-family:var(--display);font-size:14px;color:#4a5e50}
.reveal{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(4,7,5,.8);border-radius:8px;overflow:hidden;animation:fadein .2s}
@keyframes fadein{from{opacity:0}}
.rays{position:absolute;width:900px;height:900px;left:50%;top:50%;margin:-450px 0 0 -450px;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,var(--rc) 0 10deg,transparent 10deg 24deg);opacity:.28;animation:spin 9s linear infinite;
  -webkit-mask:radial-gradient(circle,#000 0,#000 30%,transparent 62%);mask:radial-gradient(circle,#000 0,#000 30%,transparent 62%)}
@keyframes spin{to{transform:rotate(1turn)}}
.rcard{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 26px 18px;max-width:340px;text-align:center;animation:rcard .5s cubic-bezier(.2,1.6,.4,1)}

.rcard .acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;justify-content:center}
.rcard .btn{flex:none;padding:9px 14px}

/* roster */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--panel-2);border:3px solid #060a07;border-radius:10px;box-shadow:inset 0 0 0 2px var(--line)}
.rgroup{grid-column:1/-1;font-family:var(--display);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border-bottom:2px solid var(--line);padding:6px 2px 4px;margin-top:4px}
.pcard.here{box-shadow:inset 0 0 0 2px var(--moss)}
.pcard.locked canvas{filter:grayscale(.55) brightness(.75)}
.pcard h3 .rn{font:inherit;font-size:13px;margin-left:6px;padding:0 5px;background:#2a2f22;color:#d8e6b8;border:2px solid #060a07;border-radius:5px;cursor:pointer;vertical-align:middle}
.pcard .rnin{font:inherit;font-size:18px;padding:3px 6px;background:#10160e;color:#fff;border:2px solid var(--amber);border-radius:6px;width:100%}
.pcard .temper{color:#ffd88a;font-weight:normal}
.pcard .hab{font:inherit;font-size:12px;padding:4px 6px;border-radius:6px;background:#2a2f22;color:#d8e6b8;border:2px solid #060a07;cursor:pointer;text-align:center}
.pcard .hab.on{background:#173a44;color:#bdeef0}
.pcard div.hab{cursor:default}
.pcard .btn.buy{background:linear-gradient(#f4c64a,#c8901e);color:#2a1a04}
.pcard canvas{width:100%;aspect-ratio:112/72;border-radius:6px;box-shadow:0 0 0 2px #060a07}
.pcard h3{margin:0;font-family:var(--display);font-size:13px}
.pcard .sub{color:var(--mute);font-size:18px;margin-top:-4px}
.pcard p{margin:0;font-size:18px;color:#c9d6c1;flex:1}
.pcard .btn{flex:none;padding:9px 6px 8px}
.pcard .meta{display:flex;justify-content:space-between;font-family:var(--display);font-size:9px;color:var(--pink)}

/* settings */
.srow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:2px dashed var(--line)}
.srow label{flex:1;font-size:22px}
.srow small{display:block;color:var(--mute);font-size:17px}
.sw{width:58px;height:30px;border-radius:16px;background:#2a332c;border:3px solid #060a07;position:relative;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--mute);transition:left .15s,background .15s}
.sw.on{background:var(--moss-d)}
.sw.on::after{left:31px;background:var(--moss)}
input[type=range]{accent-color:var(--moss);width:180px}
.danger{background:#5a1f22!important}

/* fx */
.coinfly{position:fixed;width:22px;height:22px;z-index:31;transition:transform .7s cubic-bezier(.5,-0.35,.7,1),opacity .7s}
.floaty{position:fixed;font-family:var(--display);font-size:14px;color:var(--amber);text-shadow:0 2px 0 #1a1204;transform:translate(-50%,-50%);animation:floaty 1.2s forwards;white-space:nowrap}
@keyframes floaty{to{transform:translate(-50%,-240%);opacity:0}}
.lvlup{position:fixed;left:50%;top:38%;z-index:32;transform:translate(-50%,-50%);font-family:var(--display);font-size:34px;color:var(--pink);text-shadow:0 4px 0 #3a0f24;animation:lvlup 1.8s forwards;pointer-events:none;white-space:nowrap}
@keyframes lvlup{0%{transform:translate(-50%,-50%) scale(.2)}20%{transform:translate(-50%,-50%) scale(1.15)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}

'use strict';

    case M.RIM:{if(hash(x*7,y*5)>0.88)q=Math.max(0,q-1);return PAL.rim[q];}
    case M.CORAL:{if(hash(x*5,y*7)>0.8)q=Math.min(3,q+1);return PAL.coral[q];}// polyps speckle the branches

    case M.CORAL3:{const g=Math.sin(x*1.3+Math.sin(y*0.9)*2.2)+Math.sin(y*1.2+Math.sin(x*0.8)*2);return PAL.coral3[Math.abs(g)<0.45?Math.max(0,q-1):q];}// brain-coral grooves

  }

// logarithmic-looking spiral stripe for shells, from the shell's centre
function spiralStripe(x,y,c){const dx=x+.5-c.x,dy=y+.5-c.y,d=Math.hypot(dx,dy)/c.r;if(d<0.16)return false;
  const th=Math.atan2(dy,dx)-c.ang,v=d*1.7+th/TAU;return v-Math.floor(v)<0.4;}
function nearestShell(list,x,y){let b=null,bd=1e9;for(const c of list){const d=Math.hypot(x-c.x,y-c.y);if(d<bd){bd=d;b=c;}}return b;}
const FOOD_PAINTER={outline:hex('#140c06'),seam:1.0,shells:[],color(m,q,s,l,x,y){const F=PAL.food;
  switch(m){

    case M.F_HEAD:return F.head[q];
    case M.F_SNAIL:return F.snail[q];
    case M.SHELLA:{const c=nearestShell(this.shells,x,y);return(c&&spiralStripe(x,y,c)?PAL.crab.shB:PAL.crab.shA)[q];}

    case M.F_BLOOD:return PAL.food2.blood[q];
    case M.F_SHRIMP:{const G=PAL.food2.shrimp;if(s>=4.5)return G[Math.max(0,q-1)];if((s%1)<0.2)return G[Math.max(0,q-1)];return G[q];}
    case M.F_MOON:{const G=PAL.food2.moon;if(hash(x*7+1,y*5)>0.86)return G[3];return G[q];}
    case M.F_PETAL:return PAL.food2.petal[q];
    case M.F_GRAPE:{if(s>0.6&&q>=2)return PAL.food2.grape[3];return PAL.food2.grape[q];}// the bright rim reads as a see-through jelly skin
    case M.F_STARC:return PAL.food2.starc[Math.min(3,q+(hash(x*5,y*7)>0.6?1:0))];
    case M.F_POLLEN:return PAL.food2.pollen[Math.min(3,q+(hash(x*5,y*3)>0.7?1:0))];
    case M.F_GEM:return PAL.food2.gem[Math.min(3,q+(hash(x*3,y*7)>0.7?1:0))];
    case M.ROCK:return PAL.rock[q];
    case M.F_ROACH:return((s%1.1)<0.25?F.roach[Math.max(0,q-1)]:F.roach[q]);
    case M.F_GREEN:if(Math.abs(l)<0.12&&s>0.5)return F.green[Math.min(3,q+1)];if(Math.abs(l)>0.78&&hash(x*3,y*7)>0.5)return F.green[Math.min(3,q+1)];return F.green[q];
    case M.F_EGG:if(vnoise(x*.9,y*.9)>0.68||hash(x*3,y*11)>0.9)return F.speck[Math.max(0,q-1)];return F.egg[q];
  }return INK;}};
const PLANT_PAINTER={outline:hex('#08140a'),seam:0.7,color(m,q,s,l,x,y){
  if(m===M.STEM)return PAL.stem[q];
  if(m===M.CATTAIL)return PAL.bark[Math.min(3,q+(hash(x*3,y*5)>0.8?1:0))];
  let r=PAL.leaf;
  if(m===M.LEAF1){if(vnoise(x*.33+3,y*.33)>0.68)r=PAL.leafVar;}
  else if(m===M.LEAF2)r=PAL.fern;
  else if(m===M.LEAF3)r=s<4.5?PAL.brom:PAL.leafDark;
  if(Math.abs(l)<0.16&&s>0.8)q=Math.min(3,q+1);
  return r[q];}};

// =====================================================================
//  Giant land snail: a rippling foot on a spine chain, whorled shell, eye stalks.
// =====================================================================
class GSnail extends Walker{
  constructor(world,x,y){super(world,'gsnail',x,y);this.tuck=0;this.hideT=0;this.tent=1;this.trailT=0;this.seam=0.9;this.shellC=null;}
  color(m,q,s,l,x,y){const P=PAL.gsnail;
    switch(m){

      case M.SHELLA:{const C=this.shellC;if(!C)return P.shA[q];
        const dx=x+.5-C.x,dy=y+.5-C.y,d=Math.hypot(dx,dy)/C.r,th=Math.atan2(dy,dx)-C.ang;
        const v=d*1.9+th/TAU;if(d>0.12&&v-Math.floor(v)<0.13)return P.seam[q];

  flick(){}
  get tk(){return this.tuck;}
  hatAnchor(){const c=this.pts[7];return{x:c.x,y:c.y-this.h-2.5,a:this.headAng,s:1.1};}
  canStrike(p){const hd=this.pts[0];return Math.hypot(p.x-hd.x,p.y-hd.y)<4.5&&(p.h<3||(p.inHand&&p.h<11)||(p.play&&p.h<6));}
  startStrike(p){this.tg={t:0,p};}
  updateStrike(dt){
    const T=this.tg;if(!T)return 'miss';const p=T.p;T.t+=dt;
    if(p.dead||p.caught){this.tg=null;return 'miss';}

  startle(x,y){if(this.state==='grabbed'||this.state==='fall')return;if(this.held)this.finishEating();this.retreat();}
  update(dt){

    }else{this.brain(dt);const tt=this.state==='sleeping'?1:0;this.tuck+=(tt-this.tuck)*Math.min(1,dt*(tt?2:1.2));}
    const tn=this.state==='petted'?0.25:(this.tuck>0.3?0:1);this.tent+=(tn-this.tent)*Math.min(1,dt*(tn<this.tent?10:1.5));

  hitTest(x,y){const c=this.pts[7];if(Math.hypot(x-c.x,y-(c.y-this.h))<7)return 7;return super.hitTest(x,y);}
  tryGrab(x,y){if(this.hitTest(x,y)<0)return false;if(this.held)this.finishEating();this.tg=null;this.prey=null;
    this.state='grabbed';this.grabX=x;this.grabY=y;return true;}
  release(){if(this.state!=='grabbed')return;this.state='fall';this.vh=0;this.speed=0;}
  grabStep(dt){
    this.h+=(10-this.h)*Math.min(1,dt*10);this.tuck+=(1-this.tuck)*Math.min(1,dt*8);this.tent=0;
    const c=this.pts[7],dx=this.grabX-c.x,dy=this.grabY+this.h-c.y;for(const p of this.pts){p.x+=dx;p.y+=dy;p.px=p.x;p.py=p.y;}

        fb.cap(Q[i].x,Q[i].y+oy,r0,Q[i+1].x,Q[i+1].y+oy,r1,M.BODY,1,i*this.seg,(i+1)*this.seg);}

      for(const sd of[-1,1]){

        if(L1>0.4){const ta=a+sd*(0.38+Math.sin(this.t*1.3+sd*2)*0.12),tx=bx+Math.cos(ta)*L1,ty=by+Math.sin(ta)*L1;
          fb.cap(bx,by,.5,tx,ty,.38,M.LIMB,2);fb.cap(tx,ty,.62,tx,ty,.62,M.PUPIL,2,0,0,1.5);}
        if(L2>0.3){const la=a+sd*0.95;fb.cap(bx,by,.42,bx+Math.cos(la)*L2,by+Math.sin(la)*L2,.3,M.LIMB,2);}
      }
    }
    const b=P[8];let dx=sp.x-b.x,dy=sp.y-b.y;const dl=Math.hypot(dx,dy)||1;dx/=dl;dy/=dl;
    const cx=sp.x,cy=sp.y+oy,r=5.4;

    this.shellC={x:cx-dx*1.5-dy*1.2,y:cy-dy*1.5+dx*1.2,r,ang:Math.atan2(dy,dx)};
  }
}

// =====================================================================
//  Veiled chameleon: rocking leaf-walk, spiral tail, turret eyes, ballistic tongue, mood colours.
// =====================================================================
class Chameleon extends Walker{
  constructor(world,x,y){
    super(world,'chameleon',x,y);this.curl=1;this.curlDir=Math.random()<0.5?1:-1;
    this.mood={dark:0,ex:0,pale:0};this.eyeA=[rand(-1,1),rand(-1,1)];this.eyeT=[0,0];this.eyeN=[0,0];this.cr=null;this.updateColors();
  }
  updateColors(){
    const P=PAL.cham,m=this.mood,mix=(a,b,t)=>t<=0.001?a:a.map((c,i)=>mixc(c,b[i],t));
    let body=mix(P.body,P.exBody,m.ex*0.7),band=mix(P.band,P.exBand,m.ex);
    body=mix(body,P.pale,m.pale);band=mix(band,P.pale,m.pale*0.8);
    body=mix(body,P.dark,m.dark);band=mix(band,P.dark,m.dark*0.85);
    this.cr={body,band,stripe:mix(P.stripe,P.dark,m.dark*0.6)};
  }
  color(m,q,s,l,x,y){const C=this.cr;
    switch(m){
      case M.BODY:{
        if(Math.abs(l)>0.48&&Math.abs(l)<0.72&&s>4.5&&s<this.len*0.5)return C.stripe[q];
        if(s<4.6)return(hash(x*3,y*5)>0.78?C.band:C.body)[q];
        return((Math.floor((s-4.6)/3.2)&1)?C.band:C.body)[q];}
      case M.LIMB:return C.body[q];
      case M.TOE:return C.band[q];
      case M.EYE:return((hash(x*5,y*3)>0.7)?C.band:C.body)[q];
      case M.LID:return C.body[q];
      case M.TONGUE:return PAL.tongue[q];
    }return INK;}
  flick(){}
  follow(){
    const P=this.pts,seg=this.seg,mb=this.sp.maxBend,i0=Math.floor(this.n*0.55);let prev=this.headAng+Math.PI;
    for(let i=1;i<this.n;i++){const q=P[i-1],p=P[i];
      let a=Math.atan2(p.y-q.y,p.x-q.x);a=prev+clamp(wrapA(a-prev),-mb,mb);
      if(i>=i0&&this.curl>0.01){const k=(i-i0)/(this.n-i0),tgt=prev+this.curlDir*(0.22+0.62*k);a+=wrapA(tgt-a)*this.curl;}
      p.x=q.x+Math.cos(a)*seg;p.y=q.y+Math.sin(a)*seg;p.px=p.x;p.py=p.y;prev=a;}
  }
  integrate(dt){// hesitant, rocking steps like a leaf in the breeze
    const s=this.speed,k=this.state==='flee'?1:0.3+0.7*Math.max(0,Math.sin(this.t*3.2));this.speed=s*k;super.integrate(dt);this.speed=s;
  }
  canStrike(p){const m=this.mouthScreen(),d=Math.hypot(p.x-m.x,p.y-p.h-m.y),hd=this.pts[0];
    return d<27&&p.h<20&&Math.abs(wrapA(Math.atan2(p.y-hd.y,p.x-hd.x)-this.ang))<0.32;}
  startStrike(p){const miss=Math.random()<(p.h>2?0.2:0.06),m=this.mouthScreen();
    this.tg={t:0,p,caught:false,tx:m.x,ty:m.y,ox:miss?rand(-6,6):0,oy:miss?rand(-6,6):0,fx:null,fy:null};if(!this.preview)SFX.play('thwip');}
  updateStrike(dt){
    const T=this.tg;if(!T)return 'miss';T.t+=dt;this.stop(dt);const m=this.mouthScreen(),p=T.p;
    const OUT=0.09,HOLD=0.05,IN=0.2,ps={x:p.x+T.ox,y:p.y-p.h+T.oy};
    if(T.t<OUT){const k=T.t/OUT;T.tx=lerp(m.x,ps.x,k);T.ty=lerp(m.y,ps.y,k);}
    else if(T.t<OUT+HOLD){if(T.fx===null){T.tx=T.fx=ps.x;T.ty=T.fy=ps.y;
        if(!p.dead&&!p.caught&&Math.hypot(p.x-T.tx,p.y-p.h-T.ty)<4.5){T.caught=true;p.caught=true;catchFx(this,p);}}}
    else{const k=Math.min(1,(T.t-OUT-HOLD)/IN);T.tx=lerp(T.fx,m.x,ease(k));T.ty=lerp(T.fy,m.y,ease(k));
      if(k>=1){this.tg=null;if(T.caught){this.held=p;return 'caught';}return 'miss';}}
    if(T.caught){p.sx=T.tx;p.sy=T.ty;}
    return null;
  }
  update(dt){
    super.update(dt);
    const st=this.state,m=this.mood,k=Math.min(1,dt*1.6);
    m.dark+=((st==='grabbed'||st==='fall'||st==='flee'?1:0)-m.dark)*k;
    m.ex+=((st==='hunt'||st==='strike'||st==='chew'||st==='dance'?1:0)-m.ex)*k;
    m.pale+=((st==='sleeping'?1:0)-m.pale)*Math.min(1,dt*0.6);
    this.updateColors();
    this.curl+=((this.speed<1.5&&st!=='grabbed'?1:0)-this.curl)*Math.min(1,dt*1.3);
    for(let i=0;i<2;i++){this.eyeT[i]-=dt;
      if(this.prey&&(st==='hunt'||st==='strike')){const hd=this.pts[0];this.eyeN[i]=clamp(wrapA(Math.atan2(this.prey.y-hd.y,this.prey.x-hd.x)-this.headAng),-1.6,1.6);}
      else if(this.eyeT[i]<=0){this.eyeT[i]=rand(0.5,2.2);this.eyeN[i]=rand(-1.7,1.7);}
      this.eyeA[i]+=(this.eyeN[i]-this.eyeA[i])*Math.min(1,dt*8);}
  }
  drawEyes(fb,oy){
    const sp=this.sp,e=this.pointAt(sp.eyeS),px=-e.fy,py=e.fx,closed=this.eyesClosed||this.blink>0;
    [-1,1].forEach((sd,i)=>{const ex=e.x+px*sd*e.r*sp.eyeOut,ey=e.y+py*sd*e.r*sp.eyeOut+oy;
      fb.cap(ex,ey,sp.eyeR,ex,ey,sp.eyeR,M.EYE,3);
      if(!closed){const a=this.headAng+this.eyeA[i],qx=ex+Math.cos(a)*0.9,qy=ey+Math.sin(a)*0.9;fb.cap(qx,qy,.55,qx,qy,.55,M.PUPIL,3,0,0,2);}});
  }
  drawTongue(fb,oy){
    if(!this.tg)return;const m=this.mouthScreen(),T=this.tg;
    fb.cap(m.x,m.y,.75,T.tx,T.ty,.8,M.TONGUE,5);fb.cap(T.tx,T.ty,1.7,T.tx,T.ty,1.7,M.TONGUE,5);
  }
}

// =====================================================================
//  Bearded dragon: a broad, flat Walker with a spiky beard collar, flank fringes,
//  a diamond-patterned back, head bobs, arm waves, beard puffs and pancake basking.
// =====================================================================
class Dragon extends Walker{
  constructor(world,x,y){
    super(world,'dragon',x,y);this.puff=0;this.puffT=0;this.pan=0;this.bobT=0;this.bobPh=0;this.waveT=0;this.waveSide=1;this.warm=0;this.cool=0;this.lastSt='idle';this.cr=null;this.headEnd=this.len*0.13;this.updateColors();
  }
  updateColors(){const P=PAL.dragon,mix=(a,b,t)=>t<=0.001?a:a.map((c,i)=>mixc(c,b[i],t)),w=this.warm,c=this.cool;
    const warmUp=r=>mix(r,r.map(v=>mixc(v,hex('#ffd89a'),0.35)),w),cool=r=>mix(r,P.dull,c*0.55);
    this.cr={base:cool(warmUp(P.base)),dark:cool(P.dark),light:cool(warmUp(P.light)),head:cool(warmUp(mix(P.base,P.orange,0.32))),orange:cool(P.orange),
      beard:mix(mix(P.base,P.dark,0.5),P.beard,this.puff),tip:cool(P.light),eye:P.eye};}
  color(m,q,s,l,x,y){const C=this.cr,al=Math.abs(l),hs=hash(x*3,y*5);
    switch(m){
      case M.BODY:{const he=this.headEnd,tail=this.len*0.52;
        if(s<he){// head plate: warm, a dark stripe through the eye line, pale crown scales
          if(s>2.2&&s<4.2&&al>0.52&&al<0.86)return C.dark[q];if(al<0.28&&s>1.2&&hs>0.62)return C.light[Math.min(3,q+1)];return C.head[q];}
        if(s<tail){// back: two rows of pale diamonds, dark spine line, dark mottled flanks
          const k=(((s-he-0.4)%4.2)+4.2)%4.2/4.2,wd=0.24*(1-Math.abs(k-0.5)*2);
          const dd=Math.abs(al-0.36);if(dd<wd)return C.light[Math.min(3,q+1)];if(dd<wd+0.07&&wd>0.05)return C.dark[q];
          if(al<0.08)return C.dark[q];
          if(al>0.62){const m2=hash(Math.floor(s/1.3),l>0?3:5);if(m2>0.5)return C.dark[q];if(al>0.84)return C.orange[q];}
          return(hs>0.93?C.light:C.base)[q];}
        const band=Math.floor((s-tail)/2.2)%2===0;return(band?C.dark:C.base)[q];}
      case M.LIMB:return(hs>0.9?C.light:C.base)[q];
      case M.TOE:return C.dark[q];
      case M.CLAW:return(s>0.55?C.tip:C.base)[q];// flank + head spikes: pale tips
      case M.CLAW2:return(s>0.6&&this.puff<0.5?C.tip:C.beard)[q];
      case M.EYE:return C.eye[q];
      case M.LID:return C.head[q];

  constructor(x,y,h=0,type='worm'){super();this.initFood(type,x,y,h);this.wax=type==='waxworm';

    this.ang+=(curling?2.4:this.turnV)*dt;
    if(s)this.ang+=wrapA(Math.atan2(this.y-s.hd.y,this.x-s.hd.x)-this.ang)*dt*2;
    const sp=(this.h>0?0:1)*(this.wax?(curling?3:1.6):4.5)*pulse;

  }
  drawShadow(fb){if(this.caught)return;if(this.inHand||this.h>0.5)ddisc(fb,this.x+1,this.y+1,2.4,.62);}

      case 'spore':p.ph+=dt*3;p.x+=(p.vx+Math.sin(p.ph)*3)*dt;p.y+=p.vy*dt;p.vx*=1-dt*0.8;p.vy*=1-dt*0.4;break;

      case 'mist':p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=1-dt*2;p.vy*=1-dt*2;break;
      case 'fdrop':p.vh-=120*dt;p.h+=p.vh*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.h<=1.8)p.life=0;break;

function hexRGB(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}

    ell(cx,cy,rx,ry,c){for(let y=0;y<N;y++)for(let x=0;x<N;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1)G[y*N+x]=c;}},
    disc(cx,cy,r,c){g.ell(cx,cy,r,r,c);},erase(cx,cy,rx,ry){g.ell(cx,cy,rx,ry,null);},
    rect(x0,y0,x1,y1,c){for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)g.px(x,y,c);},
    line(x0,y0,x1,y1,c,w=1){const n=Math.ceil(Math.hypot(x1-x0,y1-y0)*2)+1;for(let i=0;i<=n;i++){const t=i/n,x=x0+(x1-x0)*t,y=y0+(y1-y0)*t;if(w<=1)g.px(x,y,c);else g.disc(x,y,w/2,c);}}};
  fn(g);
  const solid=(x,y)=>inb(x,y)&&G[y*N+x]&&G[y*N+x][0]!=='~';
  const c=document.createElement('canvas');c.width=N;c.height=N;const X=c.getContext('2d');
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const v=G[y*N+x];
    if(v&&v[0]==='~'){X.fillStyle=v.slice(1);X.fillRect(x,y,1,1);continue;}
    if(!v){if(solid(x-1,y)||solid(x+1,y)||solid(x,y-1)||solid(x,y+1)){X.fillStyle='#0b100b';X.fillRect(x,y,1,1);}continue;}
    const lit=!solid(x,y-1)||!solid(x-1,y),shd=!solid(x,y+1)||!solid(x+1,y);

}

    if(!q&&FUN('food')&&DRAWER.on){if(!save.set.pluckTip){save.set.pluckTip=true;flash('Pluck food straight out of the little tanks below and drag it in.');}return;}
    if(!q){if(w.prey.length>=12){flash('That is plenty of food for now.');return;}if(!buyFood(game.food))return;
      q=makeFood(game.food,x,y+8,8);q.__new=true;q.paid=FOOD_PRICE[game.food]||0;if(q.pts)q.toScreen();w.prey.push(q);if(q.type==='fly')SFX.play('buzz');}
    else if(q.pts)q.toScreen();
    q.inHand=true;q.hidden=false;q.vh=0;q.sx=x;q.sy=y;q.x=x;q.y=y+8;q.h=8;if(q.type==='snail')q.hideT=0;game.held=q;game.heldT=performance.now();game.heldNew=q.__new?q:null;q.__new=false;SFX.play('tick');
  }else if(tool==='scoop'){scoopAt(x,y,true);
  }else if(tool==='grab'){
    if(pet.tryGrab(x,y)){game.grabbing=true;w.stats.happy=Math.max(0,w.stats.happy-1.4*(1.2-pet.mind.bold));SFX.play('squeak');}
    else{const o=objectAt(x,y);if(o){game.dragObj=o;o.dragged=true;o.vx=o.vy=0;o.h=0;SFX.play('tick');}}
  }
  else if(tool==='mist')SFX.mistOn(true);
  else if(tool==='tap')knockAt(x,y);
});
// a knuckle on the glass: rings on the glass, a little shake, the critter reacts, bugs scatter, toys hop
function knockAt(x,y){const w=game.world,pet=w.pet;game.knockT=0.22;
    w.glassRings.push({x,y,age:0});game.shake=0.22;SFX.play('tink');
    const hd=pet.headPos(),tapD=Math.hypot(hd.x-x,hd.y-y);pet.reactTap(x,y,tapD);if(tapD<120)w.stats.happy=Math.max(0,w.stats.happy-3*(1.4-pet.mind.bold));
    for(const q of w.prey){if(q.type==='cricket'&&q.h===0&&!q.caught){q.timer=0;}if(q.type==='fly'){q.landT=0;q.ang=Math.atan2(q.y-y,q.x-x);}}
    for(const t of w.toys)if(Math.hypot(t.x-x,t.y-y)<40&&!t.dragged){t.vh=rand(10,25);t.h=0.1;}
    for(const pl of w.plants)pl.dist=1;
}
// ---- Fun mode: with no tool in hand, your bare hand does the petting, picking up and knocking
const HAND={
 open:["..k.k.k.k..","khkpkpkpk..","kpkpkpkpk..","kpkpkpkpkk.","kpspspspkhk","khpppppppk.",".kpppppppk.","..kpppppk..","...kkkkk..."],
 rub:["...........","..k.k.k.k..","khkpkpkpk..","kpkpkpkpkk.","kpspspspkhk","khpppppppk.",".kpppppppk.","..kpppppk..","...kkkkk..."],
 close:["...........","...........",".kkkkkkk...","khkhkhkhk..","kpspspspkk.","khppppppkhk",".kpppppppk.","..kpppppk..","...kkkkk..."],
 carry:["...........",".kkkkkkk...","khkhkhkhk..","kpkpkpkpk..","kskskskskk.","khppppppkhk",".kpppppppk.","..kpppppk..","...kkkkk..."],
 knock:["...........","..kkkkk....",".khpspsk...","khpspsppk..","kppppppkk..","khpppppkhk.",".kppppppk..","..kppppk...","...kkkk...."],
};
const FUN_PIECES=[{id:'food',name:'Food',fun:'Supply tanks you pluck food from'},{id:'tools',name:'Tools',fun:'Your hand + a pegboard of real tools'},{id:'needs',name:'Needs',fun:'Gauges on the glass; grime shows a dirty tank'},{id:'coins',name:'Coins',fun:'A coin jar that fills up'}];
const FUN=k=>!!(save.set&&save.set.fun&&save.set.fun[k]);
const HAND_PAL={k:hex('#1a0f0a'),p:hex('#f3c2a6'),s:hex('#cf8f78'),h:hex('#fff0e0')},HOLD_T=0.42;
function funHand(){return FUN('tools')&&!game.tool&&!game.placing&&game.mode==='play';}
function onRim(x,y){const B=game.world.bounds;return x<B.x0-1||x>B.x1+1||y<B.y0-1||y>B.y1+1;}
function rimPoint(x,y){const T=TANK,dl=x-T.x0,dr=T.x1-x,dt=y-T.y0,db=T.y1-y,m=Math.min(dl,dr,dt,db);
  return m===dl?[T.x0+2,clamp(y,T.y0,T.y1)]:m===dr?[T.x1-2,clamp(y,T.y0,T.y1)]:m===dt?[clamp(x,T.x0,T.x1),T.y0+2]:[clamp(x,T.x0,T.x1),T.y1-2];}
function handDown(e){const[x,y]=toPix(e),w=game.world,pet=w.pet,P=game.pointer,now=performance.now();
  P.x=x;P.y=y;P.inside=true;P.touch=e.pointerType==='touch';P.vx=P.vy=0;P.lt=now;P.rub=P.rub||0;P.moved=0;
  if(onRim(x,y)){const[kx,ky]=rimPoint(x,y);knockAt(kx,ky);game.lastTap=null;return true;}
  if(pet&&pet.hitTest(x,y)>=0){P.down=true;game.hand={mode:'touch',t:0,dist:0};return true;}
  const o=objectAt(x,y);if(o){P.down=true;game.hand={mode:'obj',o,t:0,dist:0};return true;}
  const L=game.lastTap;if(L&&now-L.t<380&&Math.hypot(L.x-x,L.y-y)<16){game.lastTap=null;knockAt(x,y);return true;}
  game.lastTap={t:now,x,y};return false;}
function handStep(dt){const H=game.hand,P=game.pointer,w=game.world,pet=w.pet;if(game.knockT>0)game.knockT-=dt;if(!H||!P.down)return;
  H.t+=dt;H.dist+=P.moved;
  if(H.mode==='touch'){if(H.dist>2.5)H.mode='rub';
    else if(H.t>HOLD_T){if(pet.tryGrab(P.x,P.y)){game.grabbing=true;w.stats.happy=Math.max(0,w.stats.happy-1.4*(1.2-pet.mind.bold));SFX.play('squeak');H.mode='carry';game.shake=Math.max(game.shake||0,0.06);}else H.mode='rub';}}
  else if(H.mode==='obj'&&H.dist>3){const o=H.o;game.dragObj=o;o.dragged=true;o.vx=o.vy=0;o.h=0;SFX.play('tick');H.mode='drag';}}
function handUp(){const H=game.hand;game.hand=null;if(!H)return;if(H.mode==='obj'&&H.o.onClick)H.o.onClick(game.world);
  else if(H.mode==='touch'&&H.t<HOLD_T){const pet=game.world.pet;if(pet.petMe&&pet.petMe()){const P=game.pointer;P.rub=(P.rub||0)+3;}}}
function drawHand(w){const P=game.pointer,H=game.hand,x=Math.round(P.x),y=Math.round(P.y);let spr=HAND.open,lift=3;
  if(game.grabbing||(H&&H.mode==='drag')){spr=HAND.carry;lift=5;}
  else if(H&&H.mode==='touch'&&H.t>0.12){spr=HAND.close;lift=1;}
  else if(H&&H.mode==='rub'){spr=Math.floor(w.t*9)%2?HAND.rub:HAND.open;lift=1;}
  else if(game.knockT>0||onRim(P.x,P.y)){spr=HAND.knock;lift=game.knockT>0.11?0:game.knockT>0?1:3;}
  const ox=x-5,oy=y-3-(spr===HAND.open||spr===HAND.rub?0:2);
  for(let j=0;j<spr.length;j++)for(let i=0;i<spr[j].length;i++)if(spr[j][i]!=='.')pdark(fb,ox+i+lift,oy+j+lift+1,0.72);
  sprite(fb,spr,ox,oy,HAND_PAL);
  if(H&&H.mode==='touch'&&H.t>0.12){const f=clamp((H.t-0.12)/(HOLD_T-0.12),0,1),n=Math.ceil(f*16);for(let i=0;i<n;i++){const a=-Math.PI/2+i/16*TAU;pset(fb,x+Math.cos(a)*7.5,y+1+Math.sin(a)*6.5,hex(f>=1?'#9ccf6a':'#ffe066'));}}
  if(game.knockT>0.1){const k=(game.knockT-0.1)/0.12;for(const[a,b]of[[-1,-1],[1,-1],[-1,1]])line(fb,x-6+a*(3+k*3),y-2+b*(3+k*3),x-6+a*(5+k*4),y-2+b*(5+k*4),CUR_PAL.w);}
}
canvas.addEventListener('pointermove',e=>{
  if(e.pointerType==='touch'&&touches.has(e.pointerId)){touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&touches.size>=2){movePinch();return;}if(pinch||touchBlock)return;}
  if(game.panning){panBy(e.clientX-game.panning.x,e.clientY-game.panning.y);game.panning.x=e.clientX;game.panning.y=e.clientY;return;}
  game.pointer.cx=e.clientX;game.pointer.cy=e.clientY;
  if(game.held){const tb=$('trashBtn');if(tb)tb.classList.toggle('hot',overTrash(e.clientX,e.clientY));}
  const P=game.pointer,[x,y]=toPix(e),now=performance.now(),dt=Math.max(8,now-P.lt)/1000;
  P.vx=lerp(P.vx,(x-P.x)/dt,0.5);P.vy=lerp(P.vy,(y-P.y)/dt,0.5);P.lt=now;const mv=Math.hypot(x-P.x,y-P.y);P.moved+=mv;if(mv>0.6)P.stillT=0;P.x=x;P.y=y;P.inside=true;P.touch=e.pointerType==='touch';});
// buying food: returns false (with a friendly note) if you can't afford it
function buyFood(f){const c=FOOD_PRICE[f]||0;if(save.coins<c){flash(`${FOODS[f].name[0].toUpperCase()+FOODS[f].name.slice(1)} costs ${c} coins. Pet ${game.name} or finish goals to earn more!`);SFX.play('tick');return false;}
  if(c){save.coins-=c;markDirty();ui.bumpCoins();ui.trayAfford();if(c>=5)track('treats');}return true;}
function refundFood(q){if(q&&q.paid){save.coins+=q.paid;q.paid=0;markDirty();ui.bumpCoins();ui.trayAfford();}}
function trashFood(q){const w=game.world,i=w.prey.indexOf(q);if(i<0)return;if(q.inHand)refundFood(q);w.prey.splice(i,1);q.dead=true;if(game.held===q)game.held=null;
  dust(w,q.x,q.y-(q.h||0),7);}
function trashAll(){const w=game.world,L=w.prey.filter(q=>!q.caught);
  if(!L.length){ui.toast('No food in the tank to clear.',true);SFX.play('tick');return;}
  for(const q of L)trashFood(q);SFX.play('thunk');ui.toast(`Cleared ${L.length} food${L.length>1?'s':''} from the tank.`,true);}
function overTrash(cx,cy){const t=$('trashBtn');if(!t||t.offsetParent===null||cx===undefined||ui.tuck)return false;const r=t.getBoundingClientRect();return cx>=r.left-6&&cx<=r.right+6&&cy>=r.top-6&&cy<=r.bottom+6;}
function dropHeld(){const q=game.held;if(!q)return;game.held=null;q.inHand=false;q.paid=0;q.h=8;q.vh=0;
  if(q.pts){q.toWorld(8);q.x=q.pts[0].x;q.y=q.pts[0].y;}if(q.type==='fly')q.targetH=rand(10,20);
  const w=game.world;if(w){w.foodMem=w.foodMem||[];w.foodMem.push({x:q.x,y:q.y});if(w.foodMem.length>4)w.foodMem.shift();}}
function up(){const P=game.pointer;P.down=false;SFX.mistOn(false);handUp();
  const tb=$('trashBtn');if(tb)tb.classList.remove('hot');
  if(game.held&&overTrash(P.cx,P.cy)){const q=game.held,pd=q.paid;trashFood(q);SFX.play('thunk');ui.toast(`Threw away the ${FOODS[q.type].name.replace(/^an? /,'')}${pd?` (refunded ${pd})`:''}.`,true);}
  dropHeld();
  if(game.grabbing){game.world.pet.release();game.grabbing=false;}
  if(game.dragObj){const o=game.dragObj;o.dragged=false;if(o instanceof Decor)[o.x,o.y]=landSnap(game.world,o.x,o.y);else if(waterAt(game.world,o.x,o.y)>0)game.world.ripples.push({x:o.x,y:o.y,age:0});if(o instanceof Toy){o.vx=clamp(P.vx*0.5,-150,150);o.vy=clamp(P.vy*0.5,-150,150);const sp=Math.hypot(o.vx,o.vy);o.vh=Math.min(45,sp*0.25);o.h=0.1;}
    SFX.play('place');game.dragObj=null;markDirty();}}
function pointerEnd(e){
  if(game.panning&&(e.pointerType==='mouse'||game.panning.free)){const pn=game.panning;game.panning=null;if(e.pointerType==='touch')touches.delete(e.pointerId);
    if(pn.free){if(Math.hypot(e.clientX-pn.sx,e.clientY-pn.sy)>=6)game.lastTap=null;canvas.style.cursor=game.tool||FUN('tools')?'none':'grab';if(pn.obj&&pn.obj.onClick&&Math.hypot(e.clientX-pn.sx,e.clientY-pn.sy)<6)pn.obj.onClick(game.world);}return;}
  if(e.pointerType==='touch'){touches.delete(e.pointerId);
    if(pinch){if(touches.size<2){pinch=null;touchBlock=touches.size>0;}return;}
    if(touchBlock){if(touches.size===0)touchBlock=false;return;}}
  up();}
canvas.addEventListener('pointerup',pointerEnd);canvas.addEventListener('pointercancel',pointerEnd);
canvas.addEventListener('pointerleave',()=>{if(!game.pointer.down)game.pointer.inside=false;});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(game.placing){game.placing=null;ui.toast('Placement cancelled.',true);}else if(FUN('tools')&&game.tool&&!ui.open){setTool(null);}else if(ui.revealShown)ui.hideReveal();else if(ui.open&&!game.firstRun)ui.close();return;}
  if(ui.open||game.mode!=='play'||e.target.tagName==='INPUT')return;
  if(e.key==='+'||e.key==='='){setZoom(cam.z*1.35);return;}if(e.key==='-'||e.key==='_'){setZoom(cam.z/1.35);return;}if(e.key==='0'){camReset();return;}
  const k=e.key.toLowerCase(),map={'1':'feed','2':'pet','3':'grab','4':'mist','5':'scoop','6':'tap','7':'play'};
  if(FUN('tools')&&(k==='2'||k==='3'||k==='6')){if(game.tool)setTool(null);return;}
  if(map[k])ui.toolClick(map[k]);else if(k==='l')toggleLight();
  else if(k==='m'){save.set.sfx=!save.set.sfx;SFX.setMuted(!save.set.sfx);$('setSfx').classList.toggle('on',save.set.sfx);markDirty();ui.toast(save.set.sfx?'Sound effects on':'Sound effects off',true);}
  else if(k==='o')ui.openModal('mGoals');else if(k==='b')ui.openModal('mBag');else if(k==='g')ui.openModal('mGacha');else if(k==='p')ui.openModal('mPets');
  else if(k==='f'){const fs=FOOD_ORDER;game.food=fs[(fs.indexOf(game.food)+1)%fs.length];ui.foodCat=null;if(game.tool!=='feed')setTool('feed');else ui.renderTray();}
});
// CSS zoom (UI scale) also scales these fixed offsets, so positions are divided by it
const uiZ=el=>parseFloat(el.style.zoom)||1;
function placeZoomChip(x,y){const zc=$('zoomChip'),Z=uiZ(zc),r=zc.getBoundingClientRect();
  zc.style.right='auto';zc.style.left=Math.round(clamp(x,4,innerWidth-r.width-4)/Z)+'px';zc.style.top=Math.round(clamp(y,4,innerHeight-r.height-4)/Z)+'px';}
function camReset(){cam.follow=innerHeight>innerWidth*1.1;cam.z=1;camCenterOn(W/2,H/2,1);}
function fit(){
  const vw=innerWidth,vh=innerHeight,small=vw<=760;
  // the tank covers the whole window; HUD floats on top
  let base=Math.max(vw/W,vh/H);if(save.set.pixel)base=Math.ceil(base);
  const cw=W*base,ch=H*base,f=cam.init?cw/cam.cw:1;
  if(cam.init){const cxw=(vw/2-cam.tx)/(cam.cw*cam.z),cyw=(vh/2-cam.ty)/(cam.ch*cam.z);cam.cw=cw;cam.ch=ch;cam.tx=vw/2-cxw*cw*cam.z;cam.ty=vh/2-cyw*ch*cam.z;}
  cam.cw=cw;cam.ch=ch;cam.zmin=Math.min(1,Math.min(vw/W,vh/H)/base);
  canvas.style.width=cw+'px';canvas.style.height=ch+'px';
  const topH=$('top').getBoundingClientRect().bottom,dockH=vh-$('dock').getBoundingClientRect().top;
  cam.mT=Math.round(topH+6);cam.mB=Math.round(dockH+64);
  $('toast').style.top=Math.round((topH+8)/uiZ($('toast')))+'px';
  const zc=$('zoomChip'),zp=save.set.zoomPos,ZC=uiZ(zc);
  if(zp)placeZoomChip(zp[0]*vw,zp[1]*vh);else{zc.style.left='auto';zc.style.right=Math.round(8/ZC)+'px';zc.style.top=Math.round(Math.max(topH+8,(vh-zc.getBoundingClientRect().height)/2)/ZC)+'px';}
  if(!cam.init){cam.init=true;camReset();}else camApply();
}
window.addEventListener('resize',fit);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&game.kind)writeSave();});
window.addEventListener('pagehide',()=>{if(game.kind)writeSave();});

// =====================================================================
//  Boot
// =====================================================================
let last=performance.now(),staticDrawn=false;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(game.mode==='play'){updatePlay(dt);renderPlay();camFollow(dt);}
  else if(!staticDrawn&&R.bg){fb.px.set(R.bg);for(let k=0;k<R.frameIdx.length;k++){const i=R.frameIdx[k];fb.px[i]=R.frame[i];}applyLight(1);ctx.putImageData(fb.img,0,0);staticDrawn=true;}
  ui.tick(dt);
  requestAnimationFrame(frame);
}
loadSave();SFX.setVolume(save.set.vol);SFX.setMuted(!save.set.sfx);SFX.setMusic(save.set.music);
game.world=createWorld();setTank(save.cur&&SPECIES[save.cur]?habitatOf(save.cur):'terra',true);
ui.init();ui.coinShown=save.coins;$('coinNum').textContent=save.coins;fit();
const away=applyAway();
if(save.cur&&SPECIES[save.cur]){startGame(save.cur,true);if(away)showWelcome(away);}else{game.firstRun=true;ui.openModal('mPets');}
fit();ui.renderTray();
requestAnimationFrame(frame);
</script>
